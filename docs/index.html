/* ---------- markdown ---------- */
var mdCache={};
function renderMd(src,key){
  if(key&&mdCache[key])return mdCache[key];
  var out;
  try{
    out=(window.marked&&window.marked.parse)
      ? window.marked.parse(src,{mangle:false,headerIds:false,breaks:false})
      : '<pre>'+esc(src)+'</pre>';
  }catch(e){out='<pre>'+esc(src)+'</pre>';}
  if(key)mdCache[key]=out;
  return out;
}
function highlightIn(root){
  if(!window.hljs)return;
  var blocks=root.querySelectorAll("pre code:not([data-hl])");
  for(var i=0;i<blocks.length;i++){
    blocks[i].setAttribute("data-hl","1");
    try{window.hljs.highlightElement(blocks[i]);}catch(e){}
  }
}

/* ---------- concepts ---------- */
function conceptCard(c){
  var parts=c.parts&&c.parts.length?c.parts:null;
  var units=conceptUnits(c);
  var cd=0;units.forEach(function(u){if(isDone(u.id))cd++;});
  var open=!!openSec[c.id];
  var s=st(c.id), hasNote=!!(s.note&&s.note.trim());
  var allDone=cd===units.length&&units.length>0;

  var h='<section class="section'+(open?" open":"")+'" data-sec="'+esc(c.id)+'">'+
    '<div class="sec-head" style="cursor:default">';
  if(parts){
    // container: no tick of its own, it shows how many of its subsections are read
    h+='<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>';
  }else{
    h+='<button class="tick" data-tick="'+esc(c.id)+'" aria-pressed="'+isDone(c.id)+
       '" aria-label="Mark concept as read"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9 10.5 2.8"/></svg></button>';
  }
  h+='<button class="sec-title" data-sechead="'+esc(c.id)+'" style="background:none;border:0;text-align:left;padding:0;font:inherit;font-weight:600;cursor:pointer">'+
      esc(c.title)+(hasNote?' <span class="tag has-note">note</span>':'')+'</button>'+
    (parts?'<span class="sec-bar'+(allDone?" done":"")+'"><i style="width:'+
      (units.length?cd/units.length*100:0)+'%"></i></span>'+
      '<span class="sec-count tnum">'+cd+'/'+units.length+'</span>':'')+
    '<button class="mini" data-sechead="'+esc(c.id)+'" aria-expanded="'+open+'">'+
      (open?"Hide":(parts?"Open":"Read"))+'</button>'+
    (parts?'':'<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>')+
    '</div><div class="sec-body">';

  if(open){
    if(c.content&&c.content.trim())
      h+='<div class="concept-body"><div class="md" data-md="1">'+renderMd(c.content,c.id)+'</div></div>';
    if(parts){
      parts.forEach(function(pt){h+=conceptPart(pt,0);});
    }else{
      h+='<div class="concept-body"><div class="concept-foot" style="border-top:0;margin-top:0;padding-top:0">'+
        '<button class="mini" data-detail="'+esc(c.id)+'" aria-expanded="'+(!!openDetail[c.id])+'">My notes</button>'+
        '<button class="btn-ghost" data-tick="'+esc(c.id)+'" style="padding:5px 11px;font-size:12.5px">'+
          (isDone(c.id)?"Marked as read \u2713":"Mark as read")+'</button></div>'+
        (openDetail[c.id]?noteBlock(c.id,null):'')+'</div>';
    }
  }
  h+='</div></section>';
  return h;
}

/* One heading node at any depth. A node with children is a container with a
   counter; a leaf is tickable. Depth only changes the indent. */
function conceptPart(node,depth){
  depth=depth||0;
  var kids=node.children&&node.children.length?node.children:null;
  var units=leafUnits(node), cd=0;
  units.forEach(function(u){if(isDone(u.id))cd++;});
  var open=!!openSec[node.id];
  var s=st(node.id), hasNote=!!(s.note&&s.note.trim());
  var done=isDone(node.id);
  var pad=18+depth*16;

  var h='<div class="part'+(!kids&&done?" is-done":"")+'" data-depth="'+depth+'">'+
    '<div class="part-head" style="padding-left:'+pad+'px">';
  if(kids){
    h+='<span class="part-chev'+(open?" open":"")+'">'+
       '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>';
  }else{
    h+='<button class="tick" data-tick="'+esc(node.id)+'" aria-pressed="'+done+
       '" aria-label="Mark as read"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9 10.5 2.8"/></svg></button>';
  }
  h+='<button class="part-title" data-sechead="'+esc(node.id)+'">'+esc(node.title)+
      (hasNote?' <span class="tag has-note">note</span>':'')+'</button>'+
    (kids?'<span class="sec-bar'+(cd===units.length?" done":"")+'"><i style="width:'+
      (units.length?cd/units.length*100:0)+'%"></i></span>'+
      '<span class="sec-count tnum">'+cd+'/'+units.length+'</span>':'')+
    '<button class="mini" data-sechead="'+esc(node.id)+'" aria-expanded="'+open+'">'+
      (open?"Hide":(kids?"Open":"Read"))+'</button>'+
    '</div>';

  if(open){
    if(node.content&&node.content.trim())
      h+='<div class="part-body" style="padding-left:'+(pad+29)+'px">'+
         '<div class="md" data-md="1">'+renderMd(node.content,node.id)+'</div>'+
         (kids?'':'<div class="concept-foot">'+
           '<button class="mini" data-detail="'+esc(node.id)+'" aria-expanded="'+
             (!!openDetail[node.id])+'">My notes</button></div>'+
           (openDetail[node.id]?noteBlock(node.id,null):''))+
         '</div>';
    else if(!kids)
      h+='<div class="part-body" style="padding-left:'+(pad+29)+'px">'+
         '<div class="concept-foot" style="border-top:0;padding-top:0;margin-top:0">'+
         '<button class="mini" data-detail="'+esc(node.id)+'" aria-expanded="'+
           (!!openDetail[node.id])+'">My notes</button></div>'+
         (openDetail[node.id]?noteBlock(node.id,null):'')+'</div>';
    if(kids)kids.forEach(function(ch){h+=conceptPart(ch,depth+1);});
  }
  return h+'</div>';
}

function tagEditor(id){
  var mine=st(id).tags.length;
  var h='<h4>Tags'+(mine?' <span style="text-transform:none;letter-spacing:0;font-weight:400">'+
    '\u2014 \u00d7 removes it from this problem</span>':'')+'</h4>'+

       (tg.implicit?'':'<button class="x" data-tagdel="'+esc(id)+'" data-tagname="'+esc(tg.name)+
        '" title="Remove tag" aria-label="Remove tag">\u00d7</button>')+'</span>';
  });
  h+='</div><div class="tag-add">'+
    '<input type="text" data-tagnew="'+esc(id)+'" list="tagList" maxlength="32" '+
    'placeholder="Add a tag, then press Enter">'+

}
function noteBlock(id,url){
  var s=st(id);
  return '<div style="margin-top:12px">'+tagEditor(id)+'<h4>My notes</h4>'+
    '<textarea class="note-area" id="na-'+esc(id)+'" data-note="'+esc(id)+'" '+
    'placeholder="Approach, invariant, what tripped you up, the date to retry…">'+esc(s.note||"")+'</textarea>'+
    '<div class="note-foot"><span data-notestatus="'+esc(id)+'"></span>'+
    (url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">Open problem ↗</a>':'<span></span>')+
    '</div></div>';

/* ---------- problems ---------- */
var TIER={basic:"Basic",core:"Core",pro:"Pro"};

/* Where a problem's link comes from, in order:
   1. one you saved yourself   2. the generated one   3. nothing.
   A generated "search" link counts as a placeholder, not a real link. */
function detectKind(url){
  var u=String(url||"").toLowerCase();
  if(u.indexOf("leetcode.com/problems/")>=0)return "leetcode";
  if(u.indexOf("leetcode.com")>=0)return "leetcode";
  if(u.indexOf("geeksforgeeks.org")>=0)return "gfg";
  if(u.indexOf("takeuforward.org")>=0)return "tuf";
  if(u.indexOf("codeforces.com")>=0||u.indexOf("hackerrank.com")>=0||
     u.indexOf("interviewbit.com")>=0||u.indexOf("codingninjas.com")>=0||
     u.indexOf("naukri.com")>=0)return "other";
  return "other";
}
function effLink(it){
  var s=st(it.id);
  if(s.link)return {url:s.link,kind:s.linkKind||detectKind(s.link),mine:true};
  if(it.url)return {url:it.url,kind:it.urlKind||"search",mine:false};
  return {url:"",kind:"",mine:false};
}
function needsLink(it){
  var l=effLink(it);
  return !l.url||(l.kind==="search"&&!l.mine);
}
function lcSearchUrl(it){
  if(it.url&&it.urlKind==="search")return it.url;
  if(it.lc){
    var n=String(it.lc).match(/\d+/);
    if(n)return "https://leetcode.com/problemset/?search="+n[0];
  }
  return "https://leetcode.com/problemset/?search="+encodeURIComponent(it.title);
}
function gfgSearchUrl(it){
  return "https://www.geeksforgeeks.org/search/?gq="+encodeURIComponent(it.title);
}
var LINK_KIND={
  leetcode:{label:"LeetCode \u2197",      cls:"lc"},
  direct:  {label:"LeetCode \u2197",      cls:"lc"},      // data written before the rename
  tuf:     {label:"takeUforward \u2197",  cls:"tuf"},
  article: {label:"TUF article \u2197",   cls:"tuf"},
  gfg:     {label:"GeeksforGeeks \u2197", cls:"gfg"},
  other:   {label:"Open \u2197",          cls:"lc"},
  search:  {label:"Find on LC \u2197",    cls:"lc dim"}
};
function problemRow(it){
  var s=st(it.id),done=!!s.done,open=!!openDetail[it.id];
  var hasNote=!!(s.note&&s.note.trim());
  var tags="";
  if(it.source==="a2z")tags+='<span class="tag src-a2z">A2Z</span>';
  if(it.tier)tags+='<span class="tag t-'+esc(it.tier)+'">'+esc(TIER[it.tier]||it.tier)+'</span>';
  if(it.lc)tags+='<span class="tag">LC '+esc(it.lc)+'</span>';
  if(it.paid)tags+='<span class="tag prem" title="LeetCode Premium problem">Premium</span>';
  var L=effLink(it);
  if(L.url&&!(L.kind==="search"&&!L.mine)){
    var lk=LINK_KIND[L.kind]||LINK_KIND.other;
    tags+='<a class="tag '+lk.cls+'" href="'+esc(L.url)+'" target="_blank" rel="noopener">'+
      lk.label+'</a>';
  }
  if(it.custom)tags+='<span class="tag custom">mine</span>';
  if(isMoved(it.id))tags+='<span class="tag moved" title="Moved here by you">moved</span>';

    '<div class="row-actions">'+
      '<button class="iact" data-fav="'+esc(it.id)+'" aria-pressed="'+s.fav+'" '+
        'title="Favourite" aria-label="Favourite">'+
        '<svg viewBox="0 0 16 16" fill="'+(s.fav?"currentColor":"none")+'" stroke="currentColor" '+
        'stroke-width="1.6" stroke-linejoin="round"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6 '+
        '4.2 13.6l.7-4.3-3.1-3 4.3-.6z"/></svg></button>'+
      '<button class="iact rep" data-repeat="'+esc(it.id)+'" aria-pressed="'+s.repeat+'" '+
        'title="Repeat this one" aria-label="Mark to repeat">'+
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" '+
        'stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7a5.5 5.5 0 0 1 9.4-3.4L14 5.6"/>'+
        '<path d="M14 2.2v3.6h-3.6"/><path d="M13.5 9a5.5 5.5 0 0 1-9.4 3.4L2 10.4"/>'+
        '<path d="M2 13.8v-3.6h3.6"/></svg></button>'+
      // one editor for everything about the problem: link, place, and its own details
      '<button class="mini" data-edit="'+esc(it.id)+'" title="Edit link, move it, or change its details">Edit</button>'+
      '<button class="mini" data-detail="'+esc(it.id)+'" aria-expanded="'+open+'">Notes</button>'+
    '</div></div>';
  if(open)h+='<div class="detail">'+noteBlock(it.id,(L.kind==="search"&&!L.mine)?"":L.url)+'</div>';
  return h;
}

function problemHaystack(it,gTitle){
  return it.title+" "+(it.lc||"")+" "+(it.tier||"")+" "+(gTitle||"")+" "+
         (ITEM_TOPIC[it.id]||"")+" "+tagNames(it.id).join(" ");
}
function visibleProblems(g){
  var out=[];
  g.items.forEach(function(it){
    if(!passFilter(it.id))return;
    if(!passTags(it.id))return;
    if(!matches(problemHaystack(it,g.title),""))return;
    out.push(it);
  });
  return out;
}

function renderTopic(){
  var t=null;
  for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].id===route.topic)t=DATA.topics[i];
  if(!t){route={view:"dash",topic:null,tab:"concepts"};return renderDash();}
  var c=topicCount(t);
  var tab=route.tab;
  if(tab==="concepts"&&!t.concepts.length&&t.problems.length)tab="problems";
  if(tab==="problems"&&!problemCount(t).total&&t.concepts.length)tab="concepts";

  var h='<h1 class="page-title">'+esc(t.title)+'</h1>'+
    '<p class="page-sub">'+c.done+' of '+c.total+' done · '+pct(c.done,c.total)+'% complete</p>'+
    splitBar(c.c,c.p,"bar")+legend(c.c,c.p)+'<div style="height:18px"></div>';

  h+='<div class="tabs" role="tablist">'+
    '<button role="tab" data-tab="concepts" aria-selected="'+(tab==="concepts")+'">Concepts'+
      '<span class="tab-n">'+c.c.done+'/'+c.c.total+'</span></button>'+
    '<button role="tab" data-tab="problems" aria-selected="'+(tab==="problems")+'">Problems'+
      '<span class="tab-n">'+c.p.done+'/'+c.p.total+'</span></button></div>';

  h+='<div class="topic-actions">'+
     (filtersActive()?'<span class="left">Filtered to this module</span>':'<span class="left"></span>')+
     '<button class="btn-ghost" data-addproblem="'+esc(t.id)+'">+ Add problem</button>'+
     (t.custom?'<button class="btn-ghost" data-editmodule="'+esc(t.id)+'">Rename or delete</button>':'')+
     '<button class="btn-ghost danger-ghost" data-modreset="'+esc(t.id)+'">Reset this module</button>'+
     '</div>';
  h+=tagBar();

  var shown=0;
  if(tab==="concepts"){
    if(!t.concepts.length){
      h+='<div class="empty">No written notes for this topic yet.<br>'+
         'Its problems are under the <strong>Problems</strong> tab.</div>';
    }else{
      t.concepts.forEach(function(cc){
        if(!conceptVisible(cc,t.title))return;
        shown++;h+=conceptCard(cc);
      });
      if(!shown)h+='<div class="empty">No concept section matches this filter.</div>';
    }
  }else{
    if(!c.p.total){
      h+='<div class="empty">No tagged problems for this topic.<br>'+
         'The patterns are taught under the <strong>Concepts</strong> tab.</div>';
    }else{
      t.problems.forEach(function(g){
        var items=visibleProblems(g);
        if(!items.length)return;
        shown+=items.length;
        var gd=0;g.items.forEach(function(it){if(isDone(it.id))gd++;});
        var gp=pct(gd,g.items.length);
        var isOpen=openSec[g.id]!==undefined?openSec[g.id]:(!!query||filter!=="all"||true);
        h+='<section class="section'+(isOpen?" open":"")+'"><div class="sec-headrow">'+
          '<button class="sec-head" data-sechead="'+esc(g.id)+'">'+
          '<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>'+
          '<span class="sec-title">'+esc(g.title)+
            (g.source==="a2z"?' <span class="tag src-a2z" style="margin-left:4px">A2Z</span>':'')+
            (g.source==="sheet"?' <span class="tag src-sheet" style="margin-left:4px">Interview set</span>':'')+'</span>'+
          '<span class="sec-bar'+(gp===100?" done":"")+'"><i style="width:'+gp+'%"></i></span>'+
          (sectionMoved(g.id)?'<span class="tag moved" title="Edited by you">edited</span>':'')+
          '<span class="sec-count tnum">'+gd+'/'+g.items.length+'</span></button>'+
          '<button class="iact" data-editsec="'+esc(g.id)+'" title="Rename or move this section" '+
            'aria-label="Edit section">'+PENCIL+'</button></div>'+
          '<div class="sec-body">';
        items.forEach(function(it){h+=problemRow(it);});
        h+='</div></section>';
      });
      if(!shown)h+='<div class="empty">No problem matches this filter.</div>';
    }
  }
  view.innerHTML=h+tagDatalist();
  highlightIn(view);
}

var pendingMerge=null;   // {local:{...}} shown as a choice on the dashboard

function countEntries(m){
  return Object.keys(m||{}).filter(function(k){
    var v=m[k];
    return v&&(v.done||v.fav||v.repeat||(v.tags&&v.tags.length)||(v.note&&v.note.trim()));
  }).length;
}
function customSize(c){
  return ((c&&c.topics)||[]).length+((c&&c.items)||[]).length+
    ((c&&c.moves)||[]).length+((c&&c.secMoves)||[]).length;
}

/* First connect: decide what happens to work already in this browser. */
function adoptGist(){
  var localMap=STATE, localCustom=CUSTOM;
  var gs=gistStore();
  toast("Reading your gist\u2026");
  Promise.all([gs.load(),gs.loadCustom()]).then(function(r){
    var cloud=r[0], cloudCustom=r[1];
    var nLocal=countEntries(localMap), nCloud=countEntries(cloud);
    store=gs;
    if(customSize(localCustom)&&!customSize(cloudCustom)){
      CUSTOM=localCustom;
    }else{
      CUSTOM=cloudCustom;
    }
    if(nLocal&&!nCloud){
      STATE=localMap;
      rebuildData(); render();
      store.bulk().then(function(ok){
        toast(ok?("Uploaded "+nLocal+" items to your gist."):"Could not write to the gist.");
        renderAccount();
      });
      return;
    }
    STATE=cloud;
    rebuildData(); render();
    if(nLocal&&nCloud){
      pendingMerge={local:localMap,nLocal:nLocal,nCloud:nCloud};
      route={view:"dash",topic:null,tab:route.tab};
      render();
    }else{
      if(customSize(CUSTOM)!==customSize(cloudCustom))store.saveCustom();
      toast("Connected. "+nCloud+" items loaded from your gist.");
    }
  },function(e){
    store=localStore();
    renderAccount();
    toast(ghErrText(e));
  });
}

function applyMerge(){
  if(!pendingMerge)return;
  var local=pendingMerge.local, added=0;
  Object.keys(local).forEach(function(k){
    var l=local[k], c=STATE[k];
    if(!l)return;
    if(!c){STATE[k]={done:!!l.done,note:l.note||"",fav:!!l.fav,repeat:!!l.repeat,
                      tags:l.tags||[]};added++;return;}
    if(l.done&&!c.done){c.done=true;added++;}
    if(l.fav&&!c.fav){c.fav=true;added++;}
    if(l.repeat&&!c.repeat){c.repeat=true;added++;}
    if(l.tags&&l.tags.length){
      var have=(c.tags||[]).map(function(x){return x.toLowerCase();});
      (c.tags=c.tags||[]);
      l.tags.forEach(function(tg){
        if(have.indexOf(String(tg).toLowerCase())<0){c.tags.push(tg);added++;}
      });
    }
    if(l.link&&!c.link){c.link=l.link;c.linkKind=l.linkKind||"";added++;}
    if(l.note&&l.note.trim()&&!(c.note&&c.note.trim())){c.note=l.note;added++;}
  });
  pendingMerge=null;
  render();
  store.bulk(STATE).then(function(){toast("Merged. "+added+" change"+(added===1?"":"s")+" added from this browser.");});
}

/* Search runs over every module, not just the one on screen. */
function renderSearch(){
  var hits=[], byTopic={};
  ALL_PROBLEMS.forEach(function(r){
    if(!passFilter(r.item.id))return;
    if(!passTags(r.item.id))return;
    if(!matches(problemHaystack(r.item,r.group.title),""))return;
    if(!byTopic[r.topic.id])byTopic[r.topic.id]={topic:r.topic,groups:{}};
    var slot=byTopic[r.topic.id];
    if(!slot.groups[r.group.id])slot.groups[r.group.id]={group:r.group,items:[]};
    slot.groups[r.group.id].items.push(r.item);
    hits.push(r);
  });
  var concepts=[];
  DATA.topics.forEach(function(t){
    t.concepts.forEach(function(c){
      if(activeTags.length)return;          // concepts carry no tags
      conceptUnits(c).forEach(function(u){
        if(!passFilter(u.id))return;
        var hay=(u===c)?conceptHaystack(c,t.title)
                       :(nodeText(u)+" "+c.title+" "+t.title);
        if(!matches(hay,"",u.id))return;
        concepts.push({topic:t,concept:u,parent:(u===c?null:c)});
      });
    });
  });

  var h='<h1 class="page-title">'+(query?'Results for \u201c'+esc(query)+'\u201d':'Filtered')+'</h1>'+
    '<p class="page-sub">'+hits.length+' problem'+(hits.length===1?"":"s")+
    (concepts.length?(' and '+concepts.length+' concept section'+(concepts.length===1?"":"s")):"")+
    ' across every module</p>';
  h+=tagBar();

  if(!hits.length&&!concepts.length){
    view.innerHTML=h+'<div class="empty">Nothing matches.<br>'+
      (activeTags.length?'Try clearing a tag, or ':'')+'try a shorter search term.</div>';
    return;
  }
  Object.keys(byTopic).forEach(function(tid){
    var slot=byTopic[tid];
    h+='<div class="res-topic">'+esc(slot.topic.title)+'</div>';
    Object.keys(slot.groups).forEach(function(gid){
      var gg=slot.groups[gid];
      h+='<section class="section open"><button class="sec-head" data-sechead="res-'+esc(gid)+'">'+
        '<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>'+
        '<span class="sec-title">'+esc(gg.group.title)+'</span>'+
        '<span class="sec-count tnum">'+gg.items.length+'</span></button><div class="sec-body">';
      gg.items.forEach(function(it){h+=problemRow(it);});
      h+='</div></section>';
    });
  });
  if(concepts.length){
    h+='<div class="res-topic">Concept sections</div>';
    concepts.forEach(function(c){
      h+='<section class="section"><div class="sec-head" style="cursor:default">'+
        '<button class="tick" data-tick="'+esc(c.concept.id)+'" aria-pressed="'+isDone(c.concept.id)+
        '" aria-label="Mark as read"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9 10.5 2.8"/></svg></button>'+
        '<span class="sec-title">'+esc(c.concept.title)+
        (c.parent?' <span class="tag">in '+esc(c.parent.title)+'</span>':'')+
        ' <span class="tag" style="margin-left:4px">'+esc(c.topic.title)+'</span></span>'+
        '<button class="mini" data-gotopic="'+esc(c.topic.id)+'">Open module</button></div></section>';
    });
  }
  view.innerHTML=h+tagDatalist();
  highlightIn(view);
}

function currentPalette(){
  return document.documentElement.getAttribute("data-palette")||"slate";
}
function isDarkNow(){
  var r=document.documentElement, t=r.getAttribute("data-theme");
  if(t==="dark")return true;
  if(t==="light")return false;
  return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
}
/* The CSS keys every palette on data-scheme, so it is set from the saved mode
   (data-theme) or, with no saved mode, from the OS setting. */
function applyScheme(){
  document.documentElement.setAttribute("data-scheme",isDarkNow()?"dark":"light");

/* ---------- charts ----------
   Inline SVG, no library. Categorical hues come from --ch1..--ch3, which are a
   validated 3-colour set (CVD-separated, chroma floor, contrast) with its own
   dark-mode steps - not an automatic flip of the light ones. */
function svgEsc(v){return String(v).replace(/[<>&"]/g,function(c){
  return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];});}

/* Calendar heatmap: magnitude on a grid -> sequential, one hue, more is darker. */
function heatmap(days){
  var cell=11,gap=3,weeks=Math.ceil(days.length/7);
  var w=weeks*(cell+gap), h=7*(cell+gap), top=16, left=26;
  var max=0;days.forEach(function(d){if(d.total>max)max=d.total;});
  var out='<svg viewBox="0 0 '+(w+left+6)+' '+(h+top+16)+'" width="100%" '+
          'style="max-width:100%;height:auto" role="img" aria-label="Daily activity for the last year">';
  ["Mon","Wed","Fri"].forEach(function(lab,i){
    out+='<text x="0" y="'+(top+(i*2+1)*(cell+gap)+cell-1)+'" font-size="8" '+
         'fill="var(--ink-3)" font-family="var(--mono)">'+lab+'</text>';
  });
  var lastMonth="";
  days.forEach(function(d,i){
    var wk=Math.floor(i/7), dow=i%7;
    var x=left+wk*(cell+gap), y=top+dow*(cell+gap);
    var lvl=d.total===0?0:Math.min(4,Math.ceil(d.total/Math.max(1,max)*4));
    var fill=lvl===0?"var(--chart-empty)":"var(--heat"+lvl+")";
    out+='<rect class="cell hit" x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+
         '" rx="2.5" fill="'+fill+'" tabindex="0" role="img"'+
         ' data-tip="'+svgEsc(d.total+"|"+d.day+"|"+d.problem+" problems, "+d.concept+" concepts")+'"'+
         ' aria-label="'+svgEsc(d.day+": "+d.total+" items")+'"></rect>';
    if(dow===0){
      var mon=d.day.slice(5,7);
      if(mon!==lastMonth){
        lastMonth=mon;
        var names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        out+='<text x="'+x+'" y="'+(top-5)+'" font-size="8" fill="var(--ink-3)" '+
             'font-family="var(--mono)">'+names[+mon-1]+'</text>';
      }
    }
  });
  return out+'</svg>';
}

/* Cumulative completion over time: trend -> line, single series, no legend. */
function cumulativeChart(days){
  var pts=[],run=0,firstIdx=-1;
  days.forEach(function(d,i){
    run+=d.total;
    if(run>0&&firstIdx<0)firstIdx=i;
    pts.push(run);
  });
  if(firstIdx<0)return '<div class="chart-empty">No dated activity yet.</div>';
  pts=pts.slice(firstIdx); var labels=days.slice(firstIdx);
  var w=640,h=150,padL=34,padB=18,padT=8;
  var max=pts[pts.length-1]||1;
  var X=function(i){return padL+(pts.length<2?0:i/(pts.length-1)*(w-padL-8));};
  var Y=function(v){return padT+(1-v/max)*(h-padT-padB);};
  var dAttr=pts.map(function(v,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);}).join(" ");
  var area=dAttr+" L"+X(pts.length-1).toFixed(1)+" "+(h-padB)+" L"+X(0).toFixed(1)+" "+(h-padB)+" Z";
  var out='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="height:auto" role="img" '+
          'aria-label="Cumulative items completed over time">';
  [0,0.5,1].forEach(function(f){
    var v=Math.round(max*f), y=Y(v);
    out+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-8)+'" y2="'+y+
         '" stroke="var(--grid)" stroke-width="1"/>'+
         '<text x="'+(padL-6)+'" y="'+(y+3)+'" font-size="9" text-anchor="end" '+
         'fill="var(--ink-3)" font-family="var(--mono)">'+v+'</text>';
  });
  out+='<path d="'+area+'" fill="var(--ch1-fill)"/>';
  out+='<path d="'+dAttr+'" fill="none" stroke="var(--ch1)" stroke-width="2" '+
       'stroke-linejoin="round" stroke-linecap="round"/>';
  out+='<circle cx="'+X(pts.length-1)+'" cy="'+Y(max)+'" r="4" fill="var(--ch1)" '+
       'stroke="var(--surface)" stroke-width="2"/>';
  out+='<text x="'+(X(pts.length-1)-4)+'" y="'+(Y(max)-8)+'" font-size="10" text-anchor="end" '+
       'fill="var(--ink-2)" font-family="var(--mono)" font-weight="600">'+max+'</text>';
  out+='<text x="'+padL+'" y="'+(h-4)+'" font-size="9" fill="var(--ink-3)" '+
       'font-family="var(--mono)">'+svgEsc(labels[0].day)+'</text>';
  out+='<text x="'+(w-8)+'" y="'+(h-4)+'" font-size="9" text-anchor="end" '+
       'fill="var(--ink-3)" font-family="var(--mono)">'+svgEsc(labels[labels.length-1].day)+'</text>';

  // crosshair: the reader aims at a date, never at a 2px line
  out+='<g class="xh" hidden><line class="xh-line" y1="'+padT+'" y2="'+(h-padB)+
       '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>'+
       '<circle class="xh-dot" r="4.5" fill="var(--ch1)" stroke="var(--surface)" stroke-width="2"/></g>';
  var stepW=pts.length<2?0:(w-padL-8)/(pts.length-1);
  out+='<rect class="xh-hit" x="'+padL+'" y="'+padT+'" width="'+(w-padL-8)+'" height="'+(h-padT-padB)+
       '" fill="transparent" data-xh="1" data-pad="'+padL+'" data-step="'+stepW.toFixed(4)+
       '" data-n="'+pts.length+'" data-days="'+svgEsc(labels.map(function(l){return l.day;}).join(","))+
       '" data-vals="'+pts.join(",")+'" data-ys="'+pts.map(function(v){return Y(v).toFixed(1);}).join(",")+
       '" data-xs="'+pts.map(function(_,i){return X(i).toFixed(1);}).join(",")+'"/>';
  return out+'</svg>';
}

/* Last 30 days: magnitude per day -> columns, one hue. */
function dailyBars(days){
  var d30=days.slice(-30), w=640,h=110,padB=16,padT=6,padL=28;
  var max=Math.max(1,Math.max.apply(null,d30.map(function(d){return d.total;})));
  var bw=(w-padL-8)/30;
  var out='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="height:auto" role="img" '+
          'aria-label="Items completed each day for the last 30 days">';
  [0,max].forEach(function(v){
    var y=padT+(1-v/max)*(h-padT-padB);
    out+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-8)+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>'+
         '<text x="'+(padL-6)+'" y="'+(y+3)+'" font-size="9" text-anchor="end" fill="var(--ink-3)" '+
         'font-family="var(--mono)">'+v+'</text>';
  });
  d30.forEach(function(d,i){
    var bh=d.total/max*(h-padT-padB);
    var x=padL+i*bw, y=h-padB-bh;
    out+='<rect class="bar-mark" x="'+(x+1).toFixed(1)+'" y="'+(d.total?y.toFixed(1):(h-padB-2))+
         '" width="'+(bw-2).toFixed(1)+'" height="'+(d.total?Math.max(2,bh).toFixed(1):2)+
         '" rx="2" fill="'+(d.total?"var(--ch1)":"var(--chart-empty)")+'"/>';
    // the hit area is the whole column, so a 2px bar is still easy to hit
    out+='<rect class="hit col-hit" x="'+x.toFixed(1)+'" y="'+padT+'" width="'+bw.toFixed(1)+
         '" height="'+(h-padT-padB)+'" fill="transparent" tabindex="0" role="img"'+
         ' data-tip="'+svgEsc(d.total+"|"+d.day+"|"+d.problem+" problems, "+d.concept+" concepts")+'"'+
         ' aria-label="'+svgEsc(d.day+": "+d.total+" items")+'"/>';
  });
  out+='<text x="'+padL+'" y="'+(h-3)+'" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">'+
       svgEsc(d30[0].day.slice(5))+'</text>'+
       '<text x="'+(w-8)+'" y="'+(h-3)+'" font-size="9" text-anchor="end" fill="var(--ink-3)" '+
       'font-family="var(--mono)">today</text>';
  return out+'</svg>';
}

/* Part-to-whole with long category names -> horizontal stacked bar. */
function stackRow(label,segs,total){
  if(!total)return "";
  var out='<div class="stack-row"><div class="stack-label">'+esc(label)+'</div><div class="stack">';
  segs.forEach(function(sg){
    if(!sg.v)return;
    out+='<span class="seg hit" tabindex="0" style="width:'+(sg.v/total*100)+'%;background:'+sg.color+
         '" data-tip="'+esc(sg.v+"|"+label+" \u00b7 "+sg.name+"|"+Math.round(sg.v/total*100)+"% of "+total)+
         '"></span>';
  });
  out+='</div><div class="stack-n tnum">'+segs[0].v+'/'+total+'</div></div>';
  return out;
}
function legendRow(items){
  return '<div class="chart-legend">'+items.map(function(i){
    return '<span><span class="key" style="background:'+i.color+'"></span>'+esc(i.name)+
           (i.n!=null?' <b class="tnum">'+i.n+'</b>':'')+'</span>';
  }).join("")+'</div>';
}

/* ---------- chart hover layer ----------
   Values lead, labels follow. Text goes in with textContent, never innerHTML:
   module and tag names are the viewer's own data, not markup. */
var tipEl=null;
function tipNode(){
  if(!tipEl){
    tipEl=document.createElement("div");
    tipEl.id="chartTip";
    tipEl.setAttribute("role","status");
    tipEl.hidden=true;
    document.body.appendChild(tipEl);
  }
  return tipEl;
}
function showTip(x,y,value,label,sub){
  var el=tipNode();
  el.textContent="";
  var v=document.createElement("div"); v.className="tip-v"; v.textContent=value;
  var l=document.createElement("div"); l.className="tip-l"; l.textContent=label;
  el.appendChild(v); el.appendChild(l);
  if(sub){var s2=document.createElement("div");s2.className="tip-s";s2.textContent=sub;el.appendChild(s2);}
  el.hidden=false;
  var w=el.offsetWidth, h=el.offsetHeight;
  var left=x-w/2, top=y-h-12;
  if(left<8)left=8;
  if(left+w>window.innerWidth-8)left=window.innerWidth-8-w;
  if(top<8)top=y+16;
  el.style.left=left+"px"; el.style.top=top+"px";
}
function hideTip(){
  if(tipEl)tipEl.hidden=true;
  var xh=document.querySelectorAll(".xh");
  for(var i=0;i<xh.length;i++)xh[i].setAttribute("hidden","");
}
function tipFrom(el,cx,cy){
  var parts=(el.getAttribute("data-tip")||"").split("|");
  showTip(cx,cy,parts[0]||"",parts[1]||"",parts[2]||"");
}
/* Crosshair: snap to the nearest day, then read its value. */
function crosshair(hit,clientX){
  var box=hit.getBoundingClientRect();
  var svg=hit.ownerSVGElement;
  var vb=svg.viewBox.baseVal;
  var scale=box.width/(vb.width-(+hit.getAttribute("x"))-8);  // px per user unit, approx
  var days=(hit.getAttribute("data-days")||"").split(",");
  var vals=(hit.getAttribute("data-vals")||"").split(",");
  var xs=(hit.getAttribute("data-xs")||"").split(",").map(Number);
  var ys=(hit.getAttribute("data-ys")||"").split(",").map(Number);
  if(!days.length||!xs.length)return;
  // map the pointer back into viewBox units
  var svgBox=svg.getBoundingClientRect();
  var ux=(clientX-svgBox.left)/svgBox.width*vb.width;
  var best=0,bd=Infinity;
  for(var i=0;i<xs.length;i++){var d=Math.abs(xs[i]-ux);if(d<bd){bd=d;best=i;}}
  var g=svg.querySelector(".xh");
  if(g){
    g.removeAttribute("hidden");
    var ln=g.querySelector(".xh-line"), dot=g.querySelector(".xh-dot");
    ln.setAttribute("x1",xs[best]); ln.setAttribute("x2",xs[best]);
    dot.setAttribute("cx",xs[best]); dot.setAttribute("cy",ys[best]);
  }
  var px=svgBox.left+xs[best]/vb.width*svgBox.width;
  var py=svgBox.top+ys[best]/vb.height*svgBox.height;
  showTip(px,py,vals[best]+" done",days[best],"cumulative total");
}

document.addEventListener("pointermove",function(e){
  var hit=e.target.closest&&e.target.closest("[data-xh]");
  if(hit){crosshair(hit,e.clientX);return;}
  var mark=e.target.closest&&e.target.closest(".hit");
  if(mark){
    var b=mark.getBoundingClientRect();
    tipFrom(mark,b.left+b.width/2,b.top);
    return;
  }
  if(tipEl&&!tipEl.hidden)hideTip();
});
document.addEventListener("pointerleave",hideTip,true);
document.addEventListener("scroll",hideTip,true);
/* keyboard parity: the same readout on focus */
document.addEventListener("focusin",function(e){
  var mark=e.target.closest&&e.target.closest(".hit");
  if(mark){var b=mark.getBoundingClientRect();tipFrom(mark,b.left+b.width/2,b.top);}
});
document.addEventListener("focusout",function(e){
  if(e.target.closest&&e.target.closest(".hit"))hideTip();
});

/* ---------- the analytics view ---------- */
var SCOPES=[{id:"all",label:"All"},{id:"concept",label:"Concepts"},{id:"problem",label:"Problems"}];
var statsScope="all", planRate={};          // planRate[scope] = items/day you intend
try{
  statsScope=localStorage.getItem("pl-stats-scope")||"all";
  planRate=JSON.parse(localStorage.getItem("pl-plan-rate")||"{}")||{};
}catch(e){ /* storage blocked: defaults */ }
function savePlan(){
  try{
    localStorage.setItem("pl-stats-scope",statsScope);
    localStorage.setItem("pl-plan-rate",JSON.stringify(planRate));
  }catch(e){ /* storage blocked: session only */ }
}
function finishDate(days){
  if(days==null)return "\u2014";
  var d=new Date(); d.setDate(d.getDate()+days);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
/* Estimate for one scope: your plan wins if set, else the 30-day pace, else 7-day. */
function estimateFor(scope){
  var A=analytics(scope);
  var plan=+planRate[scope]||0;
  var pace=plan>0?plan:(A.perDay30>0?A.perDay30:A.perDay7);
  var basis=plan>0?"your plan":(A.perDay30>0?"30-day pace":(A.perDay7>0?"7-day pace":""));
  var days=pace>0?Math.ceil(A.remaining/pace):null;
  if(A.remaining===0)days=0;
  return {scope:scope,A:A,pace:pace,basis:basis,days:days,plan:plan};
}
function estimatePanel(){
  var h='<section class="panel"><h3>Time to finish</h3>'+
    '<p class="panel-sub">Set a daily target to plan, or leave it blank to project from your recent pace.</p>'+
    '<div class="est-table" role="table">'+
    '<div class="est-row est-head" role="row"><span>Scope</span><span>Left</span>'+
    '<span>7-day</span><span>30-day</span><span>Plan / day</span><span>Days</span><span>Finish</span></div>';
  SCOPES.forEach(function(sc){
    var E=estimateFor(sc.id), A=E.A;
    h+='<div class="est-row'+(sc.id===statsScope?" on":"")+'" role="row">'+
      '<button class="est-name" data-scope="'+sc.id+'">'+sc.label+'</button>'+
      '<span class="tnum">'+A.remaining+'</span>'+
      '<span class="tnum">'+A.perDay7.toFixed(1)+'</span>'+
      '<span class="tnum">'+A.perDay30.toFixed(1)+'</span>'+
      '<span><input class="plan-in" type="number" min="0" step="0.5" inputmode="decimal" '+
        'id="plan-'+sc.id+'" data-plan="'+sc.id+'" value="'+(E.plan||"")+'" placeholder="auto" '+
        'aria-label="Planned '+sc.label.toLowerCase()+' per day"></span>'+
      '<span class="tnum est-days">'+(E.days==null?"\u2014":E.days)+'</span>'+
      '<span class="est-date" title="'+esc(E.basis?("based on "+E.basis):"no recent activity yet")+'">'+
        (A.remaining===0?"done":finishDate(E.days))+'</span>'+
      '</div>';
  });
  return h+'</div></section>';
}

function renderStats(){
  var A=analytics(statsScope);
  var E=estimateFor(statsScope);
  var pctDone=A.units?Math.round(A.done/A.units*100):0;
  var noun=statsScope==="concept"?"concepts":statsScope==="problem"?"problems":"items";

  var h='<h1 class="page-title">Analytics</h1>'+
    '<p class="page-sub">Everything below is derived from your own ticks and syncs with your progress.</p>';

  // one filter row, above everything it scopes
  h+='<div class="scope-row"><span class="scope-label">Show</span><div class="seg" role="radiogroup" aria-label="Scope">';
  SCOPES.forEach(function(sc){
    h+='<button role="radio" data-scope="'+sc.id+'" aria-checked="'+(sc.id===statsScope)+
       '" aria-pressed="'+(sc.id===statsScope)+'">'+sc.label+'</button>';
  });
  h+='</div></div>';

  // KPI row - headline numbers belong in stat tiles, not a chart
  h+='<div class="kpi">'+
    '<div class="tile hero"><span class="tile-v tnum">'+A.today.total+'</span>'+
      '<span class="tile-l">'+(statsScope==="concept"?"Read today":"Solved today")+'</span>'+
      '<span class="tile-s">'+(statsScope==="all"?(A.today.problem+' problems · '+A.today.concept+' concepts'):noun)+'</span></div>'+
    '<div class="tile"><span class="tile-v tnum">'+A.streak+'</span><span class="tile-l">Day streak</span>'+
      '<span class="tile-s">best '+A.best+'</span></div>'+
    '<div class="tile"><span class="tile-v tnum">'+A.last7+'</span><span class="tile-l">This week</span>'+
      '<span class="tile-s">'+A.last30+' in 30 days</span></div>'+
    '<div class="tile"><span class="tile-v tnum">'+A.done+'</span><span class="tile-l">Total done</span>'+
      '<span class="tile-s">'+pctDone+'% of '+A.units+'</span></div>'+
    '<div class="tile"><span class="tile-v tnum">'+A.perDay30.toFixed(1)+'</span>'+
      '<span class="tile-l">Per day</span><span class="tile-s">30-day average</span></div>'+
    '<div class="tile"><span class="tile-v tnum">'+(E.days==null?"—":E.days)+'</span>'+
      '<span class="tile-l">Days to finish</span>'+
      '<span class="tile-s">'+(A.remaining===0?"all done":(E.days==null?"needs recent activity":finishDate(E.days)+" · "+E.basis))+'</span></div>'+
    '</div>';
  h+=estimatePanel();

  if(A.undated)
    h+='<div class="note-banner">'+A.undated+' item'+(A.undated===1?" was":"s were")+

  h+='<section class="panel"><h3>Activity</h3>'+
     '<p class="panel-sub">Each square is a day over the last year. Darker means more items.</p>'+
     heatmap(A.days)+
     '<div class="chart-legend"><span>Less</span>'+
     '<span class="key" style="background:var(--chart-empty)"></span>'+

/* Layout animations run under #view.enter, which is set only when the page
   changes (or the layout does), never on the re-render a tick causes. */
var lastViewKey=null, enterT=null;
function enterAnim(force){
  var key=route.view+"|"+route.topic+"|"+route.tab;
  if(!force&&key===lastViewKey)return;
  lastViewKey=key;
  if(!view.classList)return;
  view.classList.remove("enter");
  void view.offsetWidth;                 // restart the animation
  view.classList.add("enter");
  clearTimeout(enterT);
  enterT=setTimeout(function(){view.classList.remove("enter");},1100);
}
function render(){
  enterAnim(false);
  renderRail();
  renderAccount();
  syncClearBtn();
  if(route.view==="stats"){renderStats();return;}
  // Dashboard-level filtering searches every module; inside a module it stays there.
  if(route.view!=="topic"&&filtersActive()){route.view="search";renderSearch();return;}
  if(route.view==="search")route.view="dash";
  if(route.view==="dash")renderDash();else renderTopic();
}

/* ---------- mutations ---------- */
function todayKey(d){
  d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0");
}
function toggle(id){
  var cur=st(id);
  if(cur.done){
    // untick drops the day it counted for, but remembers when it was first solved
    setItem(id,{done:false,doneAt:""});
  }else{
    var day=todayKey();
    setItem(id,{done:true,doneAt:day,firstDoneAt:cur.firstDoneAt||day});
  }
  pushItem(id);
}
function pushItem(id){
  render();
  store.save(id,STATE[id]).then(function(ok){
    if(!ok)toast("Could not save. Your progress may not persist.");
  });
}
function toggleFav(id){
  var v=!st(id).fav; setItem(id,{fav:v}); pushItem(id);
}
function toggleRepeat(id){
  var v=!st(id).repeat; setItem(id,{repeat:v}); pushItem(id);
}
/* Clear the ticks for one module. Notes, tags, favourites and repeat marks stay. */
function resetModule(topicId){
  var t=findTopic(topicId);
  if(!t)return;
  var ids=[];
  t.concepts.forEach(function(c){if(isDone(c.id))ids.push(c.id);});
  t.problems.forEach(function(g){g.items.forEach(function(it){if(isDone(it.id))ids.push(it.id);});});
  if(!ids.length){toast("Nothing ticked in this module.");return;}
  ids.forEach(function(id){setItem(id,{done:false});});
  render();
  store.bulk(STATE).then(function(){
    toast("Reset "+ids.length+" item"+(ids.length===1?"":"s")+" in "+t.title+". Notes and tags kept.");
  });
}
function queueNote(id,text){
  setItem(id,{note:text});
  var el=document.querySelector('[data-notestatus="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(el)el.textContent="Saving…";
  clearTimeout(noteTimers[id]);
  noteTimers[id]=setTimeout(function(){
    store.save(id,STATE[id]).then(function(ok){
      var e2=document.querySelector('[data-notestatus="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
      if(e2){e2.textContent=ok?"Saved":"Not saved";
        if(ok)setTimeout(function(){if(e2.textContent==="Saved")e2.textContent="";},1700);}
      renderRail();
    });
  },700);
}
function resetAll(){
  var ids=Object.keys(STATE).filter(function(k){return STATE[k].done;});
  if(!ids.length){toast("Nothing to reset.");return;}
  ids.forEach(function(id){setItem(id,{done:false});});
  render();
  store.bulk(STATE).then(function(){toast("Progress reset for "+ids.length+" item"+(ids.length===1?"":"s")+". Notes kept.");});
}
function blobDownload(payload){
  var blob=new Blob([payload],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="pattern-ledger-backup.json";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},800);
  toast("Backup downloaded.");
}
function exportBackup(){
  var payload=JSON.stringify({app:"pattern-ledger",version:2,
    exportedAt:new Date().toISOString(),state:STATE,custom:CUSTOM},null,2);
  // Hosted on claude.ai the frame blocks plain downloads; the capability handles it there.
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(dl){
      if(!dl)return blobDownload(payload);
      dl.save({filename:"pattern-ledger-backup.json",data:payload})
        .then(function(){toast("Backup saved.");},
              function(){toast("Download was declined.");});
    },function(){blobDownload(payload);});
    return;
  }
  blobDownload(payload);
}
function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var j=JSON.parse(fr.result);
      var incoming=j&&j.state?j.state:j;
      if(!incoming||typeof incoming!=="object")throw new Error("bad shape");
      var n=0;
      Object.keys(incoming).forEach(function(k){
        var v=incoming[k];
        if(v&&typeof v==="object"){
          STATE[k]={done:!!v.done,note:typeof v.note==="string"?v.note:""};n++;
        }
      });
      var nc=0;
      if(j&&j.custom&&typeof j.custom==="object"){
        var inc=j.custom;
        var have={};
        CUSTOM.topics.forEach(function(t){have[t.id]=1;});
        CUSTOM.groups.forEach(function(g){have[g.id]=1;});
        CUSTOM.items.forEach(function(it){have[it.id]=1;});
        (inc.topics||[]).forEach(function(t){if(t&&t.id&&!have[t.id]){CUSTOM.topics.push(t);nc++;}});
        (inc.groups||[]).forEach(function(g){if(g&&g.id&&!have[g.id])CUSTOM.groups.push(g);});
        (inc.items||[]).forEach(function(it){if(it&&it.id&&!have[it.id]){CUSTOM.items.push(it);nc++;}});
      }
      rebuildData();
      Promise.all([store.bulk(STATE),store.saveCustom?store.saveCustom(CUSTOM):null])
        .then(function(){render();
          toast("Imported "+n+" items"+(nc?(" and "+nc+" of your own entries"):"")+".");});
    }catch(e){toast("That file is not a Pattern Ledger backup.");}
  };
  fr.readAsText(file);
}

    return ghApi("/user").then(function(u){
      GH.user={login:u.login,name:u.name||u.login,avatar:u.avatar_url};
      ghReadGistId();
      return ghFindOrCreateGist(true).then(function(){
        ghWriteCreds();
        store=gistStore();
      });
    },function(e){
      if(e&&e.code==="bad_token"){
        GH.token=null; GH.user=null;
        try{localStorage.removeItem(GH_TOKEN_KEY);}catch(e2){ /* storage blocked */ }
        setTimeout(function(){toast(ghErrText(e)+" Using this browser's copy.");},600);
        return;
      }
      // GitHub unreachable: keep working from the copy of your gist on this device
      var cu=ghCachedUser();
      if(cu){
        GH.user=cu; ghReadGistId();
        if(GH.gistId&&mirrorRead()){
          store=gistStore(); store.offline=true;
          setTimeout(function(){toast("Offline \u2014 showing the copy of your progress saved on this device.");},600);
          return;
        }
      }
      setTimeout(function(){toast(ghErrText(e)+" Using this browser's copy.");},600);
    });
  }
  return null;
}).then(function(){
  return Promise.all([store.load(), store.loadCustom?store.loadCustom():emptyCustom()]);
}).then(function(r){
  STATE=r[0]||{};
  CUSTOM=r[1]||emptyCustom();
  rebuildData();
  render();
  // offline edits from a previous visit were merged on load: push them now
  if(store.pendingPush){ store.pendingPush=false; store.bulk(); }
}).catch(function(err){
  if(!DATA){
    view.innerHTML='<div class="empty">Could not load <code>data/curriculum.json</code>.<br>'+
      esc(err&&err.message)+'<br><br>If you opened this file directly from disk, run a local server '+
      'instead: <code>python3 -m http.server</code> in this folder.</div>';
  }else{
    store=localStore();
    store.load().then(function(m){STATE=m||{};render();});
  }
});

})();
</script>

</html>
