*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#shell{display:grid;grid-template-columns:272px 1fr;height:100%}
#rail{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
#railHead{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.brand{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0}
.brand-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
  margin-top:3px;font-weight:500}
#railPinned{padding:8px 8px 0;flex:none}
#railScroll{overflow-y:auto;flex:1;padding:4px 8px 20px;min-height:0}
#railScroll::-webkit-scrollbar{width:8px}
#railScroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.rail-div{height:1px;background:var(--border);margin:8px 2px 0}

/* row action icons */
.iact{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid transparent;
  background:none;display:flex;align-items:center;justify-content:center;padding:0;
  color:var(--ink-3);line-height:1}
.iact:hover{border-color:var(--border);color:var(--ink);background:var(--surface)}
.iact[aria-pressed="true"]{color:var(--accent2);border-color:var(--accent2-line);background:var(--accent2-soft)}
.iact.rep[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);
  background:var(--accent-soft)}
.iact svg{width:14px;height:14px}

/* tags */
.chip{font-size:10.5px;padding:1.5px 7px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-3);color:var(--ink-2);white-space:nowrap;cursor:pointer;
  font-family:var(--sans);line-height:1.5}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.mod{background:var(--accent-soft);color:var(--accent-ink);
  border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip.on,:root:not([data-theme="light"]) .chip.on{color:#0e1319}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .chip.on{color:#fff}}
.chip .x{margin-left:5px;opacity:.6;font-weight:700;background:none;border:0;
  color:inherit;font-size:12px;cursor:pointer;padding:0 1px;line-height:1}
.chip .x:hover{opacity:1;color:var(--red)}
.chip-wrap{display:inline-flex;align-items:stretch;border-radius:999px;overflow:hidden;
  border:1px solid var(--border);background:var(--surface-3)}
.chip-wrap.mod{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip-wrap.on{background:var(--accent);border-color:var(--accent)}
.chip-wrap .chip{border:0;border-radius:0;background:none}
.chip-wrap .chip:hover{background:rgba(125,137,151,.14)}
.chipx{border:0;background:none;color:var(--ink-3);font-size:13px;line-height:1;
  padding:0 7px 0 2px;cursor:pointer;font-weight:600}
.chipx:hover{color:var(--red);background:var(--red-soft)}
.chip-wrap.on .chipx{color:inherit;opacity:.75}
.chip-wrap.on .chipx:hover{opacity:1;background:rgba(0,0,0,.18)}
.chipx[data-armed="1"]{color:var(--red);background:var(--red-soft)}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;
  padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.tagbar-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-right:2px}
.tag-add{display:flex;gap:6px;align-items:center;margin-top:8px}
.tag-add input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;padding:5px 9px;font:inherit;font-size:12.5px;color:var(--ink)}
.tag-add input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.res-topic{font-family:var(--display);font-size:15px;font-weight:600;margin:18px 0 8px}
.res-topic:first-of-type{margin-top:0}
.rail-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:12px 8px 6px}
#account{margin-top:12px}
.gbtn{display:flex;align-items:center;gap:9px;width:100%;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:8px;padding:7px 11px;
  font-size:13px;font-weight:500;color:var(--ink)}
.gbtn:hover{background:var(--surface-2);border-color:var(--accent)}
.gbtn svg{flex:none}
.acct{display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;flex:none;background:var(--accent-soft);
  color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct-mid{flex:1;min-width:0}
.acct-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-sync{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.acct-sync .sdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.acct-sync.off .sdot{background:var(--ink-3)}
.acct-sync.err .sdot{background:var(--red)}
.linkbtn{background:none;border:0;padding:0;font-size:11px;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink)}
.acct-note{font-size:11px;color:var(--ink-3);line-height:1.45;margin-top:7px}
.merge-card{background:var(--surface);border:1px solid var(--accent2-line);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.merge-card h3{font-size:14px;font-weight:600;margin:0 0 5px}
.merge-card p{font-size:12.5px;color:var(--ink-2);margin:0 0 11px}

/* custom content */
.btn-add{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;
  padding:7px 13px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .btn-add,
:root:not([data-theme="light"]) .btn-add{color:#0e1319}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn-add{color:#fff}}

function st(id){

function setItem(id,patch){

  // stale the moment a new field is added, and silently drops it on the next write.

  for(k in cur)if(Object.prototype.hasOwnProperty.call(cur,k))next[k]=cur[k];
  for(k in patch)if(Object.prototype.hasOwnProperty.call(patch,k))next[k]=patch[k];
  STATE[id]=next;
  return next;
}

/* ---------- storage: artifact db when hosted by Claude, else localStorage ---------- */
var LS_KEY="pattern-ledger-v1", LS_CUSTOM="pattern-ledger-custom-v1";
function emptyCustom(){return {topics:[],groups:[],items:[]};}
function localStore(){
  function readKey(k,fallback){
    try{var r=localStorage.getItem(k);return r?JSON.parse(r):fallback;}catch(e){return fallback;}
  }
  function writeKey(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}
  }
  return {
    kind:"local",
    load:function(){return Promise.resolve(readKey(LS_KEY,{}));},
    save:function(id,rec){var m=readKey(LS_KEY,{});m[id]=rec;
      return Promise.resolve(writeKey(LS_KEY,m));},
    bulk:function(map){return Promise.resolve(writeKey(LS_KEY,map));},
    loadCustom:function(){return Promise.resolve(readKey(LS_CUSTOM,emptyCustom()));},
    saveCustom:function(c){return Promise.resolve(writeKey(LS_CUSTOM,c));},
    watch:function(){}
  };
}
/* ---- GitHub Gist sync: progress stored as a secret gist in your own account ----
   No third-party service, no account to create, nothing that expires or pauses.
   You paste a token scoped to gists only; it is kept in this browser's
   localStorage and sent to api.github.com and nowhere else. */
var GH={token:null,gistId:null,user:null};
var GH_TOKEN_KEY="pattern-ledger-gh-token", GH_GIST_KEY="pattern-ledger-gist-id";
var GIST_FILE="pattern-ledger.json";
var GIST_DESC="Pattern Ledger \u2014 DSA study progress";
var GH_TOKEN_URL="https://github.com/settings/tokens/new?scopes=gist&description=Pattern%20Ledger";

function ghGistKey(){
  // one remembered gist per GitHub account, so two people sharing a browser
  // never inherit each other's gist id
  return GH_GIST_KEY+":"+((GH.user&&GH.user.login)||"_");
}
function ghReadCreds(){
  try{ GH.token=localStorage.getItem(GH_TOKEN_KEY)||null; }
  catch(e){ /* private window or blocked storage: stay disconnected */ }
}
function ghReadGistId(){
  try{ GH.gistId=localStorage.getItem(ghGistKey())||null; }
  catch(e){ GH.gistId=null; }
}
function ghWriteCreds(){
  try{
    if(GH.token)localStorage.setItem(GH_TOKEN_KEY,GH.token);
    else localStorage.removeItem(GH_TOKEN_KEY);
    if(GH.user){
      if(GH.gistId)localStorage.setItem(ghGistKey(),GH.gistId);
      else localStorage.removeItem(ghGistKey());
    }
  }catch(e){ /* nothing we can do; the session still works in memory */ }
}
function ghApi(path,opts){
  opts=opts||{};
  var headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(GH.token)headers.Authorization="Bearer "+GH.token;
  if(opts.body)headers["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,{
    method:opts.method||"GET",
    headers:headers,
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    if(r.status===401)return Promise.reject({code:"bad_token"});
    if(r.status===403||r.status===429)return Promise.reject({code:"rate_limited"});
    if(r.status===404)return Promise.reject({code:"not_found"});
    if(!r.ok)return Promise.reject({code:"http_"+r.status});
    return r.status===204?null:r.json();
  },function(){
    return Promise.reject({code:"offline"});
  });
}
function ghPayload(){
  return {app:"pattern-ledger",version:2,updatedAt:new Date().toISOString(),
          state:STATE,custom:CUSTOM};
}
function ghFiles(obj){
  var f={}; f[GIST_FILE]={content:JSON.stringify(obj,null,1)};
  return f;
}
function ghParse(text){
  var out={state:{},custom:emptyCustom()};
  try{
    var j=JSON.parse(text);
    if(j&&typeof j==="object"){
      if(j.state&&typeof j.state==="object")out.state=j.state;
      if(j.custom&&typeof j.custom==="object"){
        out.custom={topics:j.custom.topics||[],groups:j.custom.groups||[],
                    items:j.custom.items||[]};
      }
    }
  }catch(e){ /* a hand-edited gist that no longer parses: start empty rather than crash */ }
  return out;
}
/* Find the app's gist, or make one. Never touches any other gist. */
function ghFindOrCreateGist(allowRetry){
  if(GH.gistId){
    return ghApi("/gists/"+GH.gistId).then(function(g){
      // A secret gist is readable by anyone holding its id, so a stored id is not
      // proof of ownership. Without this check a second person on the same browser
      // could read the first person's gist and then fail every write to it.
      var owner=g&&g.owner&&g.owner.login;
      if(!owner||!GH.user||owner!==GH.user.login){
        GH.gistId=null;
        return ghFindOrCreateGist(false);
      }
      return g;
    },function(e){
      if(e&&e.code==="not_found"&&allowRetry!==false){
        GH.gistId=null;            // deleted on github.com: fall through and make a new one
        return ghFindOrCreateGist(false);
      }
      return Promise.reject(e);
    });
  }
  return ghApi("/gists?per_page=100").then(function(list){
    for(var i=0;i<list.length;i++){
      var g=list[i], own=g.owner&&g.owner.login===GH.user.login;
      if(own&&g.files&&g.files[GIST_FILE]){GH.gistId=g.id;return g;}
    }
    return ghApi("/gists",{method:"POST",body:{
      description:GIST_DESC,"public":false,files:ghFiles(ghPayload())}})
      .then(function(g){GH.gistId=g.id;return g;});
  });
}
function ghConnect(token){
  GH.token=(token||"").trim();
  if(!GH.token)return Promise.reject({code:"bad_token"});
  return ghApi("/user").then(function(u){
    GH.user={login:u.login,name:u.name||u.login,avatar:u.avatar_url};
    ghReadGistId();                 // whichever gist THIS account used here before
    return ghFindOrCreateGist(true);
  }).then(function(){
    ghWriteCreds();
    return true;
  });
}
function ghDisconnect(){
  GH.gistId=null;
  ghWriteCreds();                   // drops this account's remembered gist id
  GH.token=null; GH.user=null;
  try{localStorage.removeItem(GH_TOKEN_KEY);}catch(e){ /* storage blocked */ }
  store=localStore();
  Promise.all([store.load(),store.loadCustom()]).then(function(r){
    STATE=r[0]||{}; CUSTOM=r[1]||emptyCustom();
    rebuildData(); render();
    toast("Disconnected. Showing this browser's copy; the gist is untouched.");
  });
}
function ghErrText(e){
  var c=e&&e.code;
  if(c==="bad_token")return "GitHub rejected that token. Check it has the gist scope and has not expired.";
  if(c==="rate_limited")return "GitHub is rate-limiting this token. Try again shortly.";
  if(c==="offline")return "Could not reach api.github.com.";
  if(c==="not_found")return "That gist no longer exists.";
  return "GitHub error"+(c?(" ("+c+")"):"")+".";
}

/* One gist file holds progress and custom modules, so both reads share one request. */
function gistStore(){
  var fetchP=null, saveTimer=null;
  function fetchAll(){
    if(!fetchP){
      fetchP=ghApi("/gists/"+GH.gistId).then(function(g){
        var f=g.files&&g.files[GIST_FILE];
        if(!f)return {state:{},custom:emptyCustom()};
        if(f.truncated&&f.raw_url){
          return fetch(f.raw_url).then(function(r){return r.text();}).then(ghParse);
        }
        return ghParse(f.content||"");
      });
    }
    return fetchP;
  }
  function flush(){
    fetchP=null;   // our own write is now the truth; drop the cached read
    return ghApi("/gists/"+GH.gistId,{method:"PATCH",body:{files:ghFiles(ghPayload())}})
      .then(function(){return true;},function(){return false;});
  }
  function schedule(){
    clearTimeout(saveTimer);
    return new Promise(function(res){
      saveTimer=setTimeout(function(){flush().then(res);},1200);
    });
  }
  return {
    kind:"gist",
    label:(GH.user&&GH.user.login)||"gist",
    load:function(){return fetchAll().then(function(p){return p.state;});},
    loadCustom:function(){return fetchAll().then(function(p){return p.custom;});},
    save:function(){return schedule();},
    bulk:function(){return flush();},
    saveCustom:function(){return flush();},
    watch:function(){}
  };
}

function dbStore(db){
  return {
    kind:"db",
    load:function(){
      return db.collection("items").get().then(function(s){
        var m={};s.docs.forEach(function(d){var v=d.data()||{};
          m[d.id]={done:!!v.done,note:typeof v.note==="string"?v.note:"",
                   fav:!!v.fav,repeat:!!v.repeat,
                   tags:Array.isArray(v.tags)?v.tags:[],
                   link:v.link||"",linkKind:v.linkKind||""};});
        return m;});
    },
    save:function(id,rec){
      return db.collection("items").doc(id)
        .set({done:!!rec.done,note:rec.note||"",fav:!!rec.fav,repeat:!!rec.repeat,
              tags:rec.tags||[],link:rec.link||"",linkKind:rec.linkKind||"",
              updatedAt:Date.now()})
        .then(function(){return true;}).catch(function(){return false;});
    },
    bulk:function(map){
      var ids=Object.keys(map), i=0;
      return new Promise(function(res){
        (function step(){
          if(i>=ids.length)return res(true);
          var id=ids[i++];
          db.collection("items").doc(id)
            .set({done:!!map[id].done,note:map[id].note||"",fav:!!map[id].fav,
                  repeat:!!map[id].repeat,tags:map[id].tags||[],
                  link:map[id].link||"",linkKind:map[id].linkKind||"",updatedAt:Date.now()})
            .catch(function(){}).then(step);
        })();
      });
    },
    loadCustom:function(){
      return db.collection("meta").doc("custom").get().then(function(d){
        if(!d.exists)return emptyCustom();
        var v=d.data()||{};
        return {topics:v.topics||[],groups:v.groups||[],items:v.items||[]};
      },function(){return emptyCustom();});
    },
    saveCustom:function(c){
      return db.collection("meta").doc("custom")
        .set({topics:c.topics,groups:c.groups,items:c.items,updatedAt:Date.now()})
        .then(function(){return true;},function(){return false;});
    },
    watch:function(){}
  };
}

/* ---------- custom modules and problems ----------
   BASE is the generated curriculum (rebuilt from notes/*.md by tools/build_site.py,
   so anything written into it by hand is lost on the next build). Everything the
   viewer adds lives in CUSTOM, which is stored in whichever database is active,
   and is folded into BASE at load time to produce DATA. */
function newId(prefix){
  return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
}
function rebuildData(){
  var byTopic={}, topics=[];
  BASE.topics.forEach(function(t){
    var copy={id:t.id,title:t.title,concepts:t.concepts,
      problems:t.problems.map(function(g){
        return {id:g.id,title:g.title,source:g.source,items:g.items.slice()};
      })};
    byTopic[t.id]=copy; topics.push(copy);
  });
  CUSTOM.topics.forEach(function(ct){
    if(byTopic[ct.id])return;
    var copy={id:ct.id,title:ct.title,concepts:[],problems:[],custom:true};
    byTopic[ct.id]=copy; topics.push(copy);
  });
  var byGroup={};
  topics.forEach(function(t){t.problems.forEach(function(g){byGroup[g.id]=g;});});
  CUSTOM.groups.forEach(function(cg){
    if(byGroup[cg.id])return;
    var t=byTopic[cg.topicId]; if(!t)return;
    var g={id:cg.id,title:cg.title,source:"custom",custom:true,topicId:cg.topicId,items:[]};
    byGroup[cg.id]=g; t.problems.push(g);
  });
  CUSTOM.items.forEach(function(ci){
    var g=byGroup[ci.groupId];
    if(!g){
      var t=byTopic[ci.topicId]; if(!t)return;
      var fid="custom-"+ci.topicId;
      g=byGroup[fid];
      if(!g){
        g={id:fid,title:"My problems",source:"custom",custom:true,topicId:ci.topicId,items:[]};
        byGroup[fid]=g; t.problems.push(g);
      }
    }
    g.items.push(ci);
  });
  DATA={topics:topics};
  ITEM_TOPIC={}; ALL_PROBLEMS=[];
  topics.forEach(function(t){
    t.problems.forEach(function(g){
      g.items.forEach(function(it){
        ITEM_TOPIC[it.id]=t.title;
        ALL_PROBLEMS.push({item:it,topic:t,group:g});
      });
    });
    t.concepts.forEach(function(c){ITEM_TOPIC[c.id]=t.title;});
  });
}
function persistCustom(msg){
  rebuildData(); render();
  if(!store.saveCustom){toast("This view cannot save custom content.");return;}
  store.saveCustom(CUSTOM).then(function(ok){
    toast(ok?(msg||"Saved."):"Could not save — your change may be lost on reload.");
  });
}
function findTopic(id){
  for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].id===id)return DATA.topics[i];
  return null;
}
function problemById(id){
  for(var i=0;i<ALL_PROBLEMS.length;i++)
    if(ALL_PROBLEMS[i].item.id===id)return ALL_PROBLEMS[i].item;
  return null;
}
function customItem(id){
  for(var i=0;i<CUSTOM.items.length;i++)if(CUSTOM.items[i].id===id)return CUSTOM.items[i];
  return null;
}

/* ---------- modal ---------- */
var modalBack=null;
function closeModal(){
  if(modalBack){modalBack.hidden=true;modalBack.innerHTML="";}
}
function openModal(html,onSubmit){
  if(!modalBack){
    modalBack=document.createElement("div");
    modalBack.id="modalBack"; modalBack.hidden=true;
    document.body.appendChild(modalBack);
    modalBack.addEventListener("click",function(e){
      if(e.target===modalBack)closeModal();
    });
  }
  modalBack.innerHTML='<form class="modal" id="modalForm" autocomplete="off">'+html+'</form>';
  modalBack.hidden=false;
  var form=modalBack.querySelector("#modalForm");
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var err=onSubmit(form);
    if(err){var el=form.querySelector(".err-msg");if(el)el.textContent=err;}
  });
  var first=form.querySelector("input,select,textarea");
  if(first)first.focus();
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&modalBack&&!modalBack.hidden){closeModal();return;}
  var tid=e.target&&e.target.getAttribute&&e.target.getAttribute("data-tagnew");
  if(tid&&e.key==="Enter"){
    e.preventDefault();
    if(addTag(tid,e.target.value)){e.target.value="";pushItem(tid);}
  }
  if(e.key==="Escape"&&e.target&&e.target.id==="search"&&query){
    e.target.value=""; query=""; render();
  }
});

function deleteModule(id){

/* ---------- tags ----------
   Every problem carries its module name as an implicit tag, so module and
   user tags combine in the same filter. Implicit tags cannot be removed. */
function itemTags(id){
  var out=[], mod=ITEM_TOPIC[id];
  if(mod)out.push({name:mod,implicit:true});
  st(id).tags.forEach(function(t){
    if(!mod||t!==mod)out.push({name:t,implicit:false});
  });
  return out;
}
function tagNames(id){
  return itemTags(id).map(function(t){return t.name;});
}
function allTags(){
  var counts={}, implicit={};
  ALL_PROBLEMS.forEach(function(r){
    tagNames(r.item.id).forEach(function(n){counts[n]=(counts[n]||0)+1;});
    if(ITEM_TOPIC[r.item.id])implicit[ITEM_TOPIC[r.item.id]]=true;
  });
  return Object.keys(counts).sort(function(a,b){
    if(implicit[a]!==implicit[b])return implicit[a]?1:-1;   // user tags first
    return a.localeCompare(b);
  }).map(function(n){return {name:n,count:counts[n],implicit:!!implicit[n]};});
}
function addTag(id,name){
  name=(name||"").trim().replace(/\s+/g," ").slice(0,32);
  if(!name)return false;
  var cur=st(id).tags.slice();
  var low=name.toLowerCase();
  for(var i=0;i<cur.length;i++)if(cur[i].toLowerCase()===low)return false;
  if(ITEM_TOPIC[id]&&ITEM_TOPIC[id].toLowerCase()===low)return false;   // already implicit
  cur.push(name);
  setItem(id,{tags:cur});
  return true;
}
function removeTag(id,name){
  setItem(id,{tags:st(id).tags.filter(function(t){return t!==name;})});
}
/* Remove a tag from every problem that carries it. Module tags are implicit and
   cannot be deleted this way. */
function tagUsage(name){
  var ids=[];
  ALL_PROBLEMS.forEach(function(r){
    if(st(r.item.id).tags.indexOf(name)>=0)ids.push(r.item.id);
  });
  return ids;
}
function deleteTagEverywhere(name){
  var ids=tagUsage(name);
  if(!ids.length){toast("That tag is not used anywhere.");return;}
  ids.forEach(function(id){removeTag(id,name);});
  var i=activeTags.indexOf(name);
  if(i>=0)activeTags.splice(i,1);
  render();
  store.bulk(STATE).then(function(ok){
    toast(ok?('Removed "'+name+'" from '+ids.length+' problem'+(ids.length===1?"":"s")+"."):
             "Could not save that change.");
  });
}
function toggleActiveTag(name){
  var i=activeTags.indexOf(name);
  if(i<0)activeTags.push(name); else activeTags.splice(i,1);
}
function passTags(id){
  if(!activeTags.length)return true;
  var names=tagNames(id);
  for(var i=0;i<activeTags.length;i++)
    if(names.indexOf(activeTags[i])<0)return false;    // AND across tags
  return true;
}

/* ---------- counting ---------- */
function matches(title,extra){
  if(!query)return true;
  return ((title+" "+(extra||"")).toLowerCase().indexOf(query)!==-1);
}
function conceptHaystack(c,topicTitle){
  return c.title+" "+(topicTitle||"")+" "+c.content;
}
function passFilter(id){
  var s=st(id);
  if(filter==="todo")return !s.done;
  if(filter==="done")return s.done;
  if(filter==="fav")return s.fav;
  if(filter==="repeat")return s.repeat;
  return true;
}
function conceptCount(t){
  var d=0;t.concepts.forEach(function(c){if(isDone(c.id))d++;});
  return {done:d,total:t.concepts.length};
}
function problemCount(t){
  var d=0,n=0;
  t.problems.forEach(function(g){g.items.forEach(function(it){n++;if(isDone(it.id))d++;});});
  return {done:d,total:n};
}
function topicCount(t){
  var c=conceptCount(t),p=problemCount(t);
  return {done:c.done+p.done,total:c.total+p.total,c:c,p:p};
}
function allCount(){
  var cd=0,cn=0,pd=0,pn=0;
  DATA.topics.forEach(function(t){
    var c=conceptCount(t),p=problemCount(t);
    cd+=c.done;cn+=c.total;pd+=p.done;pn+=p.total;});
  return {cdone:cd,ctotal:cn,pdone:pd,ptotal:pn,done:cd+pd,total:cn+pn};
}
function pct(d,n){return n?Math.round(d/n*100):0;}

/* ---------- rail ---------- */
/* Zone widths are proportional to how many items each side holds, and each zone
   fills independently \u2014 so "concepts done, problems pending" is readable at a
   glance without a second bar. */
function splitBar(c,p,cls){
  var tot=c.total+p.total;
  if(!tot)return '<div class="'+cls+'"></div>';
  var title="Concepts "+c.done+"/"+c.total+" \u00b7 Problems "+p.done+"/"+p.total;
  var h='<div class="'+cls+' dual" title="'+title+'">';
  if(c.total)h+='<div class="zone zc" style="width:'+(c.total/tot*100)+'%">'+
    '<i style="width:'+(c.done/c.total*100)+'%"></i></div>';
  if(p.total)h+='<div class="zone zp" style="width:'+(p.total/tot*100)+'%">'+
    '<i style="width:'+(p.done/p.total*100)+'%"></i></div>';
  return h+'</div>';
}
function legend(c,p){
  var out='<div class="legend">';
  if(c.total)out+='<span><span class="sq c"></span>Concepts <b>'+c.done+'/'+c.total+'</b></span>';
  if(p.total)out+='<span><span class="sq p"></span>Problems <b>'+p.done+'/'+p.total+'</b></span>';
  return out+'</div>';
}

/* ---------- markdown ---------- */
var mdCache={};
function renderMd(src,key){
  if(key&&mdCache[key])return mdCache[key];
  var out;
  try{
    out=(window.marked&&window.marked.parse)
      ? window.marked.parse(src,{mangle:false,headerIds:false,breaks:false})
      : '<pre>'+esc(src)+'</pre>';
  }catch(e){out='<pre>'+esc(src)+'</pre>';}
  if(key)mdCache[key]=out;
  return out;
}
function highlightIn(root){
  if(!window.hljs)return;
  var blocks=root.querySelectorAll("pre code:not([data-hl])");
  for(var i=0;i<blocks.length;i++){
    blocks[i].setAttribute("data-hl","1");
    try{window.hljs.highlightElement(blocks[i]);}catch(e){}
  }
}

/* ---------- problems ---------- */
var TIER={basic:"Basic",core:"Core",pro:"Pro"};

/* Where a problem's link comes from, in order:
   1. one you saved yourself   2. the generated one   3. nothing.
   A generated "search" link counts as a placeholder, not a real link. */
function detectKind(url){
  var u=String(url||"").toLowerCase();
  if(u.indexOf("leetcode.com/problems/")>=0)return "leetcode";
  if(u.indexOf("leetcode.com")>=0)return "leetcode";
  if(u.indexOf("geeksforgeeks.org")>=0)return "gfg";
  if(u.indexOf("takeuforward.org")>=0)return "tuf";
  if(u.indexOf("codeforces.com")>=0||u.indexOf("hackerrank.com")>=0||
     u.indexOf("interviewbit.com")>=0||u.indexOf("codingninjas.com")>=0||
     u.indexOf("naukri.com")>=0)return "other";
  return "other";
}
function effLink(it){
  var s=st(it.id);
  if(s.link)return {url:s.link,kind:s.linkKind||detectKind(s.link),mine:true};
  if(it.url)return {url:it.url,kind:it.urlKind||"search",mine:false};
  return {url:"",kind:"",mine:false};
}
function needsLink(it){
  var l=effLink(it);
  return !l.url||(l.kind==="search"&&!l.mine);
}
function lcSearchUrl(it){
  if(it.url&&it.urlKind==="search")return it.url;
  if(it.lc){
    var n=String(it.lc).match(/\d+/);
    if(n)return "https://leetcode.com/problemset/?search="+n[0];
  }
  return "https://leetcode.com/problemset/?search="+encodeURIComponent(it.title);
}
function gfgSearchUrl(it){
  return "https://www.geeksforgeeks.org/search/?gq="+encodeURIComponent(it.title);
}
var LINK_KIND={
  leetcode:{label:"LeetCode \u2197",      cls:"lc"},
  direct:  {label:"LeetCode \u2197",      cls:"lc"},      // data written before the rename
  tuf:     {label:"takeUforward \u2197",  cls:"tuf"},
  article: {label:"TUF article \u2197",   cls:"tuf"},
  gfg:     {label:"GeeksforGeeks \u2197", cls:"gfg"},
  other:   {label:"Open \u2197",          cls:"lc"},
  search:  {label:"Find on LC \u2197",    cls:"lc dim"}
};

  if(it.lc)tags+='<span class="tag">LC '+esc(it.lc)+'</span>';
  var L=effLink(it);
  if(L.url&&!(L.kind==="search"&&!L.mine)){
    var lk=LINK_KIND[L.kind]||LINK_KIND.other;
    tags+='<a class="tag '+lk.cls+'" href="'+esc(L.url)+'" target="_blank" rel="noopener">'+
      lk.label+'</a>'+
      // always offer a change: a built-in link can be premium, dead, or the wrong site
      '<button class="tag linkedit" data-linkedit="'+esc(it.id)+'" '+
      'title="'+(L.mine?"Change or remove this link":"Replace this link \u2014 premium, wrong site, or broken")+
      '" aria-label="Edit link">\u270e</button>';
  }else{
    tags+='<button class="tag addlink" data-linkedit="'+esc(it.id)+'" '+
      'title="Save a LeetCode, GeeksforGeeks or other link for this problem">+ add link</button>';
  }
  if(it.custom)tags+='<span class="tag custom">mine</span>';
  if(hasNote)tags+='<span class="tag has-note">note</span>';
  itemTags(it.id).forEach(function(tg){
    tags+='<button class="chip'+(tg.implicit?" mod":"")+
      (activeTags.indexOf(tg.name)>=0?" on":"")+'" data-tagclick="'+esc(tg.name)+
      '" title="Filter by this tag">'+esc(tg.name)+'</button>';
  });
  var h='<div class="row'+(done?" is-done":"")+'">'+
    '<button class="tick" data-tick="'+esc(it.id)+'" aria-pressed="'+done+'" aria-label="Mark solved">'+
      '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9 10.5 2.8"/></svg></button>'+
    '<div class="row-mid"><div class="row-title">'+esc(it.title)+'</div>'+
      (it.hint?'<div class="row-hint">'+esc(it.hint)+'</div>':'')+
      (tags?'<div class="row-tags">'+tags+'</div>':'')+'</div>'+

function problemHaystack(it,gTitle){
  return it.title+" "+(it.lc||"")+" "+(it.tier||"")+" "+(gTitle||"")+" "+
         (ITEM_TOPIC[it.id]||"")+" "+tagNames(it.id).join(" ");
}
function visibleProblems(g){
  var out=[];
  g.items.forEach(function(it){
    if(!passFilter(it.id))return;
    if(!passTags(it.id))return;
    if(!matches(problemHaystack(it,g.title),""))return;
    out.push(it);
  });
  return out;
}

/* ---------- topic view ---------- */
function renderTopic(){
  var t=null;
  for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].id===route.topic)t=DATA.topics[i];
  if(!t){route={view:"dash",topic:null,tab:"concepts"};return renderDash();}
  var c=topicCount(t);
  var tab=route.tab;
  if(tab==="concepts"&&!t.concepts.length&&t.problems.length)tab="problems";
  if(tab==="problems"&&!problemCount(t).total&&t.concepts.length)tab="concepts";

  var h='<h1 class="page-title">'+esc(t.title)+'</h1>'+
    '<p class="page-sub">'+c.done+' of '+c.total+' done · '+pct(c.done,c.total)+'% complete</p>'+
    splitBar(c.c,c.p,"bar")+legend(c.c,c.p)+'<div style="height:18px"></div>';

  h+='<div class="tabs" role="tablist">'+
    '<button role="tab" data-tab="concepts" aria-selected="'+(tab==="concepts")+'">Concepts'+
      '<span class="tab-n">'+c.c.done+'/'+c.c.total+'</span></button>'+
    '<button role="tab" data-tab="problems" aria-selected="'+(tab==="problems")+'">Problems'+
      '<span class="tab-n">'+c.p.done+'/'+c.p.total+'</span></button></div>';

  h+='<div class="topic-actions">'+
     (filtersActive()?'<span class="left">Filtered to this module</span>':'<span class="left"></span>')+
     '<button class="btn-ghost" data-addproblem="'+esc(t.id)+'">+ Add problem</button>'+
     (t.custom?'<button class="btn-ghost" data-editmodule="'+esc(t.id)+'">Rename or delete</button>':'')+
     '<button class="btn-ghost danger-ghost" data-modreset="'+esc(t.id)+'">Reset this module</button>'+
     '</div>';
  h+=tagBar();

  var shown=0;
  if(tab==="concepts"){
    if(!t.concepts.length){
      h+='<div class="empty">No written notes for this topic yet.<br>'+
         'Its problems are under the <strong>Problems</strong> tab.</div>';
    }else{
      t.concepts.forEach(function(cc){
        if(!passFilter(cc.id))return;
        if(!matches(conceptHaystack(cc,t.title),""))return;
        shown++;h+=conceptCard(cc);
      });
      if(!shown)h+='<div class="empty">No concept section matches this filter.</div>';
    }
  }else{
    if(!c.p.total){
      h+='<div class="empty">No tagged problems for this topic.<br>'+
         'The patterns are taught under the <strong>Concepts</strong> tab.</div>';
    }else{
      t.problems.forEach(function(g){
        var items=visibleProblems(g);
        if(!items.length)return;
        shown+=items.length;
        var gd=0;g.items.forEach(function(it){if(isDone(it.id))gd++;});
        var gp=pct(gd,g.items.length);
        var isOpen=openSec[g.id]!==undefined?openSec[g.id]:(!!query||filter!=="all"||true);
        h+='<section class="section'+(isOpen?" open":"")+'">'+
          '<button class="sec-head" data-sechead="'+esc(g.id)+'">'+
          '<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>'+
          '<span class="sec-title">'+esc(g.title)+
            (g.source==="a2z"?' <span class="tag src-a2z" style="margin-left:4px">A2Z</span>':'')+'</span>'+
          '<span class="sec-bar'+(gp===100?" done":"")+'"><i style="width:'+gp+'%"></i></span>'+
          '<span class="sec-count tnum">'+gd+'/'+g.items.length+'</span></button>'+
          '<div class="sec-body">';
        items.forEach(function(it){h+=problemRow(it);});
        h+='</div></section>';
      });
      if(!shown)h+='<div class="empty">No problem matches this filter.</div>';
    }
  }
  view.innerHTML=h+tagDatalist();
  highlightIn(view);
}

var pendingMerge=null;   // {local:{...}} shown as a choice on the dashboard

function countEntries(m){
  return Object.keys(m||{}).filter(function(k){
    var v=m[k];
    return v&&(v.done||v.fav||v.repeat||(v.tags&&v.tags.length)||(v.note&&v.note.trim()));
  }).length;
}
function customSize(c){
  return ((c&&c.topics)||[]).length+((c&&c.items)||[]).length;
}

/* First connect: decide what happens to work already in this browser. */
function adoptGist(){
  var localMap=STATE, localCustom=CUSTOM;
  var gs=gistStore();
  toast("Reading your gist\u2026");
  Promise.all([gs.load(),gs.loadCustom()]).then(function(r){
    var cloud=r[0], cloudCustom=r[1];
    var nLocal=countEntries(localMap), nCloud=countEntries(cloud);
    store=gs;
    if(customSize(localCustom)&&!customSize(cloudCustom)){
      CUSTOM=localCustom;
    }else{
      CUSTOM=cloudCustom;
    }
    if(nLocal&&!nCloud){
      STATE=localMap;
      rebuildData(); render();
      store.bulk().then(function(ok){
        toast(ok?("Uploaded "+nLocal+" items to your gist."):"Could not write to the gist.");
        renderAccount();
      });
      return;
    }
    STATE=cloud;
    rebuildData(); render();
    if(nLocal&&nCloud){
      pendingMerge={local:localMap,nLocal:nLocal,nCloud:nCloud};
      route={view:"dash",topic:null,tab:route.tab};
      render();
    }else{
      if(customSize(CUSTOM)!==customSize(cloudCustom))store.saveCustom();
      toast("Connected. "+nCloud+" items loaded from your gist.");
    }
  },function(e){
    store=localStore();
    renderAccount();
    toast(ghErrText(e));
  });
}

function applyMerge(){
  if(!pendingMerge)return;
  var local=pendingMerge.local, added=0;
  Object.keys(local).forEach(function(k){
    var l=local[k], c=STATE[k];
    if(!l)return;
    if(!c){STATE[k]={done:!!l.done,note:l.note||"",fav:!!l.fav,repeat:!!l.repeat,
                      tags:l.tags||[]};added++;return;}
    if(l.done&&!c.done){c.done=true;added++;}
    if(l.fav&&!c.fav){c.fav=true;added++;}
    if(l.repeat&&!c.repeat){c.repeat=true;added++;}
    if(l.tags&&l.tags.length){
      var have=(c.tags||[]).map(function(x){return x.toLowerCase();});
      (c.tags=c.tags||[]);
      l.tags.forEach(function(tg){
        if(have.indexOf(String(tg).toLowerCase())<0){c.tags.push(tg);added++;}
      });
    }
    if(l.link&&!c.link){c.link=l.link;c.linkKind=l.linkKind||"";added++;}
    if(l.note&&l.note.trim()&&!(c.note&&c.note.trim())){c.note=l.note;added++;}
  });
  pendingMerge=null;
  render();
  store.bulk(STATE).then(function(){toast("Merged. "+added+" change"+(added===1?"":"s")+" added from this browser.");});
}

function tagBar(){
  var tags=allTags();
  if(!tags.length)return "";
  var shown=tags.filter(function(t){

  });
  if(route.view!=="search"&&!shown.length&&!activeTags.length)return "";
  var h='<div class="tagbar"><span class="tagbar-label">Tags</span>';
  shown.forEach(function(t){
    var on=activeTags.indexOf(t.name)>=0;
    h+='<span class="chip-wrap'+(t.implicit?" mod":"")+(on?" on":"")+'">'+
      '<button class="chip'+(t.implicit?" mod":"")+(on?" on":"")+'" data-tagclick="'+esc(t.name)+
        '" title="Filter by this tag">'+esc(t.name)+' <span style="opacity:.6">'+t.count+'</span></button>'+
      (t.implicit?'':'<button class="chipx" data-tagpurge="'+esc(t.name)+
        '" title="Delete this tag from every problem" aria-label="Delete tag everywhere">\u00d7</button>')+
      '</span>';
  });
  if(activeTags.length)
    h+='<button class="linkbtn" id="clearTags" style="margin-left:4px">Clear</button>';
  h+='</div>';
  return h;
}
function tagDatalist(){

  }).join("")+'</datalist>';
}

/* Search runs over every module, not just the one on screen. */
function renderSearch(){
  var hits=[], byTopic={};
  ALL_PROBLEMS.forEach(function(r){
    if(!passFilter(r.item.id))return;
    if(!passTags(r.item.id))return;
    if(!matches(problemHaystack(r.item,r.group.title),""))return;
    if(!byTopic[r.topic.id])byTopic[r.topic.id]={topic:r.topic,groups:{}};
    var slot=byTopic[r.topic.id];
    if(!slot.groups[r.group.id])slot.groups[r.group.id]={group:r.group,items:[]};
    slot.groups[r.group.id].items.push(r.item);
    hits.push(r);
  });
  var concepts=[];
  DATA.topics.forEach(function(t){
    t.concepts.forEach(function(c){
      if(!passFilter(c.id))return;
      if(activeTags.length)return;          // concepts carry no tags
      if(!matches(conceptHaystack(c,t.title),""))return;
      concepts.push({topic:t,concept:c});
    });
  });

  var h='<h1 class="page-title">'+(query?'Results for \u201c'+esc(query)+'\u201d':'Filtered')+'</h1>'+
    '<p class="page-sub">'+hits.length+' problem'+(hits.length===1?"":"s")+
    (concepts.length?(' and '+concepts.length+' concept section'+(concepts.length===1?"":"s")):"")+
    ' across every module</p>';
  h+=tagBar();

  if(!hits.length&&!concepts.length){
    view.innerHTML=h+'<div class="empty">Nothing matches.<br>'+
      (activeTags.length?'Try clearing a tag, or ':'')+'try a shorter search term.</div>';
    return;
  }
  Object.keys(byTopic).forEach(function(tid){
    var slot=byTopic[tid];
    h+='<div class="res-topic">'+esc(slot.topic.title)+'</div>';
    Object.keys(slot.groups).forEach(function(gid){
      var gg=slot.groups[gid];
      h+='<section class="section open"><button class="sec-head" data-sechead="res-'+esc(gid)+'">'+
        '<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>'+
        '<span class="sec-title">'+esc(gg.group.title)+'</span>'+
        '<span class="sec-count tnum">'+gg.items.length+'</span></button><div class="sec-body">';
      gg.items.forEach(function(it){h+=problemRow(it);});
      h+='</div></section>';
    });
  });
  if(concepts.length){
    h+='<div class="res-topic">Concept sections</div>';
    concepts.forEach(function(c){
      h+='<section class="section"><div class="sec-head" style="cursor:default">'+
        '<button class="tick" data-tick="'+esc(c.concept.id)+'" aria-pressed="'+isDone(c.concept.id)+
        '" aria-label="Mark as read"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9 10.5 2.8"/></svg></button>'+
        '<span class="sec-title">'+esc(c.concept.title)+
        ' <span class="tag" style="margin-left:4px">'+esc(c.topic.title)+'</span></span>'+
        '<button class="mini" data-gotopic="'+esc(c.topic.id)+'">Open module</button></div></section>';
    });
  }
  view.innerHTML=h+tagDatalist();
  highlightIn(view);
}

/* ---------- mutations ---------- */
function toggle(id){
  setItem(id,{done:!st(id).done});
  pushItem(id);
}
function pushItem(id){
  render();
  store.save(id,STATE[id]).then(function(ok){
    if(!ok)toast("Could not save. Your progress may not persist.");
  });
}
function toggleFav(id){
  var v=!st(id).fav; setItem(id,{fav:v}); pushItem(id);
}
function toggleRepeat(id){
  var v=!st(id).repeat; setItem(id,{repeat:v}); pushItem(id);
}
/* Clear the ticks for one module. Notes, tags, favourites and repeat marks stay. */
function resetModule(topicId){
  var t=findTopic(topicId);
  if(!t)return;
  var ids=[];
  t.concepts.forEach(function(c){if(isDone(c.id))ids.push(c.id);});
  t.problems.forEach(function(g){g.items.forEach(function(it){if(isDone(it.id))ids.push(it.id);});});
  if(!ids.length){toast("Nothing ticked in this module.");return;}
  ids.forEach(function(id){setItem(id,{done:false});});
  render();
  store.bulk(STATE).then(function(){
    toast("Reset "+ids.length+" item"+(ids.length===1?"":"s")+" in "+t.title+". Notes and tags kept.");
  });
}
function queueNote(id,text){
  setItem(id,{note:text});
  var el=document.querySelector('[data-notestatus="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(el)el.textContent="Saving…";
  clearTimeout(noteTimers[id]);
  noteTimers[id]=setTimeout(function(){
    store.save(id,STATE[id]).then(function(ok){
      var e2=document.querySelector('[data-notestatus="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
      if(e2){e2.textContent=ok?"Saved":"Not saved";
        if(ok)setTimeout(function(){if(e2.textContent==="Saved")e2.textContent="";},1700);}
      renderRail();
    });
  },700);
}
function resetAll(){
  var ids=Object.keys(STATE).filter(function(k){return STATE[k].done;});
  if(!ids.length){toast("Nothing to reset.");return;}
  ids.forEach(function(id){setItem(id,{done:false});});
  render();
  store.bulk(STATE).then(function(){toast("Progress reset for "+ids.length+" item"+(ids.length===1?"":"s")+". Notes kept.");});
}
function blobDownload(payload){
  var blob=new Blob([payload],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="pattern-ledger-backup.json";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},800);
  toast("Backup downloaded.");
}
function exportBackup(){
  var payload=JSON.stringify({app:"pattern-ledger",version:2,
    exportedAt:new Date().toISOString(),state:STATE,custom:CUSTOM},null,2);
  // Hosted on claude.ai the frame blocks plain downloads; the capability handles it there.
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(dl){
      if(!dl)return blobDownload(payload);
      dl.save({filename:"pattern-ledger-backup.json",data:payload})
        .then(function(){toast("Backup saved.");},
              function(){toast("Download was declined.");});
    },function(){blobDownload(payload);});
    return;
  }
  blobDownload(payload);
}
function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var j=JSON.parse(fr.result);
      var incoming=j&&j.state?j.state:j;
      if(!incoming||typeof incoming!=="object")throw new Error("bad shape");
      var n=0;
      Object.keys(incoming).forEach(function(k){
        var v=incoming[k];
        if(v&&typeof v==="object"){
          STATE[k]={done:!!v.done,note:typeof v.note==="string"?v.note:""};n++;
        }
      });
      var nc=0;
      if(j&&j.custom&&typeof j.custom==="object"){
        var inc=j.custom;
        var have={};
        CUSTOM.topics.forEach(function(t){have[t.id]=1;});
        CUSTOM.groups.forEach(function(g){have[g.id]=1;});
        CUSTOM.items.forEach(function(it){have[it.id]=1;});
        (inc.topics||[]).forEach(function(t){if(t&&t.id&&!have[t.id]){CUSTOM.topics.push(t);nc++;}});
        (inc.groups||[]).forEach(function(g){if(g&&g.id&&!have[g.id])CUSTOM.groups.push(g);});
        (inc.items||[]).forEach(function(it){if(it&&it.id&&!have[it.id]){CUSTOM.items.push(it);nc++;}});
      }
      rebuildData();
      Promise.all([store.bulk(STATE),store.saveCustom?store.saveCustom(CUSTOM):null])
        .then(function(){render();
          toast("Imported "+n+" items"+(nc?(" and "+nc+" of your own entries"):"")+".");});
    }catch(e){toast("That file is not a Pattern Ledger backup.");}
  };
  fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el;
  if((el=e.target.closest("[data-tick]"))){toggle(el.getAttribute("data-tick"));return;}
  if((el=e.target.closest("[data-fav]"))){toggleFav(el.getAttribute("data-fav"));return;}
  if((el=e.target.closest("[data-linkedit]"))){
    var lid=el.getAttribute("data-linkedit"), rec=problemById(lid);
    if(rec)linkForm(rec);
    return;
  }
  if((el=e.target.closest("[data-linkclear]"))){clearLink(el.getAttribute("data-linkclear"));return;}
  if((el=e.target.closest("[data-repeat]"))){toggleRepeat(el.getAttribute("data-repeat"));return;}
  if((el=e.target.closest("[data-tagdel]"))){
    removeTag(el.getAttribute("data-tagdel"),el.getAttribute("data-tagname"));
    pushItem(el.getAttribute("data-tagdel"));
    return;
  }
  if((el=e.target.closest("[data-tagadd]"))){
    var aid=el.getAttribute("data-tagadd");
    var inp=document.querySelector('[data-tagnew="'+(window.CSS&&CSS.escape?CSS.escape(aid):aid)+'"]');
    if(inp&&addTag(aid,inp.value)){inp.value="";pushItem(aid);}
    return;
  }
  if((el=e.target.closest("[data-tagpurge]"))){
    var pname=el.getAttribute("data-tagpurge");
    if(el.getAttribute("data-armed")==="1"){deleteTagEverywhere(pname);return;}
    el.setAttribute("data-armed","1");
    el.textContent="delete?";
    el.title='Click again to remove "'+pname+'" from every problem';
    return;
  }
  if((el=e.target.closest("[data-tagclick]"))){
    toggleActiveTag(el.getAttribute("data-tagclick"));
    render();
    return;
  }
  if(e.target.id==="clearTags"){activeTags=[];render();return;}
  if((el=e.target.closest("[data-gotopic]"))){
    query=""; activeTags=[];
    var si=$("#search"); if(si)si.value="";
    route={view:"topic",topic:el.getAttribute("data-gotopic"),tab:"concepts"};
    render(); $("#main").scrollTop=0;
    return;
  }
  if((el=e.target.closest("[data-modreset]"))){
    var mid=el.getAttribute("data-modreset");
    if(el.getAttribute("data-armed")==="1"){resetModule(mid);return;}
    el.setAttribute("data-armed","1");
    el.textContent="Really reset this module?";
    return;
  }
  if((el=e.target.closest("[data-nav]"))){
    var nav=el.getAttribute("data-nav");
    route = nav==="dash" ? {view:"dash",topic:null,tab:route.tab}
                         : {view:"topic",topic:el.getAttribute("data-id"),tab:"concepts"};
    try{location.hash=route.topic||"dashboard";}catch(err){}
    closeRail();render();$("#main").scrollTop=0;return;
  }
  if((el=e.target.closest("[data-tab]"))){
    route.tab=el.getAttribute("data-tab");render();return;
  }
  if((el=e.target.closest("[data-sechead]"))){
    var sid=el.getAttribute("data-sechead");
    var cur=openSec[sid]!==undefined?openSec[sid]:(route.tab==="problems");
    openSec[sid]=!cur;render();
    return;
  }
  if((el=e.target.closest("[data-detail]"))){
    var iid=el.getAttribute("data-detail");
    openDetail[iid]=!openDetail[iid];render();
    var ta=document.getElementById("na-"+iid);if(ta)ta.focus();
    return;
  }
  if(e.target.id==="resetBtn"){
    $("#resetZone").innerHTML='<span style="font-size:13px;font-weight:600;color:var(--red)">Clear every tick?</span>'+
      '<button class="btn-danger" id="resetYes">Yes, reset</button>'+
      '<button class="btn-ghost" id="resetNo">Cancel</button>';return;
  }
  if(e.target.id==="resetYes"){resetAll();return;}
  if(e.target.id==="resetNo"){renderDash();return;}
  if(e.target.id==="exportBtn"){exportBackup();return;}
  if(e.target.id==="importBtn"){$("#importFile").click();return;}
  if(e.target.id==="newModuleBtn"){moduleForm(null);return;}
  if(e.target.id==="addProblemBtn"){problemForm(null,route.topic);return;}
  if((el=e.target.closest("[data-addproblem]"))){problemForm(null,el.getAttribute("data-addproblem"));return;}
  if((el=e.target.closest("[data-editproblem]"))){
    var ci=customItem(el.getAttribute("data-editproblem"));
    if(ci)problemForm(ci,ci.topicId);
    return;
  }
  if((el=e.target.closest("[data-editmodule]"))){
    var tid=el.getAttribute("data-editmodule");
    var ct=null;
    for(var i2=0;i2<CUSTOM.topics.length;i2++)if(CUSTOM.topics[i2].id===tid)ct=CUSTOM.topics[i2];
    if(ct)moduleForm(ct);
    return;
  }
  if((el=e.target.closest("[data-delmodule]"))){
    var dm=el.getAttribute("data-delmodule");
    if(el.getAttribute("data-armed")==="1"){deleteModule(dm);return;}
    el.setAttribute("data-armed","1");
    el.textContent="Really delete — this removes its problems";
    return;
  }
  if((el=e.target.closest("[data-delproblem]"))){
    var dp=el.getAttribute("data-delproblem");
    if(el.getAttribute("data-armed")==="1"){deleteProblem(dp);return;}
    el.setAttribute("data-armed","1");
    el.textContent="Really delete";
    return;
  }
  if(e.target.closest("[data-close]")){closeModal();return;}
  if(e.target.closest("#ghConnectBtn")){connectForm();return;}
  if(e.target.id==="ghDisconnect"){ghDisconnect();return;}
  if(e.target.id==="mergeYes"){applyMerge();return;}
  if(e.target.id==="mergeNo"){pendingMerge=null;render();toast("Keeping your account's progress.");return;}
  if(e.target.id==="menuBtn"){$("#rail").classList.add("open");$("#scrim").classList.add("show");return;}
  if(e.target.id==="scrim"){closeRail();return;}
  if(e.target.id==="clearFilters"){clearAllFilters();return;}
  if(e.target.id==="paletteBtn"){
    var m=$("#paletteMenu");
    renderPaletteMenu();
    m.hidden=!m.hidden;
    e.target.setAttribute("aria-expanded",String(!m.hidden));
    return;
  }
  if((el=e.target.closest("[data-palette]"))&&el.classList&&el.className.indexOf("menu-item")>=0){
    setPalette(el.getAttribute("data-palette"));
    return;
  }
  if((el=e.target.closest("[data-mode]"))){
    var want=el.getAttribute("data-mode");
    document.documentElement.setAttribute("data-theme",want);
    try{localStorage.setItem("pl-theme",want);}catch(err){ /* storage blocked */ }
    renderPaletteMenu();
    return;
  }
  if(!e.target.closest("#paletteMenu")&&!e.target.closest("#paletteBtn")){
    var pm=$("#paletteMenu");
    if(pm&&!pm.hidden){pm.hidden=true;$("#paletteBtn").setAttribute("aria-expanded","false");}
  }
  if(e.target.id==="themeBtn"){
    var r=document.documentElement;
    var dark=r.getAttribute("data-theme")==="dark"||
      (!r.getAttribute("data-theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-theme",dark?"light":"dark");
    try{localStorage.setItem("pl-theme",dark?"light":"dark");}catch(err){ /* storage blocked */ }
    renderPaletteMenu();
    return;
  }
});
function closeRail(){$("#rail").classList.remove("open");$("#scrim").classList.remove("show");}

$("#importFile").addEventListener("change",function(e){
  if(e.target.files&&e.target.files[0])importBackup(e.target.files[0]);
  e.target.value="";
});

document.addEventListener("change",function(e){
  if(!modalBack||modalBack.hidden)return;
  var form=modalBack.querySelector("#modalForm");
  if(!form)return;
  if(e.target.getAttribute("data-topicsel")){
    var gs=form.querySelector("[data-groupsel]");
    if(gs)gs.innerHTML=groupOptions(e.target.value,null);
    var ng=form.querySelector("#pNewGroup");
    if(ng)ng.hidden=true;
  }
  if(e.target.getAttribute("data-groupsel")){
    var ng2=form.querySelector("#pNewGroup");
    if(ng2){
      ng2.hidden=e.target.value!=="__new__";
      if(!ng2.hidden)ng2.focus();
    }
  }
});

var searchT;
document.addEventListener("input",function(e){
  if(e.target.id==="search"){
    clearTimeout(searchT);
    var v=e.target.value.trim().toLowerCase();
    searchT=setTimeout(function(){
      query=v;            // render() routes to the global results view when this is set
      render();
    },160);
    return;
  }
  var nid=e.target.getAttribute&&e.target.getAttribute("data-note");
  if(nid)queueNote(nid,e.target.value);
});

var FILTER_BTNS={fAll:"all",fTodo:"todo",fDone:"done",fFav:"fav",fRep:"repeat"};
Object.keys(FILTER_BTNS).forEach(function(id){
  document.getElementById(id).addEventListener("click",function(){
    filter=FILTER_BTNS[id];
    Object.keys(FILTER_BTNS).forEach(function(b){
      document.getElementById(b).setAttribute("aria-pressed",b===id?"true":"false");});
    render();
  });
});

/* ---------- boot ---------- */
try{
  var sv=localStorage.getItem("pl-theme");
  if(sv)document.documentElement.setAttribute("data-theme",sv);
  var sp=localStorage.getItem("pl-palette");
  if(sp)document.documentElement.setAttribute("data-palette",sp);
}catch(e){ /* storage blocked: fall back to the default palette */ }
if(window.hljs&&window.hljs.configure)window.hljs.configure({ignoreUnescapedHTML:true});

view.innerHTML='<div class="empty">Loading your curriculum…</div>';

fetch("data/curriculum.json").then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(d){
  BASE=d; rebuildData();
  var hash=(location.hash||"").replace(/^#/,"");
  if(hash&&hash!=="dashboard"){
    for(var i=0;i<DATA.topics.length;i++)
      if(DATA.topics[i].id===hash)route={view:"topic",topic:hash,tab:"concepts"};
  }
  return (window.claude&&window.claude.use)?window.claude.use("db"):null;
}).then(function(ns){
  if(ns){ store=dbStore(ns); return null; }        // hosted on claude.ai
  // self-hosted: use the gist when a token from a previous visit is present
  ghReadCreds();
  store=localStore();
  if(GH.token){
    return ghApi("/user").then(function(u){
      GH.user={login:u.login,name:u.name||u.login,avatar:u.avatar_url};
      ghReadGistId();
      return ghFindOrCreateGist(true).then(function(){
        ghWriteCreds();
        store=gistStore();
      });
    },function(e){
      if(e&&e.code==="bad_token"){
        GH.token=null; GH.user=null;
        try{localStorage.removeItem(GH_TOKEN_KEY);}catch(e2){ /* storage blocked */ }
      }
      setTimeout(function(){toast(ghErrText(e)+" Using this browser's copy.");},600);
    });
  }
  return null;
}).then(function(){
  return Promise.all([store.load(), store.loadCustom?store.loadCustom():emptyCustom()]);
}).then(function(r){
  STATE=r[0]||{};
  CUSTOM=r[1]||emptyCustom();
  rebuildData();
  render();
}).catch(function(err){
  if(!DATA){
    view.innerHTML='<div class="empty">Could not load <code>data/curriculum.json</code>.<br>'+
      esc(err&&err.message)+'<br><br>If you opened this file directly from disk, run a local server '+
      'instead: <code>python3 -m http.server</code> in this folder.</div>';
  }else{
    store=localStore();
    store.load().then(function(m){STATE=m||{};render();});
  }
});

})();
</script>
