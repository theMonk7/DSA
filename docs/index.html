/* ---- calm pastel palettes ----
   Tinted paper instead of white, soft charcoal instead of black, and dark sets
   that sit in muted greys rather than near-black. Every text pair clears WCAG AA

:root{
  /* Chart hues are NOT the UI accent: the accent fails the chroma floor at mark
     size. These three passed the validator (lightness band, chroma, CVD
     separation, contrast) on every palette surface, light and dark. */
  --ch1:#0f8a77; --ch2:#c2770d; --ch3:#4450c8;
  --ch1-fill:rgba(15,138,119,.14);
  --chart-empty:#e4e8ec; --grid:#e8ecf0;
  --heat1:#bfe0d9; --heat2:#7cc3b5; --heat3:#3fa08e; --heat4:#0f8a77;
}
@media (prefers-color-scheme:dark){
  :root:not([data-scheme]){
    --ch1:#2aa894; --ch2:#bf8428; --ch3:#7b86e8;
    --ch1-fill:rgba(42,168,148,.16);
    --chart-empty:#232c36; --grid:#242d37;
    --heat1:#17433b; --heat2:#1d6a5c; --heat3:#23907c; --heat4:#2aa894;
  }
}
:root[data-scheme="dark"]{
  --ch1:#2aa894; --ch2:#bf8428; --ch3:#7b86e8;
  --ch1-fill:rgba(42,168,148,.16);
  --chart-empty:#232c36; --grid:#242d37;
  --heat1:#17433b; --heat2:#1d6a5c; --heat3:#23907c; --heat4:#2aa894;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#shell{display:grid;grid-template-columns:272px 1fr;height:100%}
#rail{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
#railHead{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.brand{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0}
.brand-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
  margin-top:3px;font-weight:500}
#railPinned{padding:8px 8px 0;flex:none}
#railScroll{overflow-y:auto;flex:1;padding:4px 8px 20px;min-height:0}
#railScroll::-webkit-scrollbar{width:8px}
#railScroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.rail-div{height:1px;background:var(--border);margin:8px 2px 0}

/* row action icons */
.iact{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid transparent;
  background:none;display:flex;align-items:center;justify-content:center;padding:0;
  color:var(--ink-3);line-height:1}
.iact:hover{border-color:var(--border);color:var(--ink);background:var(--surface)}
.iact[aria-pressed="true"]{color:var(--accent2);border-color:var(--accent2-line);background:var(--accent2-soft)}
.iact.rep[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);
  background:var(--accent-soft)}
.iact svg{width:14px;height:14px}

/* tags */
.chip{font-size:10.5px;padding:1.5px 7px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-3);color:var(--ink-2);white-space:nowrap;cursor:pointer;
  font-family:var(--sans);line-height:1.5}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.mod{background:var(--accent-soft);color:var(--accent-ink);
  border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip .x{margin-left:5px;opacity:.6;font-weight:700;background:none;border:0;
  color:inherit;font-size:12px;cursor:pointer;padding:0 1px;line-height:1}
.chip .x:hover{opacity:1;color:var(--red)}
.chip-wrap{display:inline-flex;align-items:stretch;border-radius:999px;overflow:hidden;
  border:1px solid var(--border);background:var(--surface-3)}
.chip-wrap.mod{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip-wrap.on{background:var(--accent);border-color:var(--accent)}
.chip.co{background:var(--accent2-soft);color:var(--accent2);border-color:var(--accent2-line)}
.chip-wrap.co{background:var(--accent2-soft);border-color:var(--accent2-line)}
.chip.co.on,.chip-wrap.co.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip-wrap .chip{border:0;border-radius:0;background:none}
.chip-wrap .chip:hover{background:rgba(125,137,151,.14)}
.chipx{border:0;background:none;color:var(--ink-3);font-size:13px;line-height:1;
  padding:0 7px 0 2px;cursor:pointer;font-weight:600}
.chipx:hover{color:var(--red);background:var(--red-soft)}
.chip-wrap.on .chipx{color:inherit;opacity:.75}
.chip-wrap.on .chipx:hover{opacity:1;background:rgba(0,0,0,.18)}
.chipx[data-armed="1"]{color:var(--red);background:var(--red-soft)}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;
  padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.tagbar-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-right:2px}
.tag-add{display:flex;gap:6px;align-items:center;margin-top:8px}
.tag-add input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:5px 9px;font:inherit;font-size:12.5px;color:var(--ink)}
.tag-add input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.res-topic{font-family:var(--display);font-size:15px;font-weight:600;margin:18px 0 8px}

/* analytics */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px;margin-bottom:20px}
.kpi.small{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;display:flex;flex-direction:column;gap:2px}
.tile-v{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums}
.tile.hero{border-color:var(--ch1);background:var(--surface)}
.tile.hero .tile-v{font-size:40px;color:var(--ch1)}
.tile-l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin-top:3px}
.tile-s{font-size:11.5px;color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:14px;overflow:hidden}
.panel h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 2px}
.panel-sub{font-size:12px;color:var(--ink-3);margin:0 0 14px}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel-grid .panel{margin-bottom:0}
.chart-legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;
  font-size:11.5px;color:var(--ink-3)}
.chart-legend b{font-family:var(--mono);color:var(--ink-2)}
.chart-legend .key{width:11px;height:11px;border-radius:3px;display:inline-block;
  vertical-align:middle;margin-right:4px}
.chart-empty{font-size:12.5px;color:var(--ink-3);font-style:italic;padding:18px 0}
#chartTip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);
  color:var(--bg);border-radius:var(--radius-sm);padding:7px 10px;box-shadow:var(--shadow);
  min-width:78px;max-width:240px}
#chartTip[hidden]{display:none!important}
.tip-v{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.2;
  font-variant-numeric:tabular-nums}
.tip-l{font-size:11.5px;opacity:.85;margin-top:1px}
.tip-s{font-size:11px;opacity:.65;margin-top:2px}
.hit{cursor:default}
.cell:hover,.cell:focus{stroke:var(--ink-2);stroke-width:1.5;outline:none}
.col-hit:hover + *,.col-hit:focus{outline:none}
.col-hit:hover,.col-hit:focus{fill:color-mix(in srgb,var(--ink-3) 10%,transparent);outline:none}
.seg.hit:hover,.seg.hit:focus{filter:brightness(1.12);outline:none}
.mod-track.hit:hover > i{filter:brightness(1.1)}
svg .hit:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.note-banner{background:var(--accent2-soft);border:1px solid var(--accent2-line);
  color:var(--ink-2);border-radius:var(--radius);padding:10px 14px;font-size:12.5px;
  margin-bottom:16px}
.stack-row{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.stack-label{width:96px;flex:none;font-size:12.5px;color:var(--ink-2)}
.stack{flex:1;min-width:0;height:13px;border-radius:4px;overflow:hidden;display:flex;
  background:var(--chart-empty);gap:2px}
.seg{display:block;height:100%}
.stack-n{width:64px;flex:none;text-align:right;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3)}
.scope-row{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.scope-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.est-table{display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.est-row{display:grid;grid-template-columns:1.2fr .7fr .7fr .7fr 1fr .7fr 1.3fr;gap:10px;
  align-items:center;padding:7px 8px;border-radius:var(--radius-sm);min-width:540px;font-size:13px}
.est-head{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.est-row.on{background:var(--accent-soft)}
.est-row .tnum{font-family:var(--mono);font-variant-numeric:tabular-nums}
.est-name{background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:600;cursor:pointer}
.est-name:hover{color:var(--accent)}
.est-days{font-weight:600;color:var(--ink)}
.est-date{color:var(--ink-2);font-size:12.5px}
.plan-in{width:78px;background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:4px 7px;font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.plan-in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.mod-bars{display:flex;flex-direction:column;gap:5px}
.mod-row{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  padding:4px 6px;border-radius:var(--radius-sm);text-align:left}
.mod-row:hover{background:var(--surface-2)}
.mod-name{width:140px;flex:none;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.mod-track{flex:1;min-width:0;height:9px;border-radius:4px;background:var(--chart-empty);
  overflow:hidden}
.mod-track > i{display:block;height:100%;background:var(--ch1);border-radius:4px}
.mod-n{width:62px;flex:none;text-align:right;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3)}
@media (max-width:620px){
  .stack-label{width:74px}.mod-name{width:98px}
  .tile.hero .tile-v{font-size:32px}
}
.res-topic:first-of-type{margin-top:0}
.rail-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:12px 8px 6px}
#account{margin-top:12px}
.gbtn{display:flex;align-items:center;gap:9px;width:100%;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:7px 11px;
  font-size:13px;font-weight:500;color:var(--ink)}
.gbtn:hover{background:var(--surface-2);border-color:var(--accent)}
.gbtn svg{flex:none}
.acct{display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;flex:none;background:var(--accent-soft);
  color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct-mid{flex:1;min-width:0}
.acct-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-sync{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.acct-sync .sdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.acct-sync.off .sdot{background:var(--ink-3)}
.acct-sync.err .sdot{background:var(--red)}
.linkbtn{background:none;border:0;padding:0;font-size:11px;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink)}
.acct-note{font-size:11px;color:var(--ink-3);line-height:1.45;margin-top:7px}
.merge-card{background:var(--surface);border:1px solid var(--accent2-line);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.merge-card h3{font-size:14px;font-weight:600;margin:0 0 5px}
.merge-card p{font-size:12.5px;color:var(--ink-2);margin:0 0 11px}

/* custom content */
.btn-add{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);border-radius:var(--radius-sm);
  padding:7px 13px;font-size:13px;font-weight:600}
.btn-add:hover{filter:brightness(1.08)}
/* destructive / rarely-used actions sit at the right edge, away from the thumb */
.topic-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
  justify-content:flex-end;align-items:center}
.topic-actions .left{margin-right:auto;font-size:12px;color:var(--ink-3)}
.danger-ghost:hover{border-color:var(--red);color:var(--red)}
.menu-wrap{position:relative;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:186px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:6px}
.menu[hidden]{display:none!important}
.menu-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:6px 8px 4px}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;
  padding:7px 8px;border-radius:var(--radius-sm);text-align:left;font-size:13px}
.menu-item:hover{background:var(--surface-3)}
.menu-item[aria-checked="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.sw{display:inline-flex;flex:none;border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.sw i{display:block;width:11px;height:16px}

/* one bar, two zones: left = concepts, right = problems, each with its own fill */
.bar.dual,.nav-bar.dual{display:flex;gap:3px;background:none;overflow:visible}
.zone{height:100%;border-radius:3px;overflow:hidden;min-width:2px}
.zone.zc{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.zone.zp{background:color-mix(in srgb,var(--accent2) 20%,transparent)}
.zone > i{display:block;height:100%;transition:width .35s}
.zone.zc > i{background:var(--accent)}
.zone.zp > i{background:var(--accent2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:7px}
.legend b{font-family:var(--mono);font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend .sq{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;
  vertical-align:middle}
.legend .sq.c{background:var(--accent)} .legend .sq.p{background:var(--accent2)}
.tag.custom{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);
  background:var(--accent-soft)}
#modalBack{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:120;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px}
#modalBack[hidden]{display:none!important}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);
  box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:440px;max-height:86vh;
  overflow-y:auto;padding:20px}
.modal h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 4px}
.modal .modal-sub{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;
  font-size:13.5px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);
  outline-offset:-1px;border-color:transparent}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1;min-width:0}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal-foot .spacer{flex:1}
.err-msg{color:var(--red);font-size:12px;margin-top:8px;min-height:15px}
.nav-item{display:block;width:100%;text-align:left;background:none;border:0;
  padding:7px 9px;border-radius:var(--radius-sm);margin-bottom:1px}
.nav-item:hover{background:var(--surface-3)}
.nav-item.active{background:var(--accent-soft)}
.nav-item.active .nav-title{color:var(--accent-ink);font-weight:600}
.nav-row{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.nav-title{font-size:13.5px;font-weight:500}
.nav-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.nav-bar{height:3px;border-radius:2px;background:var(--surface-3);margin-top:5px;overflow:hidden;display:flex}
.nav-bar > i{display:block;height:100%;background:var(--accent2)}
.nav-bar > i.c{background:var(--accent)}

#main{overflow-y:auto;min-height:0}
.wrap{max-width:920px;margin:0 auto;padding:26px 20px 72px}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)}
.topbar-in{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:9px}
#menuBtn{display:none}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 10px;font-size:13px;color:var(--ink-2);line-height:1.2}
.icon-btn:hover{border-color:var(--border-strong);color:var(--ink)}
#search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 11px;font:inherit;font-size:13.5px;color:var(--ink)}
#search::placeholder{color:var(--ink-3)}
#search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:6px 10px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

h1.page-title{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;
  margin:0 0 4px;text-wrap:balance}
.page-sub{color:var(--ink-2);font-size:13.5px;margin:0 0 20px}

.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;margin-bottom:22px;display:flex;gap:26px;
  align-items:center;flex-wrap:wrap}
.ring-wrap{position:relative;width:118px;height:118px;flex:none}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:var(--mono);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring-cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin-top:4px;font-weight:600}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;flex:1;min-width:200px}
.stat-k{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  line-height:1.1;display:block}
.stat-k small{color:var(--ink-3);font-size:15px;font-weight:500}
.stat-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 15px;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.tcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tcard-name{font-weight:600;font-size:14.5px}
.tcard-n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:11px;display:flex}
.bar > i{display:block;height:100%;background:var(--accent2);transition:width .35s}
.bar > i.c{background:var(--accent)}
.tcard-meta{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:2px;vertical-align:middle;margin-right:4px}
.dot.c{background:var(--accent)} .dot.p{background:var(--accent2)}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--surface-3);padding:3px;border-radius:9px;
  margin:0 0 18px;width:fit-content;max-width:100%}
.tabs button{background:none;border:0;padding:7px 15px;border-radius:var(--radius-sm);font-size:13.5px;
  font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .tab-n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px;
  font-variant-numeric:tabular-nums}

.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:11px;overflow:hidden}
.sec-head{width:100%;display:flex;align-items:center;gap:11px;padding:12px 15px;
  background:none;border:0;text-align:left}
.sec-head:hover{background:var(--surface-2)}
.chev{color:var(--ink-3);transition:transform .18s;flex:none;display:flex}
.section.open .chev{transform:rotate(90deg)}
.sec-title{font-weight:600;font-size:14px;flex:1;min-width:0}
.sec-count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-bar{width:58px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.sec-bar > i{display:block;height:100%;background:var(--accent2);border-radius:3px;transition:width .3s}
.sec-bar.done > i{background:var(--accent)}
.sec-body{border-top:1px solid var(--border)}
.section:not(.open) .sec-body{display:none}

/* concept card */
.concept-body{padding:14px 18px 18px}
.part{border-top:1px solid var(--border)}
.part-head{display:flex;align-items:center;gap:10px;padding:9px 18px}
.part-head:hover{background:var(--surface-2)}
.part.is-done .part-title{color:var(--ink-3);text-decoration:line-through;
  text-decoration-color:var(--ink-3)}
.part-title{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;
  font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink)}
.part-title:hover{color:var(--accent)}
.part-body{padding:2px 18px 16px;background:var(--surface-2)}
.part-chev{color:var(--ink-3);display:flex;flex:none;width:19px;justify-content:center;
  transition:transform .18s}
.part-chev.open{transform:rotate(90deg)}
.part[data-depth="1"] .part-head{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
@media (max-width:860px){.part-body{padding-left:18px!important}}
.concept-sub{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.subchip{font-size:11px;color:var(--ink-3);background:var(--surface-3);
  border-radius:5px;padding:2.5px 8px;border:1px solid var(--border)}
.concept-foot{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:13px;
  border-top:1px solid var(--border);flex-wrap:wrap}

.row{display:flex;align-items:flex-start;gap:11px;padding:9px 15px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.is-done .row-title{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.tick{flex:none;width:19px;height:19px;margin-top:2px;border-radius:5px;
  border:1.5px solid var(--border-strong);background:var(--surface);
  display:flex;align-items:center;justify-content:center;padding:0}
.tick:hover{border-color:var(--accent)}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tick svg{opacity:0;width:11px;height:11px;color:var(--surface)}
.tick[aria-pressed="true"] svg{opacity:1}
.row-mid{flex:1;min-width:0}
.row-title{font-size:13.5px;line-height:1.45;overflow-wrap:break-word}
.row-hint{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.row-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:1.5px 6px;
  border-radius:4px;border:1px solid var(--border);color:var(--ink-3);white-space:nowrap}
a.tag{text-decoration:none}
.tag.lc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.tag.lc.dim{background:none;color:var(--ink-3);border-color:var(--border)}
.tag.tuf{color:var(--accent2);border-color:var(--accent2-line);background:var(--accent2-soft)}
.tag.gfg{color:var(--basic);border-color:color-mix(in srgb,var(--basic) 40%,transparent);
  background:color-mix(in srgb,var(--basic) 12%,transparent)}
button.tag{font-family:var(--mono);cursor:pointer}
.lookup-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.lookup-row a{font-size:12px;text-decoration:none;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:5px 10px;color:var(--ink-2);background:var(--surface-2)}
.lookup-row a:hover{border-color:var(--accent);color:var(--accent)}
.tag.src-a2z{color:var(--accent2);border-color:var(--accent2-line);background:var(--accent2-soft)}
.tag.t-basic{color:var(--basic);border-color:color-mix(in srgb,var(--basic) 40%,transparent)}
.tag.t-core{color:var(--core);border-color:color-mix(in srgb,var(--core) 40%,transparent)}
.tag.t-pro{color:var(--pro);border-color:color-mix(in srgb,var(--pro) 40%,transparent)}
.tag.prem{color:var(--pro);border-style:dashed;border-color:color-mix(in srgb,var(--pro) 45%,transparent)}
.tag.src-sheet{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.tag.has-note{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.row-actions{display:flex;gap:4px;flex:none;align-items:center}
.mini{background:none;border:1px solid transparent;border-radius:6px;padding:3px 7px;
  font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.mini:hover{border-color:var(--border);color:var(--ink)}
.mini[aria-expanded="true"]{background:var(--surface-3);color:var(--ink);border-color:var(--border)}
.detail{padding:4px 15px 16px 45px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.detail h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:12px 0 7px;font-weight:600}
.note-area{width:100%;min-height:88px;resize:vertical;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;
  font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--ink)}
.note-area:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.note-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
  font-size:11px;color:var(--ink-3);min-height:16px;gap:10px}

/* markdown */
.md{font-size:13.5px;line-height:1.68;color:var(--ink-2);overflow-wrap:break-word}
.md > :first-child{margin-top:0}
.md pre{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;overflow-x:auto;margin:12px 0}
.md code{font-family:var(--mono);font-size:12.2px}
.md pre code{font-size:12.2px;color:var(--ink);background:none;border:0;padding:0}
.md :not(pre) > code{background:var(--surface-3);border:1px solid var(--border);
  padding:.5px 4px;border-radius:4px;color:var(--ink)}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0;padding-left:22px}
.md li{margin:4px 0}
.md strong{color:var(--ink);font-weight:600}
.md table{border-collapse:collapse;margin:12px 0;font-size:12.3px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md th{background:var(--surface-3);font-weight:600;color:var(--ink)}
.md h1,.md h2{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);
  margin:20px 0 8px;letter-spacing:-.01em}
.md h3{font-family:var(--sans);font-size:14.5px;font-weight:600;color:var(--ink);margin:18px 0 7px;
  padding-top:12px;border-top:1px solid var(--border)}
.md h3:first-child{border-top:0;padding-top:0;margin-top:0}
.md h4,.md h5{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);margin:14px 0 6px}
.md blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:3px 0 3px 13px;color:var(--ink-3)}
.md hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.md a{color:var(--accent)}
.hljs-keyword,.hljs-built_in{color:var(--kw)}
.hljs-string{color:var(--str)}
.hljs-number{color:var(--num)}
.hljs-comment{color:var(--com);font-style:italic}
.hljs-title,.hljs-function .hljs-title{color:var(--accent);font-weight:600}
.hljs-params{color:var(--ink-2)}

.danger-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-top:22px}
.danger-card h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 4px}
.danger-card p{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;max-width:64ch}
.btn-danger{background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);
  color:var(--red);border-radius:var(--radius-sm);padding:7px 13px;font-size:13px;font-weight:600}
.btn-danger:hover{background:color-mix(in srgb,var(--red) 18%,var(--red-soft))}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);
  border-radius:var(--radius-sm);padding:7px 13px;font-size:13px;font-weight:500}
.btn-ghost:hover{border-color:var(--border-strong);color:var(--ink)}
.confirm-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow);
  z-index:100;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:46px 20px;color:var(--ink-3);font-size:13.5px}
.empty strong{color:var(--ink-2)}
#scrim{display:none}
#importFile{display:none}

@media (max-width:860px){
  #shell{grid-template-columns:1fr}
  #rail{position:fixed;inset:0 auto 0 0;width:272px;z-index:60;transform:translateX(-100%);
    transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  #rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #menuBtn{display:block}
  #scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
  .wrap{padding:18px 16px 64px}
  .topbar-in{padding:9px 16px;flex-wrap:wrap}
  #search{order:3;flex-basis:100%}
  h1.page-title{font-size:24px}
  .detail{padding-left:16px}
  .concept-body{padding:12px 14px 16px}
  .hero{gap:18px;padding:18px}
}
/* moving problems and sections */
.sec-headrow{display:flex;align-items:center}
.sec-headrow .sec-head{flex:1;min-width:0}
.sec-headrow .iact{margin-right:10px}
.tag.moved{color:var(--accent2);border-style:dashed;border-color:var(--accent2-line)}
.move-from{font-size:12px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:14px}
.move-from b{color:var(--ink-2);font-weight:600}

/* theme picker: palettes in a two-column grid */
#paletteMenu{min-width:300px}
.pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
@media (max-width:420px){#paletteMenu{min-width:240px}.pal-grid{grid-template-columns:1fr}}

/* quieter rows: on a pointer device the favourite / repeat / move icons appear on
   hover or focus. Anything switched on stays visible, and touch screens always
   show them. */
@media (hover:hover) and (pointer:fine){
  .row .iact:not([aria-pressed="true"]),.sec-headrow .iact{opacity:0;transition:opacity .12s}
  .row:hover .iact,.row:focus-within .iact,
  .sec-headrow:hover .iact,.sec-headrow:focus-within .iact{opacity:1}
}
.tcard:hover{box-shadow:var(--shadow)}

/* ---- editor dialog ---- */
.edit-sec{border-top:1px solid var(--border);padding-top:12px;margin-top:4px}
.edit-sec:first-of-type{border-top:0;padding-top:0}
.edit-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);
  font-weight:700;margin-bottom:9px}
.edit-sec .lookup-row{align-items:center}
.edit-sec .lookup-row .linkbtn{margin-left:auto;color:var(--red)}
#pNewGroup{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;font:inherit;font-size:13.5px;color:var(--ink)}
.modal{max-width:500px}

/* ---- theme menu: Colours / Layout tabs ---- */
.menu-tabs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--surface-3);
  border-radius:var(--radius-sm);padding:3px;margin:0 0 6px}
.menu-tabs button{background:none;border:0;border-radius:calc(var(--radius-sm) - 2px);padding:6px 8px;
  font-size:12.5px;font-weight:600;color:var(--ink-3)}
.menu-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lay-list{display:flex;flex-direction:column;gap:1px;max-height:min(70vh,480px);overflow-y:auto}
.lay-item{align-items:center}
.lay-txt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.lay-name{font-size:13px}
.lay-sub{font-size:11px;color:var(--ink-3);font-weight:400}
.menu-item[aria-checked="true"] .lay-sub{color:var(--accent-ink);opacity:.8}
.menu-foot{font-size:11px;color:var(--ink-3);padding:8px 8px 4px;border-top:1px solid var(--border);margin-top:6px}
/* tiny drawings of each layout */
.lay-ico{flex:none;width:40px;height:28px;border-radius:4px;border:1px solid var(--border-strong);
  background:var(--surface-2);position:relative;overflow:hidden}
.lay-ico i,.lay-ico b{position:absolute;display:block}
.lay-classic i{left:0;top:0;bottom:0;width:11px;background:var(--surface-3);border-right:1px solid var(--border-strong)}
.lay-classic b{left:15px;right:4px;top:6px;height:5px;background:var(--accent);border-radius:2px;opacity:.7}
.lay-modern i{left:3px;top:3px;bottom:3px;width:10px;background:var(--surface);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lay-modern b{left:16px;right:3px;top:3px;height:5px;background:var(--surface);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lay-sleek i{right:0;top:0;bottom:0;width:10px;border-left:1px solid var(--border-strong)}
.lay-sleek b{left:4px;right:14px;top:7px;height:1px;background:var(--ink-3);box-shadow:0 5px 0 var(--ink-3),0 10px 0 var(--ink-3)}
.lay-funky{border:2px solid var(--ink)}
.lay-funky i{left:6px;top:5px;width:14px;height:12px;border:2px solid var(--ink);background:var(--accent);transform:rotate(-8deg);box-shadow:2px 2px 0 var(--ink)}
.lay-funky b{left:22px;top:8px;width:12px;height:12px;border:2px solid var(--ink);background:var(--accent2);transform:rotate(7deg)}
.lay-poppy{border-radius:10px}
.lay-poppy i{left:4px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--accent);opacity:.75}
.lay-poppy b{right:4px;bottom:3px;width:17px;height:17px;border-radius:50%;background:var(--accent2);opacity:.6}
.lay-traditional{background:repeating-linear-gradient(var(--surface) 0 4px,var(--border-strong) 4px 5px)}
.lay-traditional i{left:7px;top:0;bottom:0;width:1px;background:var(--red)}
.lay-artistic i{left:4px;top:4px;font:italic 600 15px/1 var(--display);width:auto}
.lay-artistic i::before{content:"Aa";color:var(--ink)}
.lay-artistic b{right:4px;top:4px;width:12px;bottom:4px;border-top:2px solid var(--ink)}
.lay-retro{border-radius:0;border:2px solid;border-color:#fff var(--ink-3) var(--ink-3) #fff}
.lay-retro i{left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lay-retro b{right:2px;top:1px;width:5px;height:4px;background:var(--surface-2)}

.lay-zen i{left:12px;right:12px;top:6px;height:3px;background:var(--ink-3);border-radius:2px;opacity:.6}
.lay-zen b{left:9px;right:9px;top:13px;height:9px;background:var(--surface);border-radius:3px}
.lay-dock i{left:0;right:0;top:0;height:8px;background:var(--surface-3);border-bottom:1px solid var(--border-strong)}
.lay-dock b{left:4px;top:2.5px;width:7px;height:3px;background:var(--accent);border-radius:2px;
  box-shadow:10px 0 0 var(--ink-3),20px 0 0 var(--ink-3),30px 0 0 var(--ink-3)}
.lay-bento i{left:3px;top:3px;width:16px;height:20px;border-radius:3px;background:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.lay-bento b{left:21px;top:3px;width:15px;height:9px;border-radius:3px;background:color-mix(in srgb,var(--accent2) 55%,var(--surface));
  box-shadow:0 11px 0 color-mix(in srgb,var(--basic) 55%,var(--surface))}
.lay-glass{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 45%,var(--surface)),color-mix(in srgb,var(--accent2) 40%,var(--surface)))}
.lay-glass i{left:5px;top:5px;right:5px;bottom:5px;border-radius:4px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7)}
.lay-focus i{left:0;top:0;bottom:0;width:6px;background:var(--surface-3);border-right:1px solid var(--border-strong)}
.lay-focus b{left:12px;right:9px;top:6px;height:2px;background:var(--ink-3);box-shadow:0 5px 0 var(--ink-3),0 10px 0 var(--ink-3),0 15px 0 var(--ink-3)}
.lay-cloud{background:var(--surface-2);border-color:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.lay-cloud i{left:5px;top:6px;width:14px;height:15px;border-radius:4px;background:var(--surface-2);
  box-shadow:2px 2px 4px rgba(0,0,0,.2),-2px -2px 4px rgba(255,255,255,.7)}
.lay-cloud b{left:23px;top:6px;width:12px;height:15px;border-radius:4px;
  box-shadow:inset 2px 2px 3px rgba(0,0,0,.2),inset -2px -2px 3px rgba(255,255,255,.7)}
.lay-timeline i{left:8px;top:3px;bottom:3px;width:2px;background:var(--border-strong)}
.lay-timeline b{left:6px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 8px 0 var(--accent),0 16px 0 var(--accent),12px 0 0 -1px var(--ink-3),20px 0 0 -1px var(--ink-3),12px 8px 0 -1px var(--ink-3),20px 16px 0 -1px var(--ink-3)}
/* palette menu: two groups, scrolls on short screens */
#paletteMenu{max-height:min(80vh,640px);overflow-y:auto}
.pal-group{margin-top:2px}
.pal-group + .pal-group{margin-top:6px}
/* ---- motion shared by the layouts ---- */
@keyframes pl-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pl-fade{from{opacity:0}to{opacity:1}}
@keyframes pl-slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pl-reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pl-pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pl-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(10deg)}}
@keyframes pl-bounce{0%{opacity:0;transform:scale(.8) rotate(var(--rot,0deg))}
  60%{opacity:1;transform:scale(1.05) rotate(calc(var(--rot,0deg) * -1))}
  100%{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}}
@keyframes pl-stripes{to{background-position:34px 0}}
@keyframes pl-float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.08)}}
@keyframes pl-blink{50%{opacity:0}}
@keyframes pl-boot{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0)}}
#view.enter > *:nth-child(2){animation-delay:.04s} #view.enter > *:nth-child(3){animation-delay:.08s}
#view.enter > *:nth-child(4){animation-delay:.12s} #view.enter > *:nth-child(5){animation-delay:.16s}
#view.enter > *:nth-child(6){animation-delay:.2s}  #view.enter > *:nth-child(n+7){animation-delay:.24s}
#view.enter .tcard:nth-child(2){animation-delay:.03s} #view.enter .tcard:nth-child(3){animation-delay:.06s}
#view.enter .tcard:nth-child(4){animation-delay:.09s} #view.enter .tcard:nth-child(5){animation-delay:.12s}
#view.enter .tcard:nth-child(6){animation-delay:.15s} #view.enter .tcard:nth-child(n+7){animation-delay:.18s}

/* =========================================================================
   View 2 - Modern: floating panels, generous radius, soft lift and rise-in
   ========================================================================= */
:root[data-layout="modern"]{--radius:16px}
@media (min-width:861px){
  [data-layout="modern"] #rail{margin:14px 0 14px 14px;height:calc(100% - 28px);border:1px solid var(--border);
    border-radius:calc(var(--radius) + 6px);box-shadow:var(--shadow);overflow:hidden}
  [data-layout="modern"] #topbar{margin:12px 22px 0;top:12px;border:1px solid var(--border);border-radius:999px;
    box-shadow:var(--shadow)}
  [data-layout="modern"] .topbar-in{padding:8px 10px 8px 14px}
  [data-layout="modern"] #search{border-radius:999px}
}
[data-layout="modern"] .section,[data-layout="modern"] .tcard,[data-layout="modern"] .hero,
[data-layout="modern"] .panel,[data-layout="modern"] .tagbar,[data-layout="modern"] .danger-card{
  border-color:transparent;box-shadow:var(--shadow)}
[data-layout="modern"] .tcard{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
[data-layout="modern"] .tcard:hover{transform:translateY(-4px);border-color:transparent;
  box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 18%,transparent)}
[data-layout="modern"] .nav-item{border-radius:12px;transition:background .15s,transform .15s}
[data-layout="modern"] .nav-item:hover{transform:translateX(3px)}
[data-layout="modern"] .tabs{border-radius:999px}
[data-layout="modern"] .tabs button{border-radius:999px}
[data-layout="modern"] .row{transition:background .15s}
[data-layout="modern"] h1.page-title{font-weight:700;letter-spacing:-.03em}
[data-layout="modern"] #view.enter > *{animation:pl-rise .5s cubic-bezier(.2,.7,.2,1) both}
[data-layout="modern"] .tick.just{animation:pl-pop .35s ease}

/* =========================================================================
   View 3 - Sleek: flat, hairlines, dense rows, index on the right
   ========================================================================= */
:root[data-layout="sleek"]{--radius:4px}
@media (min-width:861px){
  [data-layout="sleek"] #shell{grid-template-columns:1fr 250px}
  [data-layout="sleek"] #rail{order:2;border-right:0;border-left:1px solid var(--border);background:var(--bg)}
  [data-layout="sleek"] #main{order:1}
}
[data-layout="sleek"] body{font-size:13.5px}
[data-layout="sleek"] .brand{font-family:var(--sans);font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
[data-layout="sleek"] h1.page-title{font-family:var(--sans);font-size:24px;font-weight:600;letter-spacing:-.015em}
[data-layout="sleek"] .section,[data-layout="sleek"] .hero,[data-layout="sleek"] .panel,
[data-layout="sleek"] .tagbar,[data-layout="sleek"] .danger-card{background:transparent;border:0;
  border-top:1px solid var(--border);border-radius:0;box-shadow:none;margin-bottom:0}
[data-layout="sleek"] .hero{padding:18px 0}
[data-layout="sleek"] .grid{gap:0;border-top:1px solid var(--border)}
[data-layout="sleek"] .tcard{background:transparent;border:0;border-bottom:1px solid var(--border);
  border-radius:0;padding:13px 10px}
[data-layout="sleek"] .tcard:hover{transform:none;background:var(--surface)}
[data-layout="sleek"] .tcard-name,[data-layout="sleek"] .sec-title{font-weight:500}
[data-layout="sleek"] .sec-head{padding:10px 4px}
[data-layout="sleek"] .sec-body{border-top:0}
[data-layout="sleek"] .row{padding:6px 4px 6px 30px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
[data-layout="sleek"] .row:hover,[data-layout="sleek"] .sec-head:hover{background:var(--surface)}
[data-layout="sleek"] .tabs{background:none;padding:0;border-radius:0;width:100%;border-bottom:1px solid var(--border)}

    save:function(id,rec){var m=readKey(LS_KEY,{});m[id]=rec;

/* ---- GitHub Gist sync: progress stored as a secret gist in your own account ----
   No third-party service, no account to create, nothing that expires or pauses.
   You paste a token scoped to gists only; it is kept in this browser's
   localStorage and sent to api.github.com and nowhere else. */
var GH={token:null,gistId:null,user:null};
var GH_TOKEN_KEY="pattern-ledger-gh-token", GH_GIST_KEY="pattern-ledger-gist-id";
var GIST_FILE="pattern-ledger.json";
var GIST_DESC="Pattern Ledger \u2014 DSA study progress";
var GH_TOKEN_URL="https://github.com/settings/tokens/new?scopes=gist&description=Pattern%20Ledger";

function ghGistKey(){
  // one remembered gist per GitHub account, so two people sharing a browser
  // never inherit each other's gist id
  return GH_GIST_KEY+":"+((GH.user&&GH.user.login)||"_");
}
function ghReadCreds(){
  try{ GH.token=localStorage.getItem(GH_TOKEN_KEY)||null; }
  catch(e){ /* private window or blocked storage: stay disconnected */ }
}
function ghReadGistId(){
  try{ GH.gistId=localStorage.getItem(ghGistKey())||null; }
  catch(e){ GH.gistId=null; }
}
function ghWriteCreds(){
  try{
    if(GH.token)localStorage.setItem(GH_TOKEN_KEY,GH.token);
    else localStorage.removeItem(GH_TOKEN_KEY);
    if(GH.user){
      if(GH.gistId)localStorage.setItem(ghGistKey(),GH.gistId);
      else localStorage.removeItem(ghGistKey());
      localStorage.setItem(GH_USER_KEY,JSON.stringify(GH.user));
    }
  }catch(e){ /* nothing we can do; the session still works in memory */ }
}
function ghApi(path,opts){
  opts=opts||{};
  var headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(GH.token)headers.Authorization="Bearer "+GH.token;
  if(opts.body)headers["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,{
    method:opts.method||"GET",
    headers:headers,
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    if(r.status===401)return Promise.reject({code:"bad_token"});
    if(r.status===403||r.status===429)return Promise.reject({code:"rate_limited"});
    if(r.status===404)return Promise.reject({code:"not_found"});
    if(!r.ok)return Promise.reject({code:"http_"+r.status});
    return r.status===204?null:r.json();
  },function(){
    return Promise.reject({code:"offline"});
  });
}
function ghPayload(){
  return {app:"pattern-ledger",version:2,updatedAt:new Date().toISOString(),

}
function ghFiles(obj){
  var f={}; f[GIST_FILE]={content:JSON.stringify(obj,null,1)};

function ghParse(text){
  var out={state:{},custom:emptyCustom()};

      if(j.state&&typeof j.state==="object")out.state=j.state;
      if(j.custom&&typeof j.custom==="object"){
        out.custom={topics:j.custom.topics||[],groups:j.custom.groups||[],
                    items:j.custom.items||[]};

  return out;
}
/* Find the app's gist, or make one. Never touches any other gist. */
function ghFindOrCreateGist(allowRetry){
  if(GH.gistId){
    return ghApi("/gists/"+GH.gistId).then(function(g){
      // A secret gist is readable by anyone holding its id, so a stored id is not
      // proof of ownership. Without this check a second person on the same browser
      // could read the first person's gist and then fail every write to it.
      var owner=g&&g.owner&&g.owner.login;
      if(!owner||!GH.user||owner!==GH.user.login){
        GH.gistId=null;
        return ghFindOrCreateGist(false);
      }
      return g;
    },function(e){
      if(e&&e.code==="not_found"&&allowRetry!==false){
        GH.gistId=null;            // deleted on github.com: fall through and make a new one
        return ghFindOrCreateGist(false);
      }
      return Promise.reject(e);
    });
  }
  return ghApi("/gists?per_page=100").then(function(list){
    for(var i=0;i<list.length;i++){
      var g=list[i], own=g.owner&&g.owner.login===GH.user.login;
      if(own&&g.files&&g.files[GIST_FILE]){GH.gistId=g.id;return g;}
    }
    return ghApi("/gists",{method:"POST",body:{
      description:GIST_DESC,"public":false,files:ghFiles(ghPayload())}})
      .then(function(g){GH.gistId=g.id;return g;});
  });
}
function ghConnect(token){
  GH.token=(token||"").trim();
  if(!GH.token)return Promise.reject({code:"bad_token"});
  return ghApi("/user").then(function(u){
    GH.user={login:u.login,name:u.name||u.login,avatar:u.avatar_url};
    ghReadGistId();                 // whichever gist THIS account used here before
    return ghFindOrCreateGist(true);
  }).then(function(){
    ghWriteCreds();
    return true;
  });
}
function ghDisconnect(){
  GH.gistId=null;
  ghWriteCreds();                   // drops this account's remembered gist id
  GH.token=null; GH.user=null;
  try{localStorage.removeItem(GH_TOKEN_KEY);localStorage.removeItem(GH_USER_KEY);}catch(e){ /* storage blocked */ }
  store=localStore();
  Promise.all([store.load(),store.loadCustom()]).then(function(r){
    STATE=r[0]||{}; CUSTOM=r[1]||emptyCustom();
    rebuildData(); render();

}
function ghErrText(e){
  var c=e&&e.code;
  if(c==="bad_token")return "GitHub rejected that token. Check it has the gist scope and has not expired.";
  if(c==="rate_limited")return "GitHub is rate-limiting this token. Try again shortly.";
  if(c==="offline")return "Could not reach api.github.com.";
  if(c==="not_found")return "That gist no longer exists.";
  return "GitHub error"+(c?(" ("+c+")"):"")+".";

/* One gist file holds progress and custom modules, so both reads share one request. */
/* ---- offline-first: a copy of the gist on this device ----
   Every gist save writes here first. Offline, reads come from here and edits
   wait here (dirty) until the network is back, then merge into the gist. */
var GH_USER_KEY="pattern-ledger-gh-user";
function mirrorKey(){ return "pattern-ledger-mirror-v1:"+((GH.user&&GH.user.login)||"_"); }
function mirrorRead(){
  try{ var r=localStorage.getItem(mirrorKey()); return r?JSON.parse(r):null; }
  catch(e){ return null; }
}
function mirrorWrite(state,custom,dirty){
  try{
    localStorage.setItem(mirrorKey(),JSON.stringify({state:state,custom:custom,
      dirty:!!dirty,savedAt:Date.now()}));
    return true;
  }catch(e){ return false; }  // quota or blocked: the gist copy is still the record
}
function ghCachedUser(){
  try{ var r=localStorage.getItem(GH_USER_KEY); return r?JSON.parse(r):null; }catch(e){ return null; }
}
/* Item by item, the side edited most recently wins. Ties go to `local`. */
function mergeStates(remote,local){
  var out={}, k;
  remote=remote||{}; local=local||{};
  for(k in remote)if(Object.prototype.hasOwnProperty.call(remote,k))out[k]=remote[k];
  for(k in local)if(Object.prototype.hasOwnProperty.call(local,k)){
    var r=out[k], l=local[k];
    if(!r||(+l.t||0)>=(+r.t||0))out[k]=l;

}
/* Custom modules/sections/problems: union by id, the local copy wins a clash. */
function mergeCustom(remote,local){
  remote=remote||emptyCustom(); local=local||emptyCustom();
  function u(a,b){
    var byId={}, order=[];
    (a||[]).forEach(function(x){ if(x&&x.id){ if(!byId[x.id])order.push(x.id); byId[x.id]=x; } });
    (b||[]).forEach(function(x){ if(x&&x.id){ if(!byId[x.id])order.push(x.id); byId[x.id]=x; } });
    return order.map(function(id){return byId[id];});
  }
  return {topics:u(remote.topics,local.topics),groups:u(remote.groups,local.groups),
          items:u(remote.items,local.items),moves:u(remote.moves,local.moves),
          secMoves:u(remote.secMoves,local.secMoves)};
}
function isOffline(){ return typeof navigator!=="undefined"&&navigator.onLine===false; }

function gistStore(){
  var fetchP=null, saveTimer=null, self;
  function readRemote(){
    return ghApi("/gists/"+GH.gistId).then(function(g){
      var f=g.files&&g.files[GIST_FILE];
      if(!f)return {state:{},custom:emptyCustom()};
      if(f.truncated&&f.raw_url){
        return fetch(f.raw_url).then(function(r){return r.text();}).then(ghParse);
      }
      return ghParse(f.content||"");
    });
  }
  // An unreachable or failing GitHub is not a reason to show you nothing.
  function fallsBack(e){ return !(e&&(e.code==="bad_token"||e.code==="not_found")); }
  function fetchAll(){
    if(!fetchP){
      var mir=mirrorRead();
      fetchP=readRemote().then(function(remote){
        self.offline=false;
        if(mir&&mir.dirty){
          // edits left over from an offline session: fold them in, push after load
          self.pendingPush=true;
          return {state:mergeStates(remote.state,mir.state),
                  custom:mergeCustom(remote.custom,mir.custom)};
        }
        mirrorWrite(remote.state,remote.custom,false);
        return remote;
      },function(e){
        if(mir&&fallsBack(e)){ self.offline=true; return {state:mir.state||{},custom:mir.custom||emptyCustom()}; }
        return Promise.reject(e);
      });
    }
    return fetchP;
  }
  function markOffline(){
    if(!self.offline)toast("Offline \u2014 changes are saved on this device and will sync when you are back online.");
    self.offline=true;
    renderAccount();
  }
  function flush(){
    fetchP=null;                       // our own write is now the truth; drop the cached read
    mirrorWrite(STATE,CUSTOM,true);    // on this device first, always
    if(isOffline()){ markOffline(); return Promise.resolve(true); }
    return ghApi("/gists/"+GH.gistId,{method:"PATCH",body:{files:ghFiles(ghPayload())}})
      .then(function(){
        mirrorWrite(STATE,CUSTOM,false);
        if(self.offline){ self.offline=false; renderAccount(); }
        return true;
      },function(e){
        if(fallsBack(e)){ markOffline(); return true; }   // kept locally, retried on reconnect
        return false;
      });
  }
  /* Back online: merge what changed elsewhere with what you did here, then push. */
  function sync(){
    var mir=mirrorRead();
    if(!mir||!mir.dirty){ if(self.offline){self.offline=false;renderAccount();} return Promise.resolve(false); }
    return readRemote().then(function(remote){
      STATE=mergeStates(remote.state,STATE);
      CUSTOM=mergeCustom(remote.custom,CUSTOM);
      rebuildData(); render();
      return flush().then(function(ok){
        if(ok&&!self.offline)toast("Back online \u2014 your offline changes are synced.");
        return ok;
      });
    },function(){ return false; });
  }
  function schedule(){
    clearTimeout(saveTimer);
    return new Promise(function(res){
      saveTimer=setTimeout(function(){flush().then(res);},1200);
    });
  }
  self={
    kind:"gist",
    offline:false,
    pendingPush:false,
    sync:sync,
    label:(GH.user&&GH.user.login)||"gist",
    load:function(){return fetchAll().then(function(p){return p.state;});},
    loadCustom:function(){return fetchAll().then(function(p){return p.custom;});},
    save:function(){return schedule();},
    bulk:function(){return flush();},
    saveCustom:function(){return flush();},
    watch:function(){}
  };
  return self;
}

function dbStore(db){
  return {
    kind:"db",
    load:function(){
      return db.collection("items").get().then(function(s){
        var m={};s.docs.forEach(function(d){var v=d.data()||{};
          m[d.id]={done:!!v.done,note:typeof v.note==="string"?v.note:"",
                   fav:!!v.fav,repeat:!!v.repeat,
                   tags:Array.isArray(v.tags)?v.tags:[],
                   link:v.link||"",linkKind:v.linkKind||"",
                   doneAt:v.doneAt||"",firstDoneAt:v.firstDoneAt||""};});
        return m;});
    },
    save:function(id,rec){
      return db.collection("items").doc(id)
        .set({done:!!rec.done,note:rec.note||"",fav:!!rec.fav,repeat:!!rec.repeat,
              tags:rec.tags||[],link:rec.link||"",linkKind:rec.linkKind||"",
              doneAt:rec.doneAt||"",firstDoneAt:rec.firstDoneAt||"",
              updatedAt:Date.now()})
        .then(function(){return true;}).catch(function(){return false;});
    },
    bulk:function(map){
      var ids=Object.keys(map), i=0;
      return new Promise(function(res){
        (function step(){
          if(i>=ids.length)return res(true);
          var id=ids[i++];
          db.collection("items").doc(id)
            .set({done:!!map[id].done,note:map[id].note||"",fav:!!map[id].fav,
                  repeat:!!map[id].repeat,tags:map[id].tags||[],
                  link:map[id].link||"",linkKind:map[id].linkKind||"",
                  doneAt:map[id].doneAt||"",firstDoneAt:map[id].firstDoneAt||"",
                  updatedAt:Date.now()})
            .catch(function(){}).then(step);
        })();
      });
    },
    loadCustom:function(){
      return db.collection("meta").doc("custom").get().then(function(d){
        if(!d.exists)return emptyCustom();
        var v=d.data()||{};
        return {topics:v.topics||[],groups:v.groups||[],items:v.items||[]};
      },function(){return emptyCustom();});
    },
    saveCustom:function(c){
      return db.collection("meta").doc("custom")
        .set({topics:c.topics,groups:c.groups,items:c.items,updatedAt:Date.now()})
        .then(function(){return true;},function(){return false;});
    },
    watch:function(){}
  };
}

/* ---------- custom modules and problems ----------
   BASE is the generated curriculum (rebuilt from notes/*.md by tools/build_site.py,
   so anything written into it by hand is lost on the next build). Everything the
   viewer adds lives in CUSTOM, which is stored in whichever database is active,
   and is folded into BASE at load time to produce DATA. */
function newId(prefix){
  return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
}
function rebuildData(){
  var byTopic={}, topics=[];
  BASE.topics.forEach(function(t){
    var copy={id:t.id,title:t.title,concepts:t.concepts,
      problems:t.problems.map(function(g){
        return {id:g.id,title:g.title,source:g.source,items:g.items.slice()};
      })};
    byTopic[t.id]=copy; topics.push(copy);
  });
  CUSTOM.topics.forEach(function(ct){
    if(byTopic[ct.id])return;
    var copy={id:ct.id,title:ct.title,concepts:[],problems:[],custom:true};
    byTopic[ct.id]=copy; topics.push(copy);
  });
  var byGroup={}, groupTopic={};
  topics.forEach(function(t){t.problems.forEach(function(g){byGroup[g.id]=g;groupTopic[g.id]=t;});});
  CUSTOM.groups.forEach(function(cg){
    if(byGroup[cg.id])return;
    var t=byTopic[cg.topicId]; if(!t)return;
    var g={id:cg.id,title:cg.title,source:"custom",custom:true,topicId:cg.topicId,items:[]};
    byGroup[cg.id]=g; groupTopic[cg.id]=t; t.problems.push(g);
  });
  CUSTOM.items.forEach(function(ci){
    var g=byGroup[ci.groupId];
    if(!g){
      var t=byTopic[ci.topicId]; if(!t)return;
      var fid="custom-"+ci.topicId;
      g=byGroup[fid];
      if(!g){
        g={id:fid,title:"My problems",source:"custom",custom:true,topicId:ci.topicId,items:[]};
        byGroup[fid]=g; groupTopic[fid]=t; t.problems.push(g);
      }
    }
    g.items.push(ci);
  });
  applyMoves(byTopic,byGroup,groupTopic);
  DATA={topics:topics};
  ITEM_TOPIC={}; ITEM_COS={}; ALL_PROBLEMS=[];
  topics.forEach(function(t){
    t.problems.forEach(function(g){
      g.items.forEach(function(it){
        ITEM_TOPIC[it.id]=t.title;
        if(it.companies&&it.companies.length)ITEM_COS[it.id]=it.companies;
        ALL_PROBLEMS.push({item:it,topic:t,group:g});
      });
    });
    t.concepts.forEach(function(c){
      ITEM_TOPIC[c.id]=t.title;
      (function walk(ns){
        (ns||[]).forEach(function(n){ITEM_TOPIC[n.id]=t.title;walk(n.children);});
      })(c.parts);
    });
  });
}
/* Generated sections and problems are rebuilt from the notes on every push, so
   moving one is stored as an override (CUSTOM.secMoves / CUSTOM.moves) and
   replayed here. HOME remembers where each one started, for "Put it back".
   An override whose target no longer exists is skipped: the item stays home. */
var HOME={};
function applyMoves(byTopic,byGroup,groupTopic){
  CUSTOM.moves=CUSTOM.moves||[]; CUSTOM.secMoves=CUSTOM.secMoves||[];
  HOME={};
  Object.keys(byGroup).forEach(function(gid){
    var g=byGroup[gid];
    HOME[gid]={topicId:groupTopic[gid].id,title:g.title};
    g.items.forEach(function(it){HOME[it.id]={topicId:groupTopic[gid].id,groupId:gid};});
  });
  CUSTOM.secMoves.forEach(function(m){
    var g=byGroup[m.id], from=groupTopic[m.id], to=byTopic[m.topicId];
    if(g&&m.title)g.title=m.title;        // generated groups are copies, safe to rename
    if(!g||!from||!to||from===to)return;
    from.problems.splice(from.problems.indexOf(g),1);
    to.problems.push(g); groupTopic[m.id]=to;
  });
  var home={};
  Object.keys(byGroup).forEach(function(gid){
    byGroup[gid].items.forEach(function(it){home[it.id]=byGroup[gid];});
  });
  CUSTOM.moves.forEach(function(m){
    var from=home[m.id], to=byGroup[m.groupId];
    if(!from||!to||from===to)return;
    for(var i=0;i<from.items.length;i++)if(from.items[i].id===m.id){
      to.items.push(from.items.splice(i,1)[0]); home[m.id]=to; break;
    }
  });
}
function persistCustom(msg){
  rebuildData(); render();
  if(!store.saveCustom){toast("This view cannot save custom content.");return;}
  store.saveCustom(CUSTOM).then(function(ok){
    toast(ok?(msg||"Saved."):"Could not save — your change may be lost on reload.");
  });
}
function findTopic(id){
  for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].id===id)return DATA.topics[i];
  return null;
}
function problemById(id){
  for(var i=0;i<ALL_PROBLEMS.length;i++)
    if(ALL_PROBLEMS[i].item.id===id)return ALL_PROBLEMS[i].item;
  return null;
}
function customItem(id){
  for(var i=0;i<CUSTOM.items.length;i++)if(CUSTOM.items[i].id===id)return CUSTOM.items[i];
  return null;
}

/* ---------- modal ---------- */
var modalBack=null;
function closeModal(){
  if(modalBack){modalBack.hidden=true;modalBack.innerHTML="";}
}
function openModal(html,onSubmit){
  if(!modalBack){
    modalBack=document.createElement("div");
    modalBack.id="modalBack"; modalBack.hidden=true;
    document.body.appendChild(modalBack);
    modalBack.addEventListener("click",function(e){
      if(e.target===modalBack)closeModal();
    });
  }
  modalBack.innerHTML='<form class="modal" id="modalForm" autocomplete="off">'+html+'</form>';
  modalBack.hidden=false;
  var form=modalBack.querySelector("#modalForm");
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var err=onSubmit(form);
    if(err){var el=form.querySelector(".err-msg");if(el)el.textContent=err;}
  });
  var first=form.querySelector("input,select,textarea");
  if(first)first.focus();
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&modalBack&&!modalBack.hidden){closeModal();return;}
  var tid=e.target&&e.target.getAttribute&&e.target.getAttribute("data-tagnew");
  if(tid&&e.key==="Enter"){
    e.preventDefault();
    if(addTag(tid,e.target.value)){e.target.value="";pushItem(tid);}
  }
  if(e.key==="Escape"&&e.target&&e.target.id==="search"&&query){
    e.target.value=""; query=""; render();
  }
});

function topicOptions(sel){
  return DATA.topics.map(function(t){
    return '<option value="'+esc(t.id)+'"'+(t.id===sel?" selected":"")+'>'+esc(t.title)+'</option>';
  }).join("");
}
function groupOptions(topicId,sel){
  var t=findTopic(topicId);
  var opts=(t?t.problems:[]).map(function(g){
    return '<option value="'+esc(g.id)+'"'+(g.id===sel?" selected":"")+'>'+esc(g.title)+'</option>';
  }).join("");
  return opts+'<option value="__new__"'+(sel==="__new__"?" selected":"")+'>+ New section…</option>';
}

function deleteModule(id){
  CUSTOM.topics=CUSTOM.topics.filter(function(t){return t.id!==id;});
  var gone={};
  CUSTOM.groups.filter(function(g){return g.topicId===id;}).forEach(function(g){gone[g.id]=1;});
  CUSTOM.groups=CUSTOM.groups.filter(function(g){return g.topicId!==id;});
  CUSTOM.items=CUSTOM.items.filter(function(it){
    var drop=it.topicId===id||gone[it.groupId];
    if(drop)delete STATE[it.id];
    return !drop;
  });
  closeModal();
  route={view:"dash",topic:null,tab:route.tab};
  persistCustom("Module deleted.");
}
function deleteProblem(id){
  CUSTOM.items=CUSTOM.items.filter(function(it){return it.id!==id;});
  delete STATE[id];
  closeModal();
  persistCustom("Problem deleted.");
}

/* ---------- move a problem or a whole section ---------- */
function locateProblem(id){
  for(var i=0;i<ALL_PROBLEMS.length;i++)if(ALL_PROBLEMS[i].item.id===id)return ALL_PROBLEMS[i];
  return null;
}
function locateGroup(id){
  for(var i=0;i<DATA.topics.length;i++){
    var t=DATA.topics[i];
    for(var j=0;j<t.problems.length;j++)if(t.problems[j].id===id)return {topic:t,group:t.problems[j]};
  }
  return null;
}
function groupTitle(id){var l=locateGroup(id);return l?l.group.title:"";}
/* Overrides are replaced, never deleted: "put back" writes the home location, so
   merging with an older synced copy cannot bring the old move back. */
function upsertMove(list,rec){
  rec.t=Date.now();
  for(var i=0;i<list.length;i++)if(list[i].id===rec.id){list[i]=rec;return;}
  list.push(rec);
}
function isMoved(id){
  var l=locateProblem(id), hm=HOME[id];
  return !!(l&&hm&&!l.item.custom&&l.group.id!==hm.groupId);
}
function sectionMoved(id){
  var l=locateGroup(id), hm=HOME[id];
  return !!(l&&hm&&!l.group.custom&&(l.topic.id!==hm.topicId||l.group.title!==hm.title));
}
function moveProblem(id,topicId,groupId){
  var loc=locateProblem(id); if(!loc)return;
  if(loc.item.custom){
    var ci=customItem(id); if(!ci)return;
    ci.topicId=topicId; ci.groupId=groupId;
  }else{
    upsertMove(CUSTOM.moves,{id:id,topicId:topicId,groupId:groupId});
  }
}
/* title is optional: leave it out to keep the current name */
function moveSection(id,topicId,title){
  var loc=locateGroup(id); if(!loc)return;
  var g=loc.group;
  if(title==null)title=g.title;
  if(g.custom){
    for(var i=0;i<CUSTOM.groups.length;i++)if(CUSTOM.groups[i].id===id){
      CUSTOM.groups[i].topicId=topicId; CUSTOM.groups[i].title=title;
    }
    // custom problems carry their module too; "My problems" is found by it alone
    g.items.forEach(function(it){var ci=it.custom&&customItem(it.id);if(ci)ci.topicId=topicId;});
  }else{
    var hm=HOME[id], rec={id:id,topicId:topicId};
    if(!hm||title!==hm.title)rec.title=title;
    upsertMove(CUSTOM.secMoves,rec);
  }
}

      if(customChanged)persistCustom(movedTo?"Saved · moved to "+movedTo+".":"Saved.");

/* ---------- tags ----------
   Every problem carries its module name as an implicit tag, so module and
   user tags combine in the same filter. Company tags from practice/*.md are
   implicit too. Implicit tags cannot be removed. */
function itemTags(id){
  var out=[], mod=ITEM_TOPIC[id], cos=ITEM_COS[id]||[];
  if(mod)out.push({name:mod,implicit:true});
  cos.forEach(function(c){if(c!==mod)out.push({name:c,implicit:true,company:true});});
  st(id).tags.forEach(function(t){
    if((!mod||t!==mod)&&cos.indexOf(t)<0)out.push({name:t,implicit:false});
  });
  return out;
}
function tagNames(id){
  return itemTags(id).map(function(t){return t.name;});
}
function allTags(){
  var counts={}, implicit={}, company={};
  ALL_PROBLEMS.forEach(function(r){
    tagNames(r.item.id).forEach(function(n){counts[n]=(counts[n]||0)+1;});
    if(ITEM_TOPIC[r.item.id])implicit[ITEM_TOPIC[r.item.id]]=true;
    (ITEM_COS[r.item.id]||[]).forEach(function(c){implicit[c]=true;company[c]=true;});
  });
  function rank(n){return !implicit[n]?0:company[n]?1:2;}  // user, company, module
  return Object.keys(counts).sort(function(a,b){
    if(rank(a)!==rank(b))return rank(a)-rank(b);
    return a.localeCompare(b);
  }).map(function(n){return {name:n,count:counts[n],implicit:!!implicit[n],company:!!company[n]};});
}
function addTag(id,name){
  name=(name||"").trim().replace(/\s+/g," ").slice(0,32);
  if(!name)return false;
  var cur=st(id).tags.slice();
  var low=name.toLowerCase();
  for(var i=0;i<cur.length;i++)if(cur[i].toLowerCase()===low)return false;
  if(ITEM_TOPIC[id]&&ITEM_TOPIC[id].toLowerCase()===low)return false;   // already implicit
  if((ITEM_COS[id]||[]).some(function(c){return c.toLowerCase()===low;}))return false;
  cur.push(name);
  setItem(id,{tags:cur});
  return true;
}
function removeTag(id,name){
  setItem(id,{tags:st(id).tags.filter(function(t){return t!==name;})});
}
/* Remove a tag from every problem that carries it. Module tags are implicit and
   cannot be deleted this way. */
function tagUsage(name){
  var ids=[];
  ALL_PROBLEMS.forEach(function(r){
    if(st(r.item.id).tags.indexOf(name)>=0)ids.push(r.item.id);
  });
  return ids;
}
function deleteTagEverywhere(name){
  var ids=tagUsage(name);
  if(!ids.length){toast("That tag is not used anywhere.");return;}
  ids.forEach(function(id){removeTag(id,name);});
  var i=activeTags.indexOf(name);
  if(i>=0)activeTags.splice(i,1);
  render();
  store.bulk(STATE).then(function(ok){
    toast(ok?('Removed "'+name+'" from '+ids.length+' problem'+(ids.length===1?"":"s")+"."):
             "Could not save that change.");
  });
}
function toggleActiveTag(name){
  var i=activeTags.indexOf(name);
  if(i<0)activeTags.push(name); else activeTags.splice(i,1);
}
function passTags(id){
  if(!activeTags.length)return true;
  var names=tagNames(id);
  for(var i=0;i<activeTags.length;i++)
    if(names.indexOf(activeTags[i])<0)return false;    // AND across tags
  return true;
}

/* ---------- analytics ----------
   Everything here is derived from STATE, so it syncs with the gist like the rest
   of your progress. Items ticked before dates were recorded have no doneAt and
   are reported separately rather than guessed at. */
function allUnits(){
  var out=[];
  DATA.topics.forEach(function(t){
    t.concepts.forEach(function(c){
      conceptUnits(c).forEach(function(u){out.push({id:u.id,kind:"concept",topic:t});});
    });
    t.problems.forEach(function(g){
      g.items.forEach(function(it){out.push({id:it.id,kind:"problem",topic:t,item:it});});
    });
  });
  return out;
}
function dayOffset(key,n){
  var p=key.split("-");
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()+n);
  return todayKey(d);
}
/* scope: "all" | "concept" | "problem" - every number below honours it */
function analytics(scope){
  var units=allUnits();
  if(scope==="concept"||scope==="problem")
    units=units.filter(function(u){return u.kind===scope;});
  var byDay={}, undated=0, doneTotal=0;
  var kind={concept:{done:0,total:0},problem:{done:0,total:0}};
  var tier={basic:{done:0,total:0},core:{done:0,total:0},pro:{done:0,total:0}};
  var perTopic={};
  var fav=0,repeat=0,notes=0,tagged=0,linked=0;

  units.forEach(function(u){
    var s=st(u.id);
    kind[u.kind].total++;
    var tk=u.topic.id;
    perTopic[tk]=perTopic[tk]||{title:u.topic.title,done:0,total:0,c:0,p:0,cd:0,pd:0};
    perTopic[tk].total++;
    if(u.kind==="concept")perTopic[tk].c++; else perTopic[tk].p++;
    if(u.item&&u.item.tier&&tier[u.item.tier])tier[u.item.tier].total++;
    if(s.fav)fav++;
    if(s.repeat)repeat++;
    if(s.note&&s.note.trim())notes++;
    if(s.tags&&s.tags.length)tagged++;
    if(u.item&&s.link)linked++;
    if(s.done){
      doneTotal++;
      kind[u.kind].done++;
      perTopic[tk].done++;
      if(u.kind==="concept")perTopic[tk].cd++; else perTopic[tk].pd++;
      if(u.item&&u.item.tier&&tier[u.item.tier])tier[u.item.tier].done++;
      if(s.doneAt){
        var b=byDay[s.doneAt]||(byDay[s.doneAt]={total:0,concept:0,problem:0});
        b.total++; b[u.kind]++;
      }else undated++;
    }
  });

  var today=todayKey();
  var days=[], cursor=dayOffset(today,-363);
  for(var i=0;i<364;i++){
    var k=dayOffset(cursor,i);
    var b=byDay[k];
    days.push({day:k,total:b?b.total:0,concept:b?b.concept:0,problem:b?b.problem:0});
  }

  // streaks over the days that actually have activity
  var cur=0,best=0,run=0;
  days.forEach(function(d){ if(d.total){run++;best=Math.max(best,run);}else run=0; });
  for(var j=days.length-1;j>=0;j--){
    if(days[j].total)cur++;
    else if(j===days.length-1)continue;   // today may simply not have started yet
    else break;
  }

  var last7=days.slice(-7).reduce(function(a,d){return a+d.total;},0);
  var last30=days.slice(-30).reduce(function(a,d){return a+d.total;},0);
  var activeDays=days.filter(function(d){return d.total;}).length;
  var remaining=units.length-doneTotal;
  var perDay30=last30/30, perDay7=last7/7;
  var eta=perDay30>0?Math.ceil(remaining/perDay30):null;

  var topics=Object.keys(perTopic).map(function(k){
    var r=perTopic[k];r.id=k;r.pct=r.total?r.done/r.total*100:0;return r;
  });

  return {units:units.length,done:doneTotal,remaining:remaining,undated:undated,
          byDay:byDay,days:days,today:byDay[today]||{total:0,concept:0,problem:0},
          streak:cur,best:best,last7:last7,last30:last30,activeDays:activeDays,
          perDay30:perDay30,perDay7:perDay7,eta:eta,kind:kind,tier:tier,topics:topics,
          fav:fav,repeat:repeat,notes:notes,tagged:tagged,linked:linked};
}

/* ---------- counting ---------- */
/* Markdown punctuation must not block a match: the heading
   "Choosing `for` vs `while`" has to be findable by typing "for vs while".
   Both sides collapse to lowercase words separated by single spaces. */
function normText(s){
  return (" "+String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g," ")+" ");
}
var HAY={};              // cache for large, static concept bodies
function matches(hay,extra,key){
  if(!query)return true;
  var h;
  if(key){ h=HAY[key]; if(h===undefined)h=HAY[key]=normText(hay+" "+(extra||"")); }
  else h=normText(hay+" "+(extra||""));
  var q=normText(query).replace(/^ +| +$/g,"");
  return !q||h.indexOf(q)!==-1;
}
function conceptHaystack(c,topicTitle){
  var parts=(c.parts||[]).map(nodeText).join(" ");
  return c.title+" "+(topicTitle||"")+" "+c.content+" "+parts;
}
/* A section shows when it matches, or when any of its subsections does. */
function conceptVisible(c,topicTitle){
  var units=conceptUnits(c);
  for(var i=0;i<units.length;i++){
    var u=units[i];
    if(!passFilter(u.id))continue;
    if(u===c){ if(matches(conceptHaystack(c,topicTitle),"",c.id))return true; }
    else if(matches(nodeText(u)+" "+c.title+" "+(topicTitle||""),"",u.id))return true;
  }
  return false;
}
function passFilter(id){
  var s=st(id);
  if(filter==="todo")return !s.done;
  if(filter==="done")return s.done;
  if(filter==="fav")return s.fav;
  if(filter==="repeat")return s.repeat;
  return true;
}
function leafUnits(node){
  if(node.children&&node.children.length){
    var out=[];
    node.children.forEach(function(ch){out=out.concat(leafUnits(ch));});
    return out;
  }
  return [node];
}
function conceptUnits(c){
  // A heading with children is a container; the deepest headings are what you
  // tick. Works at any depth, so a new ####? or ##### just slots in.
  if(c.parts&&c.parts.length){
    var out=[];
    c.parts.forEach(function(pt){out=out.concat(leafUnits(pt));});
    return out;
  }
  return [c];
}
function nodeText(node){
  var t=node.title+" "+node.content;
  (node.children||[]).forEach(function(ch){t+=" "+nodeText(ch);});
  return t;
}
function conceptCount(t){
  var d=0,n=0;
  t.concepts.forEach(function(c){
    conceptUnits(c).forEach(function(u){n++;if(isDone(u.id))d++;});
  });
  return {done:d,total:n};
}
function problemCount(t){
  var d=0,n=0;
  t.problems.forEach(function(g){g.items.forEach(function(it){n++;if(isDone(it.id))d++;});});
  return {done:d,total:n};
}
function topicCount(t){
  var c=conceptCount(t),p=problemCount(t);
  return {done:c.done+p.done,total:c.total+p.total,c:c,p:p};
}
function allCount(){
  var cd=0,cn=0,pd=0,pn=0;
  DATA.topics.forEach(function(t){
    var c=conceptCount(t),p=problemCount(t);
    cd+=c.done;cn+=c.total;pd+=p.done;pn+=p.total;});
  return {cdone:cd,ctotal:cn,pdone:pd,ptotal:pn,done:cd+pd,total:cn+pn};
}
function pct(d,n){return n?Math.round(d/n*100):0;}

/* ---------- rail ---------- */
/* Zone widths are proportional to how many items each side holds, and each zone
   fills independently \u2014 so "concepts done, problems pending" is readable at a
   glance without a second bar. */
function splitBar(c,p,cls){
  var tot=c.total+p.total;
  if(!tot)return '<div class="'+cls+'"></div>';
  var title="Concepts "+c.done+"/"+c.total+" \u00b7 Problems "+p.done+"/"+p.total;
  var h='<div class="'+cls+' dual" title="'+title+'">';
  if(c.total)h+='<div class="zone zc" style="width:'+(c.total/tot*100)+'%">'+
    '<i style="width:'+(c.done/c.total*100)+'%"></i></div>';
  if(p.total)h+='<div class="zone zp" style="width:'+(p.total/tot*100)+'%">'+
    '<i style="width:'+(p.done/p.total*100)+'%"></i></div>';
  return h+'</div>';
}
function legend(c,p){
  var out='<div class="legend">';
  if(c.total)out+='<span><span class="sq c"></span>Concepts <b>'+c.done+'/'+c.total+'</b></span>';
  if(p.total)out+='<span><span class="sq p"></span>Problems <b>'+p.done+'/'+p.total+'</b></span>';
  return out+'</div>';
}
function renderRail(){
  var a=allCount();
  var pinned=$("#railPinned");
  if(pinned){
    pinned.innerHTML='<button class="nav-item'+(route.view==="dash"?" active":"")+'" data-nav="dash">'+
      '<div class="nav-row"><span class="nav-title">Dashboard</span>'+
      '<span class="nav-count tnum">'+a.done+'/'+a.total+'</span></div>'+
      splitBar({done:a.cdone,total:a.ctotal},{done:a.pdone,total:a.ptotal},"nav-bar")+'</button>'+
      '<div class="rail-div"></div>'+
      '<div class="rail-label" style="padding-bottom:2px">Topics</div>';
  }
  var h="";
  DATA.topics.forEach(function(t){
    var c=topicCount(t);
    h+='<button class="nav-item'+(route.topic===t.id?" active":"")+'" data-nav="topic" data-id="'+t.id+'">'+
      '<div class="nav-row"><span class="nav-title">'+esc(t.title)+'</span>'+
      '<span class="nav-count tnum">'+c.done+'/'+c.total+'</span></div>'+
      splitBar(c.c,c.p,"nav-bar")+'</button>';
  });
  rail.innerHTML=h;
  /* Dock lays topics out in a horizontal strip: keep the open one in view,
     but only when the page changes, not on every tick's re-render. */
  var key=route.view+"|"+route.topic+"|"+currentLayout();
  if(key!==lastRailKey){
    lastRailKey=key;
    var act=currentLayout()==="dock"&&rail.querySelector(".nav-item.active");
    if(act&&rail.scrollTo)rail.scrollTo({left:Math.max(0,act.offsetLeft-rail.clientWidth/2+act.offsetWidth/2),behavior:"smooth"});
  }
}
var lastRailKey=null;

/* ---------- dashboard ---------- */
function ring(p){
  var r=50,C=2*Math.PI*r;
  return '<svg viewBox="0 0 118 118" width="118" height="118" aria-hidden="true">'+
   '<circle cx="59" cy="59" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="9"/>'+
   '<circle cx="59" cy="59" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="9" '+
   'stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+
   '" transform="rotate(-90 59 59)"/></svg>';
}
/* How fresh the generated data is. If this lags behind your last notes commit,
   the rebuild did not run. */
function buildStamp(){
  if(!META.generatedAt)return "";
  var ts=Date.parse(META.generatedAt);
  if(isNaN(ts))return "";
  var mins=Math.floor((Date.now()-ts)/60000), rel;
  if(mins<2)rel="just now";
  else if(mins<60)rel=mins+" minutes ago";
  else if(mins<2880)rel=Math.floor(mins/60)+" hours ago";
  else rel=Math.floor(mins/1440)+" days ago";
  return ' \u00b7 <span title="'+esc(META.generatedAt)+'">data built '+rel+'</span>';
}
