<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Personal DSA study tracker: concepts from my notes plus the Striver A2Z problem sheet.">
<meta name="color-scheme" content="light dark">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<title>Pattern Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f7f9fa; --surface-3:#e9edf1;
  --border:#d8dee5; --border-strong:#c3ccd6;
  --ink:#141922; --ink-2:#48525f; --ink-3:#737f8c;
  --teal:#15635c; --teal-soft:#dcebe9; --teal-ink:#0e4b45;
  --amber:#a76a1c; --amber-soft:#f7ead6; --amber-line:#c98a2e;
  --red:#9c3a28; --red-soft:#f6e2de;
  --basic:#2d6a4a; --core:#8a6412; --pro:#9c3a28;
  --kw:#8a3a7a; --str:#2d6a4a; --num:#8a6412; --com:#8b94a0;
  --shadow:0 1px 2px rgba(20,25,34,.06), 0 4px 14px rgba(20,25,34,.05);
  --radius:10px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --display:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1319; --surface:#151b23; --surface-2:#1a212a; --surface-3:#202934;
    --border:#263039; --border-strong:#35424f;
    --ink:#e6ebf1; --ink-2:#a7b2bf; --ink-3:#7d8997;
    --teal:#56b8ad; --teal-soft:#13302f; --teal-ink:#8ad6cc;
    --amber:#dda54f; --amber-soft:#2e2517; --amber-line:#9a7430;
    --red:#e07a67; --red-soft:#2f1c19;
    --basic:#5cb98a; --core:#d4ab52; --pro:#e07a67;
    --kw:#d78fc8; --str:#8fd4a8; --num:#e0bd6e; --com:#6b7683;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1319; --surface:#151b23; --surface-2:#1a212a; --surface-3:#202934;
  --border:#263039; --border-strong:#35424f;
  --ink:#e6ebf1; --ink-2:#a7b2bf; --ink-3:#7d8997;
  --teal:#56b8ad; --teal-soft:#13302f; --teal-ink:#8ad6cc;
  --amber:#dda54f; --amber-soft:#2e2517; --amber-line:#9a7430;
  --red:#e07a67; --red-soft:#2f1c19;
  --basic:#5cb98a; --core:#d4ab52; --pro:#e07a67;
  --kw:#d78fc8; --str:#8fd4a8; --num:#e0bd6e; --com:#6b7683;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

#shell{display:grid;grid-template-columns:272px 1fr;height:100%}
#rail{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
#railHead{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.brand{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0}
.brand-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
  margin-top:3px;font-weight:500}
#railScroll{overflow-y:auto;flex:1;padding:8px 8px 20px;min-height:0}
.rail-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:12px 8px 6px}
#account{margin-top:12px}
.gbtn{display:flex;align-items:center;gap:9px;width:100%;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:8px;padding:7px 11px;
  font-size:13px;font-weight:500;color:var(--ink)}
.gbtn:hover{background:var(--surface-2);border-color:var(--teal)}
.gbtn svg{flex:none}
.acct{display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;flex:none;background:var(--teal-soft);
  color:var(--teal-ink);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct-mid{flex:1;min-width:0}
.acct-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-sync{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.acct-sync .sdot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.acct-sync.off .sdot{background:var(--ink-3)}
.acct-sync.err .sdot{background:var(--red)}
.linkbtn{background:none;border:0;padding:0;font-size:11px;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink)}
.acct-note{font-size:11px;color:var(--ink-3);line-height:1.45;margin-top:7px}
.merge-card{background:var(--surface);border:1px solid var(--amber-line);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.merge-card h3{font-size:14px;font-weight:600;margin:0 0 5px}
.merge-card p{font-size:12.5px;color:var(--ink-2);margin:0 0 11px}

/* custom content */
.btn-add{background:var(--teal);border:1px solid var(--teal);color:#fff;border-radius:8px;
  padding:7px 13px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .btn-add,
:root:not([data-theme="light"]) .btn-add{color:#0e1319}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn-add{color:#fff}}
.btn-add:hover{filter:brightness(1.08)}
.topic-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag.custom{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,transparent);
  background:var(--teal-soft)}
#modalBack{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:120;
  display:flex;align-items:center;justify-content:center;padding:20px}
#modalBack[hidden]{display:none!important}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:440px;max-height:86vh;
  overflow-y:auto;padding:20px}
.modal h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 4px}
.modal .modal-sub{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;
  font-size:13.5px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);
  outline-offset:-1px;border-color:transparent}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1;min-width:0}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal-foot .spacer{flex:1}
.err-msg{color:var(--red);font-size:12px;margin-top:8px;min-height:15px}
.nav-item{display:block;width:100%;text-align:left;background:none;border:0;
  padding:7px 9px;border-radius:7px;margin-bottom:1px}
.nav-item:hover{background:var(--surface-3)}
.nav-item.active{background:var(--teal-soft)}
.nav-item.active .nav-title{color:var(--teal-ink);font-weight:600}
.nav-row{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.nav-title{font-size:13.5px;font-weight:500}
.nav-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.nav-bar{height:3px;border-radius:2px;background:var(--surface-3);margin-top:5px;overflow:hidden;display:flex}
.nav-bar > i{display:block;height:100%;background:var(--amber)}
.nav-bar > i.c{background:var(--teal)}

#main{overflow-y:auto;min-height:0}
.wrap{max-width:920px;margin:0 auto;padding:26px 20px 72px}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)}
.topbar-in{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:9px}
#menuBtn{display:none}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;font-size:13px;color:var(--ink-2);line-height:1.2}
.icon-btn:hover{border-color:var(--border-strong);color:var(--ink)}
#search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:7px 11px;font:inherit;font-size:13.5px;color:var(--ink)}
#search::placeholder{color:var(--ink-3)}
#search:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:transparent}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:6px 10px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}

h1.page-title{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;
  margin:0 0 4px;text-wrap:balance}
.page-sub{color:var(--ink-2);font-size:13.5px;margin:0 0 20px}

.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;margin-bottom:22px;display:flex;gap:26px;
  align-items:center;flex-wrap:wrap}
.ring-wrap{position:relative;width:118px;height:118px;flex:none}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:var(--mono);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring-cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin-top:4px;font-weight:600}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;flex:1;min-width:200px}
.stat-k{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  line-height:1.1;display:block}
.stat-k small{color:var(--ink-3);font-size:15px;font-weight:500}
.stat-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 15px;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--teal);transform:translateY(-1px)}
.tcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tcard-name{font-weight:600;font-size:14.5px}
.tcard-n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:11px;display:flex}
.bar > i{display:block;height:100%;background:var(--amber);transition:width .35s}
.bar > i.c{background:var(--teal)}
.tcard-meta{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:2px;vertical-align:middle;margin-right:4px}
.dot.c{background:var(--teal)} .dot.p{background:var(--amber)}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--surface-3);padding:3px;border-radius:9px;
  margin:0 0 18px;width:fit-content;max-width:100%}
.tabs button{background:none;border:0;padding:7px 15px;border-radius:7px;font-size:13.5px;
  font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .tab-n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px;
  font-variant-numeric:tabular-nums}

.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:11px;overflow:hidden}
.sec-head{width:100%;display:flex;align-items:center;gap:11px;padding:12px 15px;
  background:none;border:0;text-align:left}
.sec-head:hover{background:var(--surface-2)}
.chev{color:var(--ink-3);transition:transform .18s;flex:none;display:flex}
.section.open .chev{transform:rotate(90deg)}
.sec-title{font-weight:600;font-size:14px;flex:1;min-width:0}
.sec-count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-bar{width:58px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.sec-bar > i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .3s}
.sec-bar.done > i{background:var(--teal)}
.sec-body{border-top:1px solid var(--border)}
.section:not(.open) .sec-body{display:none}

/* concept card */
.concept-body{padding:14px 18px 18px}
.concept-sub{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.subchip{font-size:11px;color:var(--ink-3);background:var(--surface-3);
  border-radius:5px;padding:2.5px 8px;border:1px solid var(--border)}
.concept-foot{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:13px;
  border-top:1px solid var(--border);flex-wrap:wrap}

.row{display:flex;align-items:flex-start;gap:11px;padding:9px 15px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.is-done .row-title{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.tick{flex:none;width:19px;height:19px;margin-top:2px;border-radius:5px;
  border:1.5px solid var(--border-strong);background:var(--surface);
  display:flex;align-items:center;justify-content:center;padding:0}
.tick:hover{border-color:var(--teal)}
.tick[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.tick svg{opacity:0;width:11px;height:11px;color:var(--surface)}
.tick[aria-pressed="true"] svg{opacity:1}
.row-mid{flex:1;min-width:0}
.row-title{font-size:13.5px;line-height:1.45;overflow-wrap:break-word}
.row-hint{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.row-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:1.5px 6px;
  border-radius:4px;border:1px solid var(--border);color:var(--ink-3);white-space:nowrap}
a.tag{text-decoration:none}
.tag.lc{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 35%,transparent);background:var(--teal-soft)}
.tag.src-a2z{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.tag.t-basic{color:var(--basic);border-color:color-mix(in srgb,var(--basic) 40%,transparent)}
.tag.t-core{color:var(--core);border-color:color-mix(in srgb,var(--core) 40%,transparent)}
.tag.t-pro{color:var(--pro);border-color:color-mix(in srgb,var(--pro) 40%,transparent)}
.tag.has-note{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 35%,transparent)}
.row-actions{display:flex;gap:4px;flex:none;align-items:center}
.mini{background:none;border:1px solid transparent;border-radius:6px;padding:3px 7px;
  font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.mini:hover{border-color:var(--border);color:var(--ink)}
.mini[aria-expanded="true"]{background:var(--surface-3);color:var(--ink);border-color:var(--border)}
.detail{padding:4px 15px 16px 45px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.detail h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:12px 0 7px;font-weight:600}
.note-area{width:100%;min-height:88px;resize:vertical;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:10px 11px;
  font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--ink)}
.note-area:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:transparent}
.note-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
  font-size:11px;color:var(--ink-3);min-height:16px;gap:10px}

/* markdown */
.md{font-size:13.5px;line-height:1.68;color:var(--ink-2);overflow-wrap:break-word}
.md > :first-child{margin-top:0}
.md pre{background:var(--surface-3);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;overflow-x:auto;margin:12px 0}
.md code{font-family:var(--mono);font-size:12.2px}
.md pre code{font-size:12.2px;color:var(--ink);background:none;border:0;padding:0}
.md :not(pre) > code{background:var(--surface-3);border:1px solid var(--border);
  padding:.5px 4px;border-radius:4px;color:var(--ink)}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0;padding-left:22px}
.md li{margin:4px 0}
.md strong{color:var(--ink);font-weight:600}
.md table{border-collapse:collapse;margin:12px 0;font-size:12.3px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md th{background:var(--surface-3);font-weight:600;color:var(--ink)}
.md h1,.md h2{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);
  margin:20px 0 8px;letter-spacing:-.01em}
.md h3{font-family:var(--sans);font-size:14.5px;font-weight:600;color:var(--ink);margin:18px 0 7px;
  padding-top:12px;border-top:1px solid var(--border)}
.md h3:first-child{border-top:0;padding-top:0;margin-top:0}
.md h4,.md h5{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);margin:14px 0 6px}
.md blockquote{border-left:3px solid var(--teal);margin:12px 0;padding:3px 0 3px 13px;color:var(--ink-3)}
.md hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.md a{color:var(--teal)}
.hljs-keyword,.hljs-built_in{color:var(--kw)}
.hljs-string{color:var(--str)}
.hljs-number{color:var(--num)}
.hljs-comment{color:var(--com);font-style:italic}
.hljs-title,.hljs-function .hljs-title{color:var(--teal);font-weight:600}
.hljs-params{color:var(--ink-2)}

.danger-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-top:22px}
.danger-card h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 4px}
.danger-card p{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;max-width:64ch}
.btn-danger{background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);
  color:var(--red);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600}
.btn-danger:hover{background:color-mix(in srgb,var(--red) 18%,var(--red-soft))}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);

<script>
(function(){
"use strict";

var BASE=null;                 // generated from notes/*.md — never written to
var CUSTOM={topics:[],groups:[],items:[]};   // viewer's own modules and problems
var DATA=null, STATE={}, store=null;
var route={view:"dash",topic:null,tab:"concepts"};
var filter="all", query="", openSec={}, openDetail={}, noteTimers={};
var $=function(s,r){return (r||document).querySelector(s);};
var view=$("#view"), rail=$("#railScroll"), toastEl=$("#toast");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("show");},2400);}
function st(id){return STATE[id]||{done:false,note:""};}
function isDone(id){return !!st(id).done;}

/* ---------- storage: artifact db when hosted by Claude, else localStorage ---------- */
var LS_KEY="pattern-ledger-v1", LS_CUSTOM="pattern-ledger-custom-v1";
function emptyCustom(){return {topics:[],groups:[],items:[]};}
function localStore(){
  function readKey(k,fallback){
    try{var r=localStorage.getItem(k);return r?JSON.parse(r):fallback;}catch(e){return fallback;}
  }
  function writeKey(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}
  }
  return {
    kind:"local",
    load:function(){return Promise.resolve(readKey(LS_KEY,{}));},
    save:function(id,rec){var m=readKey(LS_KEY,{});m[id]=rec;
      return Promise.resolve(writeKey(LS_KEY,m));},
    bulk:function(map){return Promise.resolve(writeKey(LS_KEY,map));},
    loadCustom:function(){return Promise.resolve(readKey(LS_CUSTOM,emptyCustom()));},
    saveCustom:function(c){return Promise.resolve(writeKey(LS_CUSTOM,c));},
    watch:function(){}
  };
}
/* ---- GitHub Gist sync: progress stored as a secret gist in your own account ----
   No third-party service, no account to create, nothing that expires or pauses.
   You paste a token scoped to gists only; it is kept in this browser's
   localStorage and sent to api.github.com and nowhere else. */
var GH={token:null,gistId:null,user:null};
var GH_TOKEN_KEY="pattern-ledger-gh-token", GH_GIST_KEY="pattern-ledger-gist-id";
var GIST_FILE="pattern-ledger.json";
var GIST_DESC="Pattern Ledger \u2014 DSA study progress";
var GH_TOKEN_URL="https://github.com/settings/tokens/new?scopes=gist&description=Pattern%20Ledger";

function ghReadCreds(){
  try{
    GH.token=localStorage.getItem(GH_TOKEN_KEY)||null;
    GH.gistId=localStorage.getItem(GH_GIST_KEY)||null;
  }catch(e){ /* private window or blocked storage: stay disconnected */ }
}
function ghWriteCreds(){
  try{
    if(GH.token)localStorage.setItem(GH_TOKEN_KEY,GH.token);
    else localStorage.removeItem(GH_TOKEN_KEY);
    if(GH.gistId)localStorage.setItem(GH_GIST_KEY,GH.gistId);
    else localStorage.removeItem(GH_GIST_KEY);
  }catch(e){ /* nothing we can do; the session still works in memory */ }
}
function ghApi(path,opts){
  opts=opts||{};
  var headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(GH.token)headers.Authorization="Bearer "+GH.token;
  if(opts.body)headers["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,{
    method:opts.method||"GET",
    headers:headers,
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    if(r.status===401)return Promise.reject({code:"bad_token"});
    if(r.status===403||r.status===429)return Promise.reject({code:"rate_limited"});
    if(r.status===404)return Promise.reject({code:"not_found"});
    if(!r.ok)return Promise.reject({code:"http_"+r.status});
    return r.status===204?null:r.json();
  },function(){
    return Promise.reject({code:"offline"});
  });
}
function ghPayload(){
  return {app:"pattern-ledger",version:2,updatedAt:new Date().toISOString(),
          state:STATE,custom:CUSTOM};
}
function ghFiles(obj){
  var f={}; f[GIST_FILE]={content:JSON.stringify(obj,null,1)};
  return f;
}
function ghParse(text){
  var out={state:{},custom:emptyCustom()};
  try{
    var j=JSON.parse(text);
    if(j&&typeof j==="object"){
      if(j.state&&typeof j.state==="object")out.state=j.state;
      if(j.custom&&typeof j.custom==="object"){
        out.custom={topics:j.custom.topics||[],groups:j.custom.groups||[],
                    items:j.custom.items||[]};
      }
    }
  }catch(e){ /* a hand-edited gist that no longer parses: start empty rather than crash */ }
  return out;
}
/* Find the app's gist, or make one. Never touches any other gist. */
function ghFindOrCreateGist(allowRetry){
  if(GH.gistId){
    return ghApi("/gists/"+GH.gistId).catch(function(e){
      if(e&&e.code==="not_found"&&allowRetry!==false){
        GH.gistId=null;            // deleted on github.com: fall through and make a new one
        return ghFindOrCreateGist(false);
      }
      return Promise.reject(e);
    });
  }
  return ghApi("/gists?per_page=100").then(function(list){
    for(var i=0;i<list.length;i++){
      if(list[i].files&&list[i].files[GIST_FILE]){GH.gistId=list[i].id;return list[i];}
    }
    return ghApi("/gists",{method:"POST",body:{
      description:GIST_DESC,"public":false,files:ghFiles(ghPayload())}})
      .then(function(g){GH.gistId=g.id;return g;});
  });
}
function ghConnect(token){
  GH.token=(token||"").trim();
  if(!GH.token)return Promise.reject({code:"bad_token"});
  return ghApi("/user").then(function(u){
    GH.user={login:u.login,name:u.name||u.login,avatar:u.avatar_url};
    return ghFindOrCreateGist(true);
  }).then(function(){
    ghWriteCreds();
    return true;
  });
}
function ghDisconnect(){
  GH.token=null; GH.gistId=null; GH.user=null;
  ghWriteCreds();
  store=localStore();
  Promise.all([store.load(),store.loadCustom()]).then(function(r){
    STATE=r[0]||{}; CUSTOM=r[1]||emptyCustom();
    rebuildData(); render();
    toast("Disconnected. Showing this browser's copy; the gist is untouched.");
  });
}
function ghErrText(e){
  var c=e&&e.code;
  if(c==="bad_token")return "GitHub rejected that token. Check it has the gist scope and has not expired.";
  if(c==="rate_limited")return "GitHub is rate-limiting this token. Try again shortly.";
  if(c==="offline")return "Could not reach api.github.com.";
  if(c==="not_found")return "That gist no longer exists.";
  return "GitHub error"+(c?(" ("+c+")"):"")+".";
}

/* One gist file holds progress and custom modules, so both reads share one request. */
function gistStore(){
  var fetchP=null, saveTimer=null;
  function fetchAll(){
    if(!fetchP){
      fetchP=ghApi("/gists/"+GH.gistId).then(function(g){
        var f=g.files&&g.files[GIST_FILE];
        if(!f)return {state:{},custom:emptyCustom()};
        if(f.truncated&&f.raw_url){
          return fetch(f.raw_url).then(function(r){return r.text();}).then(ghParse);
        }
        return ghParse(f.content||"");
      });
    }
    return fetchP;
  }
  function flush(){
    fetchP=null;   // our own write is now the truth; drop the cached read
    return ghApi("/gists/"+GH.gistId,{method:"PATCH",body:{files:ghFiles(ghPayload())}})
      .then(function(){return true;},function(){return false;});
  }
  function schedule(){
    clearTimeout(saveTimer);
    return new Promise(function(res){
      saveTimer=setTimeout(function(){flush().then(res);},1200);
    });
  }
  return {
    kind:"gist",
    label:(GH.user&&GH.user.login)||"gist",
    load:function(){return fetchAll().then(function(p){return p.state;});},
    loadCustom:function(){return fetchAll().then(function(p){return p.custom;});},
    save:function(){return schedule();},
    bulk:function(){return flush();},
    saveCustom:function(){return flush();},
    watch:function(){}
  };
}

function dbStore(db){
  return {
    kind:"db",
    load:function(){
      return db.collection("items").get().then(function(s){
        var m={};s.docs.forEach(function(d){var v=d.data()||{};
          m[d.id]={done:!!v.done,note:typeof v.note==="string"?v.note:""};});
        return m;});
    },
    save:function(id,rec){
      return db.collection("items").doc(id)
        .set({done:!!rec.done,note:rec.note||"",updatedAt:Date.now()})
        .then(function(){return true;}).catch(function(){return false;});
    },
    bulk:function(map){
      var ids=Object.keys(map), i=0;
      return new Promise(function(res){
        (function step(){
          if(i>=ids.length)return res(true);
          var id=ids[i++];
          db.collection("items").doc(id)
            .set({done:!!map[id].done,note:map[id].note||"",updatedAt:Date.now()})
            .catch(function(){}).then(step);
        })();
      });
    },
    loadCustom:function(){
      return db.collection("meta").doc("custom").get().then(function(d){
        if(!d.exists)return emptyCustom();
        var v=d.data()||{};
        return {topics:v.topics||[],groups:v.groups||[],items:v.items||[]};
      },function(){return emptyCustom();});
    },
    saveCustom:function(c){
      return db.collection("meta").doc("custom")
        .set({topics:c.topics,groups:c.groups,items:c.items,updatedAt:Date.now()})
        .then(function(){return true;},function(){return false;});
    },
    watch:function(){}
  };
}

/* ---------- custom modules and problems ----------
   BASE is the generated curriculum (rebuilt from notes/*.md by tools/build_site.py,
   so anything written into it by hand is lost on the next build). Everything the
   viewer adds lives in CUSTOM, which is stored in whichever database is active,
   and is folded into BASE at load time to produce DATA. */
function newId(prefix){
  return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
}
function rebuildData(){
  var byTopic={}, topics=[];
  BASE.topics.forEach(function(t){
    var copy={id:t.id,title:t.title,concepts:t.concepts,
      problems:t.problems.map(function(g){
        return {id:g.id,title:g.title,source:g.source,items:g.items.slice()};
      })};
    byTopic[t.id]=copy; topics.push(copy);
  });
  CUSTOM.topics.forEach(function(ct){
    if(byTopic[ct.id])return;
    var copy={id:ct.id,title:ct.title,concepts:[],problems:[],custom:true};
    byTopic[ct.id]=copy; topics.push(copy);
  });
  var byGroup={};
  topics.forEach(function(t){t.problems.forEach(function(g){byGroup[g.id]=g;});});
  CUSTOM.groups.forEach(function(cg){
    if(byGroup[cg.id])return;
    var t=byTopic[cg.topicId]; if(!t)return;
    var g={id:cg.id,title:cg.title,source:"custom",custom:true,topicId:cg.topicId,items:[]};
    byGroup[cg.id]=g; t.problems.push(g);
  });
  CUSTOM.items.forEach(function(ci){
    var g=byGroup[ci.groupId];
    if(!g){
      var t=byTopic[ci.topicId]; if(!t)return;
      var fid="custom-"+ci.topicId;
      g=byGroup[fid];
      if(!g){
        g={id:fid,title:"My problems",source:"custom",custom:true,topicId:ci.topicId,items:[]};
        byGroup[fid]=g; t.problems.push(g);
      }
    }
    g.items.push(ci);
  });
  DATA={topics:topics};
}
function persistCustom(msg){
  rebuildData(); render();
  if(!store.saveCustom){toast("This view cannot save custom content.");return;}
  store.saveCustom(CUSTOM).then(function(ok){
    toast(ok?(msg||"Saved."):"Could not save — your change may be lost on reload.");
  });
}
function findTopic(id){
  for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].id===id)return DATA.topics[i];
  return null;
}
function customItem(id){
  for(var i=0;i<CUSTOM.items.length;i++)if(CUSTOM.items[i].id===id)return CUSTOM.items[i];
  return null;
}

/* ---------- modal ---------- */
var modalBack=null;
function closeModal(){
  if(modalBack){modalBack.hidden=true;modalBack.innerHTML="";}
}
function openModal(html,onSubmit){
  if(!modalBack){
    modalBack=document.createElement("div");
    modalBack.id="modalBack"; modalBack.hidden=true;
    document.body.appendChild(modalBack);
    modalBack.addEventListener("click",function(e){
      if(e.target===modalBack)closeModal();
    });
  }
  modalBack.innerHTML='<form class="modal" id="modalForm" autocomplete="off">'+html+'</form>';
  modalBack.hidden=false;
  var form=modalBack.querySelector("#modalForm");
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var err=onSubmit(form);
    if(err){var el=form.querySelector(".err-msg");if(el)el.textContent=err;}
  });
  var first=form.querySelector("input,select,textarea");
  if(first)first.focus();
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&modalBack&&!modalBack.hidden)closeModal();
});

function topicOptions(sel){
  return DATA.topics.map(function(t){
    return '<option value="'+esc(t.id)+'"'+(t.id===sel?" selected":"")+'>'+esc(t.title)+'</option>';
  }).join("");
}
function groupOptions(topicId,sel){
  var t=findTopic(topicId);
  var opts=(t?t.problems:[]).map(function(g){
    return '<option value="'+esc(g.id)+'"'+(g.id===sel?" selected":"")+'>'+esc(g.title)+'</option>';
  }).join("");
  return opts+'<option value="__new__"'+(sel==="__new__"?" selected":"")+'>+ New section…</option>';
}

function moduleForm(existing){
  var isEdit=!!existing;
  openModal(
    '<h2>'+(isEdit?"Rename module":"New module")+'</h2>'+
    '<p class="modal-sub">'+(isEdit?"Only the name changes; its problems stay put."
      :"A module is a topic of your own, alongside the ones built from your notes.")+'</p>'+
    '<div class="field"><label for="mTitle">Module name</label>'+
    '<input id="mTitle" name="title" required maxlength="60" value="'+esc(isEdit?existing.title:"")+'" placeholder="e.g. Segment Trees"></div>'+
    '<div class="err-msg"></div>'+
    '<div class="modal-foot">'+
      (isEdit?'<button type="button" class="btn-danger" data-delmodule="'+esc(existing.id)+'">Delete</button>':'')+
      '<span class="spacer"></span>'+
      '<button type="button" class="btn-ghost" data-close="1">Cancel</button>'+
      '<button type="submit" class="btn-add">'+(isEdit?"Save":"Create module")+'</button>'+
    '</div>',
    function(form){
      var title=form.title.value.trim();
      if(!title)return "Give the module a name.";
      if(isEdit){
        for(var i=0;i<CUSTOM.topics.length;i++)
          if(CUSTOM.topics[i].id===existing.id)CUSTOM.topics[i].title=title;
        closeModal(); persistCustom("Module renamed.");
      }else{
        var id=newId("mod");
        CUSTOM.topics.push({id:id,title:title});
        closeModal();
        route={view:"topic",topic:id,tab:"problems"};
        persistCustom("Module created.");
      }
      return null;
    });
}

function problemForm(existing,topicId){
  var isEdit=!!existing;
  var tId=isEdit?existing.topicId:(topicId||(DATA.topics[0]&&DATA.topics[0].id));
  openModal(
    '<h2>'+(isEdit?"Edit problem":"Add problem")+'</h2>'+
    '<p class="modal-sub">'+(isEdit?"":"Added problems are stored in your database, not in the generated notes data, so a rebuild never removes them.")+'</p>'+
    '<div class="field"><label for="pTitle">Problem</label>'+
    '<input id="pTitle" name="title" required maxlength="140" value="'+esc(isEdit?existing.title:"")+'" placeholder="e.g. Range Sum Query — Mutable"></div>'+
    '<div class="field-row">'+
      '<div class="field"><label for="pTopic">Module</label>'+
      '<select id="pTopic" name="topic" data-topicsel="1">'+topicOptions(tId)+'</select></div>'+
      '<div class="field"><label for="pTier">Level</label><select id="pTier" name="tier">'+
        ['','basic','core','pro'].map(function(v){
          var lab=v?({basic:"Basic",core:"Core",pro:"Pro"})[v]:"—";
          return '<option value="'+v+'"'+((isEdit&&existing.tier===v)||(!isEdit&&!v)?" selected":"")+'>'+lab+'</option>';
        }).join("")+'</select></div>'+
    '</div>'+
    '<div class="field"><label for="pGroup">Section</label>'+
    '<select id="pGroup" name="group" data-groupsel="1">'+groupOptions(tId,isEdit?existing.groupId:null)+'</select>'+
    '<input style="margin-top:7px" id="pNewGroup" name="newGroup" maxlength="60" placeholder="New section name" hidden></div>'+
    '<div class="field-row">'+
      '<div class="field"><label for="pLc">LeetCode number</label>'+
      '<input id="pLc" name="lc" maxlength="12" inputmode="numeric" value="'+esc(isEdit&&existing.lc?existing.lc:"")+'" placeholder="optional"></div>'+
      '<div class="field"><label for="pUrl">Link</label>'+
      '<input id="pUrl" name="url" type="url" value="'+esc(isEdit&&existing.url?existing.url:"")+'" placeholder="optional"></div>'+
    '</div>'+
    '<div class="field"><div class="hint">With a number and no link, the problem links to a LeetCode search for that number.</div></div>'+
    '<div class="err-msg"></div>'+
    '<div class="modal-foot">'+
      (isEdit?'<button type="button" class="btn-danger" data-delproblem="'+esc(existing.id)+'">Delete</button>':'')+
      '<span class="spacer"></span>'+
      '<button type="button" class="btn-ghost" data-close="1">Cancel</button>'+
      '<button type="submit" class="btn-add">'+(isEdit?"Save":"Add problem")+'</button>'+
    '</div>',
    function(form){
      var title=form.title.value.trim();
      if(!title)return "Give the problem a name.";
      var topic=form.topic.value;
      var group=form.group.value;
      var lc=form.lc.value.replace(/[^0-9]/g,"");
      var url=form.url.value.trim();
      if(group==="__new__"){
        var gn=form.newGroup.value.trim();
        if(!gn)return "Name the new section, or pick an existing one.";
        var gid=newId("sec");
        CUSTOM.groups.push({id:gid,topicId:topic,title:gn});
        group=gid;
      }
      var urlKind=null;
      if(url)urlKind="direct";
      else if(lc){url="https://leetcode.com/problemset/?search="+lc;urlKind="search";}
      var rec={id:isEdit?existing.id:newId("prob"),title:title,topicId:topic,groupId:group,
        lc:lc||null,url:url||null,urlKind:urlKind,tier:form.tier.value||null,
        source:"custom",custom:true};
      if(isEdit){
        for(var i=0;i<CUSTOM.items.length;i++)
          if(CUSTOM.items[i].id===existing.id)CUSTOM.items[i]=rec;
      }else{
        CUSTOM.items.push(rec);
      }
      closeModal();
      route={view:"topic",topic:topic,tab:"problems"};
      persistCustom(isEdit?"Problem updated.":"Problem added.");
      return null;
    });
}

function deleteModule(id){
  CUSTOM.topics=CUSTOM.topics.filter(function(t){return t.id!==id;});
  var gone={};
  CUSTOM.groups.filter(function(g){return g.topicId===id;}).forEach(function(g){gone[g.id]=1;});
  CUSTOM.groups=CUSTOM.groups.filter(function(g){return g.topicId!==id;});
  CUSTOM.items=CUSTOM.items.filter(function(it){
    var drop=it.topicId===id||gone[it.groupId];
    if(drop)delete STATE[it.id];
    return !drop;
  });
  closeModal();
  route={view:"dash",topic:null,tab:route.tab};
  persistCustom("Module deleted.");
}
function deleteProblem(id){
  CUSTOM.items=CUSTOM.items.filter(function(it){return it.id!==id;});
  delete STATE[id];
  closeModal();
  persistCustom("Problem deleted.");
}

/* ---------- counting ---------- */
function matches(title,extra){
  if(!query)return true;
  return ((title+" "+(extra||"")).toLowerCase().indexOf(query)!==-1);
}
function passFilter(id){
  if(filter==="todo")return !isDone(id);
  if(filter==="done")return isDone(id);
  return true;
}
function conceptCount(t){
  var d=0;t.concepts.forEach(function(c){if(isDone(c.id))d++;});
  return {done:d,total:t.concepts.length};
}
function problemCount(t){
  var d=0,n=0;
  t.problems.forEach(function(g){g.items.forEach(function(it){n++;if(isDone(it.id))d++;});});
  return {done:d,total:n};
}
function topicCount(t){
  var c=conceptCount(t),p=problemCount(t);
  return {done:c.done+p.done,total:c.total+p.total,c:c,p:p};
}
function allCount(){
  var cd=0,cn=0,pd=0,pn=0;
  DATA.topics.forEach(function(t){
    var c=conceptCount(t),p=problemCount(t);
    cd+=c.done;cn+=c.total;pd+=p.done;pn+=p.total;});
  return {cdone:cd,ctotal:cn,pdone:pd,ptotal:pn,done:cd+pd,total:cn+pn};
}
function pct(d,n){return n?Math.round(d/n*100):0;}

/* ---------- rail ---------- */
function splitBar(c,p,cls){
  var tot=c.total+p.total;
  if(!tot)return '<div class="'+cls+'"></div>';
  return '<div class="'+cls+'">'+
    '<i class="c" style="width:'+(c.done/tot*100)+'%"></i>'+
    '<i style="width:'+(p.done/tot*100)+'%"></i></div>';
}
function renderRail(){
  var a=allCount();
  var h='<button class="nav-item'+(route.view==="dash"?" active":"")+'" data-nav="dash">'+
    '<div class="nav-row"><span class="nav-title">Dashboard</span>'+
    '<span class="nav-count tnum">'+a.done+'/'+a.total+'</span></div>'+
    splitBar({done:a.cdone,total:a.ctotal},{done:a.pdone,total:a.ptotal},"nav-bar")+'</button>';
  h+='<div class="rail-label">Topics</div>';

      '<div class="nav-row"><span class="nav-title">'+esc(t.title)+'</span>'+
      '<span class="nav-count tnum">'+c.done+'/'+c.total+'</span></div>'+

}

   'stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+
   '" transform="rotate(-90 59 59)"/></svg>';
}

/* ---------- markdown ---------- */
var mdCache={};
function renderMd(src,key){
  if(key&&mdCache[key])return mdCache[key];
  var out;
  try{
    out=(window.marked&&window.marked.parse)
      ? window.marked.parse(src,{mangle:false,headerIds:false,breaks:false})
      : '<pre>'+esc(src)+'</pre>';
  }catch(e){out='<pre>'+esc(src)+'</pre>';}
  if(key)mdCache[key]=out;
  return out;
}
function highlightIn(root){
  if(!window.hljs)return;
  var blocks=root.querySelectorAll("pre code:not([data-hl])");
  for(var i=0;i<blocks.length;i++){
    blocks[i].setAttribute("data-hl","1");
    try{window.hljs.highlightElement(blocks[i]);}catch(e){}
  }
}

/* ---------- concepts ---------- */
function conceptCard(c){
  var done=isDone(c.id), open=!!openSec[c.id], s=st(c.id);
  var hasNote=!!(s.note&&s.note.trim());
  var h='<section class="section'+(open?" open":"")+'" data-sec="'+esc(c.id)+'">'+
    '<div class="sec-head" style="cursor:default">'+
      '<button class="tick" data-tick="'+esc(c.id)+'" aria-pressed="'+done+'" aria-label="Mark concept as read">'+
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9 10.5 2.8"/></svg></button>'+
      '<button class="sec-title" data-sechead="'+esc(c.id)+'" style="background:none;border:0;text-align:left;padding:0;font:inherit;font-weight:600;cursor:pointer">'+
        esc(c.title)+(hasNote?' <span class="tag has-note">note</span>':'')+'</button>'+
      '<button class="mini" data-sechead="'+esc(c.id)+'" aria-expanded="'+open+'">'+(open?"Hide":"Read")+'</button>'+
      '<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>'+
    '</div><div class="sec-body"><div class="concept-body">';
  if(open){
    if(c.subheads&&c.subheads.length){
      h+='<div class="concept-sub">';
      c.subheads.forEach(function(s2){h+='<span class="subchip">'+esc(s2.title)+'</span>';});
      h+='</div>';
    }
    h+='<div class="md" data-md="1">'+renderMd(c.content,c.id)+'</div>';
    h+='<div class="concept-foot">'+
      '<button class="mini" data-detail="'+esc(c.id)+'" aria-expanded="'+(!!openDetail[c.id])+'">My notes</button>'+
      '<button class="btn-ghost" data-tick="'+esc(c.id)+'" style="padding:5px 11px;font-size:12.5px">'+
        (done?"Marked as read ✓":"Mark as read")+'</button></div>';
    if(openDetail[c.id])h+=noteBlock(c.id,null);
  }
  h+='</div></div></section>';
  return h;
}

function noteBlock(id,url){
  var s=st(id);
  return '<div style="margin-top:12px"><h4 style="margin-top:0">My notes</h4>'+
    '<textarea class="note-area" id="na-'+esc(id)+'" data-note="'+esc(id)+'" '+
    'placeholder="Approach, invariant, what tripped you up, the date to retry…">'+esc(s.note||"")+'</textarea>'+
    '<div class="note-foot"><span data-notestatus="'+esc(id)+'"></span>'+
    (url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">Open on LeetCode ↗</a>':'<span></span>')+
    '</div></div>';
}

/* ---------- problems ---------- */
var TIER={basic:"Basic",core:"Core",pro:"Pro"};
function problemRow(it){
  var s=st(it.id),done=!!s.done,open=!!openDetail[it.id];
  var hasNote=!!(s.note&&s.note.trim());
  var tags="";
  if(it.source==="a2z")tags+='<span class="tag src-a2z">A2Z</span>';
  if(it.tier)tags+='<span class="tag t-'+esc(it.tier)+'">'+esc(TIER[it.tier]||it.tier)+'</span>';
  if(it.lc)tags+='<span class="tag">LC '+esc(it.lc)+'</span>';
  if(it.url)tags+='<a class="tag lc" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+
    (it.urlKind==="direct"?"LeetCode ↗":"Find on LC ↗")+'</a>';
  if(it.custom)tags+='<span class="tag custom">mine</span>';
  if(hasNote)tags+='<span class="tag has-note">note</span>';
  var h='<div class="row'+(done?" is-done":"")+'">'+
    '<button class="tick" data-tick="'+esc(it.id)+'" aria-pressed="'+done+'" aria-label="Mark solved">'+
      '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9 10.5 2.8"/></svg></button>'+
    '<div class="row-mid"><div class="row-title">'+esc(it.title)+'</div>'+
      (it.hint?'<div class="row-hint">'+esc(it.hint)+'</div>':'')+
      (tags?'<div class="row-tags">'+tags+'</div>':'')+'</div>'+
    '<div class="row-actions">'+
      (it.custom?'<button class="mini" data-editproblem="'+esc(it.id)+'">Edit</button>':'')+
      '<button class="mini" data-detail="'+esc(it.id)+'" aria-expanded="'+open+'">Notes</button>'+
    '</div></div>';
  if(open)h+='<div class="detail">'+noteBlock(it.id,it.url)+'</div>';
  return h;
}

function visibleProblems(g){
  var out=[];
  g.items.forEach(function(it){
    if(!passFilter(it.id))return;
    if(!matches(it.title,(it.lc||"")+" "+(it.tier||"")+" "+g.title))return;
    out.push(it);
  });
  return out;
}

/* ---------- topic view ---------- */
function renderTopic(){
  var t=null;
  for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].id===route.topic)t=DATA.topics[i];
  if(!t){route={view:"dash",topic:null,tab:"concepts"};return renderDash();}
  var c=topicCount(t);
  var tab=route.tab;
  if(tab==="concepts"&&!t.concepts.length&&t.problems.length)tab="problems";
  if(tab==="problems"&&!problemCount(t).total&&t.concepts.length)tab="concepts";

  var h='<h1 class="page-title">'+esc(t.title)+'</h1>'+
    '<p class="page-sub">'+c.done+' of '+c.total+' done · '+pct(c.done,c.total)+'% complete</p>'+
    splitBar(c.c,c.p,"bar")+'<div style="height:20px"></div>';

  h+='<div class="tabs" role="tablist">'+
    '<button role="tab" data-tab="concepts" aria-selected="'+(tab==="concepts")+'">Concepts'+
      '<span class="tab-n">'+c.c.done+'/'+c.c.total+'</span></button>'+
    '<button role="tab" data-tab="problems" aria-selected="'+(tab==="problems")+'">Problems'+
      '<span class="tab-n">'+c.p.done+'/'+c.p.total+'</span></button></div>';

  h+='<div class="topic-actions">'+
     '<button class="btn-add" data-addproblem="'+esc(t.id)+'">+ Add problem</button>'+
     (t.custom?'<button class="btn-ghost" data-editmodule="'+esc(t.id)+'">Rename or delete module</button>':'')+
     '</div>';

  var shown=0;
  if(tab==="concepts"){
    if(!t.concepts.length){
      h+='<div class="empty">No written notes for this topic yet.<br>'+
         'Its problems are under the <strong>Problems</strong> tab.</div>';
    }else{
      t.concepts.forEach(function(cc){
        if(!passFilter(cc.id))return;
        if(!matches(cc.title,cc.content))return;
        shown++;h+=conceptCard(cc);
      });
      if(!shown)h+='<div class="empty">No concept section matches this filter.</div>';
    }
  }else{
    if(!c.p.total){
      h+='<div class="empty">No tagged problems for this topic.<br>'+
         'The patterns are taught under the <strong>Concepts</strong> tab.</div>';
    }else{
      t.problems.forEach(function(g){
        var items=visibleProblems(g);
        if(!items.length)return;
        shown+=items.length;
        var gd=0;g.items.forEach(function(it){if(isDone(it.id))gd++;});
        var gp=pct(gd,g.items.length);
        var isOpen=openSec[g.id]!==undefined?openSec[g.id]:(!!query||filter!=="all"||true);
        h+='<section class="section'+(isOpen?" open":"")+'">'+
          '<button class="sec-head" data-sechead="'+esc(g.id)+'">'+
          '<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5 8 6l-4 3.5"/></svg></span>'+
          '<span class="sec-title">'+esc(g.title)+
            (g.source==="a2z"?' <span class="tag src-a2z" style="margin-left:4px">A2Z</span>':'')+'</span>'+
          '<span class="sec-bar'+(gp===100?" done":"")+'"><i style="width:'+gp+'%"></i></span>'+
          '<span class="sec-count tnum">'+gd+'/'+g.items.length+'</span></button>'+
          '<div class="sec-body">';
        items.forEach(function(it){h+=problemRow(it);});
        h+='</div></section>';
      });
      if(!shown)h+='<div class="empty">No problem matches this filter.</div>';
    }
  }
  view.innerHTML=h;
  highlightIn(view);
}

var pendingMerge=null;   // {local:{...}} shown as a choice on the dashboard

function countEntries(m){
  return Object.keys(m||{}).filter(function(k){
    return m[k]&&(m[k].done||(m[k].note&&m[k].note.trim()));
  }).length;
}
function customSize(c){
  return ((c&&c.topics)||[]).length+((c&&c.items)||[]).length;
}

/* First connect: decide what happens to work already in this browser. */
function adoptGist(){
  var localMap=STATE, localCustom=CUSTOM;
  var gs=gistStore();
  toast("Reading your gist\u2026");
  Promise.all([gs.load(),gs.loadCustom()]).then(function(r){
    var cloud=r[0], cloudCustom=r[1];
    var nLocal=countEntries(localMap), nCloud=countEntries(cloud);
    store=gs;
    if(customSize(localCustom)&&!customSize(cloudCustom)){
      CUSTOM=localCustom;
    }else{
      CUSTOM=cloudCustom;
    }
    if(nLocal&&!nCloud){
      STATE=localMap;
      rebuildData(); render();
      store.bulk().then(function(ok){
        toast(ok?("Uploaded "+nLocal+" items to your gist."):"Could not write to the gist.");
        renderAccount();
      });
      return;
    }
    STATE=cloud;
    rebuildData(); render();
    if(nLocal&&nCloud){
      pendingMerge={local:localMap,nLocal:nLocal,nCloud:nCloud};
      route={view:"dash",topic:null,tab:route.tab};
      render();
    }else{
      if(customSize(CUSTOM)!==customSize(cloudCustom))store.saveCustom();
      toast("Connected. "+nCloud+" items loaded from your gist.");
    }
  },function(e){
    store=localStore();
    renderAccount();
    toast(ghErrText(e));
  });
}

function applyMerge(){
  if(!pendingMerge)return;
  var local=pendingMerge.local, added=0;
  Object.keys(local).forEach(function(k){
    var l=local[k], c=STATE[k];
    if(!l)return;
    if(!c){STATE[k]={done:!!l.done,note:l.note||""};added++;return;}
    if(l.done&&!c.done){c.done=true;added++;}
    if(l.note&&l.note.trim()&&!(c.note&&c.note.trim())){c.note=l.note;added++;}
  });
  pendingMerge=null;
  render();
  store.bulk(STATE).then(function(){toast("Merged. "+added+" change"+(added===1?"":"s")+" added from this browser.");});
}

function render(){
  renderRail();
  renderAccount();
  if(route.view==="dash")renderDash();else renderTopic();
}

/* ---------- mutations ---------- */
function toggle(id){
  var s=st(id);
  STATE[id]={done:!s.done,note:s.note||""};
  render();
  store.save(id,STATE[id]).then(function(ok){
    if(!ok)toast("Could not save. Your progress may not persist.");
  });
}
function queueNote(id,text){
  var s=st(id);STATE[id]={done:!!s.done,note:text};
  var el=document.querySelector('[data-notestatus="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(el)el.textContent="Saving…";
  clearTimeout(noteTimers[id]);
  noteTimers[id]=setTimeout(function(){
    store.save(id,STATE[id]).then(function(ok){
      var e2=document.querySelector('[data-notestatus="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
      if(e2){e2.textContent=ok?"Saved":"Not saved";
        if(ok)setTimeout(function(){if(e2.textContent==="Saved")e2.textContent="";},1700);}
      renderRail();
    });
  },700);
}
function resetAll(){
  var ids=Object.keys(STATE).filter(function(k){return STATE[k].done;});
  if(!ids.length){toast("Nothing to reset.");return;}
  ids.forEach(function(id){STATE[id]={done:false,note:STATE[id].note||""};});
  render();
  store.bulk(STATE).then(function(){toast("Progress reset for "+ids.length+" item"+(ids.length===1?"":"s")+". Notes kept.");});
}
function blobDownload(payload){
  var blob=new Blob([payload],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="pattern-ledger-backup.json";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},800);
  toast("Backup downloaded.");
}
function exportBackup(){
  var payload=JSON.stringify({app:"pattern-ledger",version:2,
    exportedAt:new Date().toISOString(),state:STATE,custom:CUSTOM},null,2);
  // Hosted on claude.ai the frame blocks plain downloads; the capability handles it there.
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(dl){
      if(!dl)return blobDownload(payload);
      dl.save({filename:"pattern-ledger-backup.json",data:payload})
        .then(function(){toast("Backup saved.");},
              function(){toast("Download was declined.");});
    },function(){blobDownload(payload);});
    return;
  }
  blobDownload(payload);
}
function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var j=JSON.parse(fr.result);
      var incoming=j&&j.state?j.state:j;
      if(!incoming||typeof incoming!=="object")throw new Error("bad shape");
      var n=0;
      Object.keys(incoming).forEach(function(k){
        var v=incoming[k];
        if(v&&typeof v==="object"){
          STATE[k]={done:!!v.done,note:typeof v.note==="string"?v.note:""};n++;
        }
      });
      var nc=0;
      if(j&&j.custom&&typeof j.custom==="object"){
        var inc=j.custom;
        var have={};
        CUSTOM.topics.forEach(function(t){have[t.id]=1;});
        CUSTOM.groups.forEach(function(g){have[g.id]=1;});
        CUSTOM.items.forEach(function(it){have[it.id]=1;});
        (inc.topics||[]).forEach(function(t){if(t&&t.id&&!have[t.id]){CUSTOM.topics.push(t);nc++;}});
        (inc.groups||[]).forEach(function(g){if(g&&g.id&&!have[g.id])CUSTOM.groups.push(g);});
        (inc.items||[]).forEach(function(it){if(it&&it.id&&!have[it.id]){CUSTOM.items.push(it);nc++;}});
      }
      rebuildData();
      Promise.all([store.bulk(STATE),store.saveCustom?store.saveCustom(CUSTOM):null])
        .then(function(){render();
          toast("Imported "+n+" items"+(nc?(" and "+nc+" of your own entries"):"")+".");});
    }catch(e){toast("That file is not a Pattern Ledger backup.");}
  };
  fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el;
  if((el=e.target.closest("[data-tick]"))){toggle(el.getAttribute("data-tick"));return;}
  if((el=e.target.closest("[data-nav]"))){
    var nav=el.getAttribute("data-nav");
    route = nav==="dash" ? {view:"dash",topic:null,tab:route.tab}
                         : {view:"topic",topic:el.getAttribute("data-id"),tab:"concepts"};
    try{location.hash=route.topic||"dashboard";}catch(err){}
    closeRail();render();$("#main").scrollTop=0;return;
  }
  if((el=e.target.closest("[data-tab]"))){
    route.tab=el.getAttribute("data-tab");render();return;
  }
  if((el=e.target.closest("[data-sechead]"))){
    var sid=el.getAttribute("data-sechead");
    var cur=openSec[sid]!==undefined?openSec[sid]:(route.tab==="problems");
    openSec[sid]=!cur;render();
    return;
  }
  if((el=e.target.closest("[data-detail]"))){
    var iid=el.getAttribute("data-detail");
    openDetail[iid]=!openDetail[iid];render();
    var ta=document.getElementById("na-"+iid);if(ta)ta.focus();
    return;
  }
  if(e.target.id==="resetBtn"){
    $("#resetZone").innerHTML='<span style="font-size:13px;font-weight:600;color:var(--red)">Clear every tick?</span>'+
      '<button class="btn-danger" id="resetYes">Yes, reset</button>'+
      '<button class="btn-ghost" id="resetNo">Cancel</button>';return;
  }
  if(e.target.id==="resetYes"){resetAll();return;}
  if(e.target.id==="resetNo"){renderDash();return;}
  if(e.target.id==="exportBtn"){exportBackup();return;}
  if(e.target.id==="importBtn"){$("#importFile").click();return;}
  if(e.target.id==="newModuleBtn"){moduleForm(null);return;}
  if(e.target.id==="addProblemBtn"){problemForm(null,route.topic);return;}
  if((el=e.target.closest("[data-addproblem]"))){problemForm(null,el.getAttribute("data-addproblem"));return;}
  if((el=e.target.closest("[data-editproblem]"))){
    var ci=customItem(el.getAttribute("data-editproblem"));
    if(ci)problemForm(ci,ci.topicId);
    return;
  }
  if((el=e.target.closest("[data-editmodule]"))){
    var tid=el.getAttribute("data-editmodule");
    var ct=null;
    for(var i2=0;i2<CUSTOM.topics.length;i2++)if(CUSTOM.topics[i2].id===tid)ct=CUSTOM.topics[i2];
    if(ct)moduleForm(ct);
    return;
  }
  if((el=e.target.closest("[data-delmodule]"))){
    var dm=el.getAttribute("data-delmodule");
    if(el.getAttribute("data-armed")==="1"){deleteModule(dm);return;}
    el.setAttribute("data-armed","1");
    el.textContent="Really delete — this removes its problems";
    return;
  }
  if((el=e.target.closest("[data-delproblem]"))){
    var dp=el.getAttribute("data-delproblem");
    if(el.getAttribute("data-armed")==="1"){deleteProblem(dp);return;}
    el.setAttribute("data-armed","1");
    el.textContent="Really delete";
    return;
  }
  if(e.target.closest("[data-close]")){closeModal();return;}
  if(e.target.closest("#ghConnectBtn")){connectForm();return;}
  if(e.target.id==="ghDisconnect"){ghDisconnect();return;}
  if(e.target.id==="mergeYes"){applyMerge();return;}
  if(e.target.id==="mergeNo"){pendingMerge=null;render();toast("Keeping your account's progress.");return;}
  if(e.target.id==="menuBtn"){$("#rail").classList.add("open");$("#scrim").classList.add("show");return;}
  if(e.target.id==="scrim"){closeRail();return;}
  if(e.target.id==="themeBtn"){
    var r=document.documentElement;
    var dark=r.getAttribute("data-theme")==="dark"||
      (!r.getAttribute("data-theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-theme",dark?"light":"dark");
    try{localStorage.setItem("pl-theme",dark?"light":"dark");}catch(err){}
    return;
  }
});
function closeRail(){$("#rail").classList.remove("open");$("#scrim").classList.remove("show");}

$("#importFile").addEventListener("change",function(e){
  if(e.target.files&&e.target.files[0])importBackup(e.target.files[0]);
  e.target.value="";
});

document.addEventListener("change",function(e){
  if(!modalBack||modalBack.hidden)return;
  var form=modalBack.querySelector("#modalForm");
  if(!form)return;
  if(e.target.getAttribute("data-topicsel")){
    var gs=form.querySelector("[data-groupsel]");
    if(gs)gs.innerHTML=groupOptions(e.target.value,null);
    var ng=form.querySelector("#pNewGroup");
    if(ng)ng.hidden=true;
  }
  if(e.target.getAttribute("data-groupsel")){
    var ng2=form.querySelector("#pNewGroup");
    if(ng2){
      ng2.hidden=e.target.value!=="__new__";
      if(!ng2.hidden)ng2.focus();
    }
  }
});

var searchT;
document.addEventListener("input",function(e){
  if(e.target.id==="search"){
    clearTimeout(searchT);
    var v=e.target.value.trim().toLowerCase();
    searchT=setTimeout(function(){
      query=v;
      if(query&&route.view==="dash")route={view:"topic",topic:DATA.topics[0].id,tab:route.tab};
      render();
    },160);
    return;
  }
  var nid=e.target.getAttribute&&e.target.getAttribute("data-note");
  if(nid)queueNote(nid,e.target.value);
});

["fAll","fTodo","fDone"].forEach(function(id){
  document.getElementById(id).addEventListener("click",function(){
    filter=id==="fAll"?"all":id==="fTodo"?"todo":"done";
    ["fAll","fTodo","fDone"].forEach(function(b){
      document.getElementById(b).setAttribute("aria-pressed",b===id?"true":"false");});
    render();
  });
});

/* ---------- boot ---------- */
try{var sv=localStorage.getItem("pl-theme");if(sv)document.documentElement.setAttribute("data-theme",sv);}catch(e){}
if(window.hljs&&window.hljs.configure)window.hljs.configure({ignoreUnescapedHTML:true});

view.innerHTML='<div class="empty">Loading your curriculum…</div>';

fetch("data/curriculum.json").then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(d){
  BASE=d; rebuildData();
  var hash=(location.hash||"").replace(/^#/,"");
  if(hash&&hash!=="dashboard"){
    for(var i=0;i<DATA.topics.length;i++)
      if(DATA.topics[i].id===hash)route={view:"topic",topic:hash,tab:"concepts"};
  }
  return (window.claude&&window.claude.use)?window.claude.use("db"):null;
}).then(function(ns){
  if(ns){ store=dbStore(ns); return null; }        // hosted on claude.ai
  // self-hosted: use the gist when a token from a previous visit is present
  ghReadCreds();
  store=localStore();
  if(GH.token&&GH.gistId){
    return ghApi("/user").then(function(u){
      GH.user={login:u.login,name:u.name||u.login,avatar:u.avatar_url};
      store=gistStore();
    },function(e){
      if(e&&e.code==="bad_token"){GH.token=null;GH.gistId=null;ghWriteCreds();}
      setTimeout(function(){toast(ghErrText(e)+" Using this browser's copy.");},600);
    });
  }
  return null;
}).then(function(){
  return Promise.all([store.load(), store.loadCustom?store.loadCustom():emptyCustom()]);
}).then(function(r){
  STATE=r[0]||{};
  CUSTOM=r[1]||emptyCustom();
  rebuildData();
  render();
}).catch(function(err){
  if(!DATA){
    view.innerHTML='<div class="empty">Could not load <code>data/curriculum.json</code>.<br>'+
      esc(err&&err.message)+'<br><br>If you opened this file directly from disk, run a local server '+
      'instead: <code>python3 -m http.server</code> in this folder.</div>';
  }else{
    store=localStore();
    store.load().then(function(m){STATE=m||{};render();});
  }
});

})();
</script>
